  /* --- Idee ---------------------------------------------------------- */

  function idea(id) {
    const existing = id ? S.find('idea', id) : null;
    const i = existing || { title: '', notes: '', tags: [], areaId: null, priority: 'mittel' };

    OS.ui.form({
      title: existing ? 'Idee' : 'Neue Idee',
      subtitle: existing ? '' : 'Ohne Verpflichtung. Ideen dürfen liegen bleiben.',
      submitLabel: existing ? 'Speichern' : 'Aufnehmen',
      fields: [
        { name: 'title', label: 'Idee', value: i.title, placeholder: 'Was ist dir eingefallen?', autofocus: true },
        { name: 'notes', type: 'textarea', rows: 3, label: 'Notiz', value: i.notes, placeholder: 'Optional' },
        {
          type: 'row', fields: [
            { name: 'areaId', type: 'select', label: 'Lebensbereich', value: i.areaId || '', options: OS.ui.areaOptions() },
            {
              name: 'priority', type: 'select', label: 'Priorität', value: i.priority, options: [
                { value: 'hoch', label: 'Hoch' }, { value: 'mittel', label: 'Mittel' }, { value: 'niedrig', label: 'Niedrig' }
              ]
            }
          ]
        },
        { name: 'tags', label: 'Tags', value: (i.tags || []).join(', '), placeholder: 'mit Komma getrennt' }
      ],
      onSubmit: function (v) {
        const title = String(v.title || '').trim();
        if (!title) { OS.ui.toast('Die Idee braucht einen Satz.'); return false; }
        S.update(() => {
          const target = existing || S.addIdea({});
          target.title = title;
          target.notes = v.notes || '';
          target.areaId = v.areaId || null;
          target.priority = v.priority || 'mittel';
          target.tags = String(v.tags || '').split(',').map(s => s.trim()).filter(Boolean);
        });
      }
    });
  }

  /* --- Saison --------------------------------------------------------- */

  function season(id) {
    const existing = id ? S.find('season', id) : null;
    const weeks = S.state.settings.seasonWeeks || 12;
    const s = existing || {
      title: '', motto: '', start: U.today(), end: U.addDays(U.today(), weeks * 7 - 1)
    };

    OS.ui.form({
      title: existing ? 'Saison bearbeiten' : 'Neue Saison',
      subtitle: 'Eine Saison dauert 6 bis 12 Wochen. Sie schützt davor, alles gleichzeitig zu wollen.',
      submitLabel: existing ? 'Speichern' : 'Saison starten',
      fields: [
        { name: 'title', label: 'Titel', value: s.title, placeholder: 'z. B. Herbst', autofocus: true },
        { name: 'motto', label: 'Motto (optional)', value: s.motto, placeholder: 'Ein Satz, der die Saison trägt' },
        {
          type: 'row', fields: [
            { name: 'start', type: 'date', label: 'Start', value: s.start || '' },
            { name: 'end', type: 'date', label: 'Ende', value: s.end || '' }
          ]
        },
        { type: 'note', tone: 'note-quiet', text: 'Empfohlen sind 6 bis 12 Wochen. Kürzere Saisons wirken oft klarer.' }
      ],
      onSubmit: function (v) {
        const title = String(v.title || '').trim();
        if (!title) { OS.ui.toast('Die Saison braucht einen Titel.'); return false; }
        if (v.start && v.end && v.end < v.start) { OS.ui.toast('Das Ende liegt vor dem Start.'); return false; }
        S.update(() => {
          const target = existing || S.addSeason({});
          target.title = title;
          target.motto = v.motto || '';
          target.start = v.start || U.today();
          target.end = v.end || U.addDays(target.start, 12 * 7 - 1);
        });
      }
    });
  }

  /* --- Lebensbereich & Gewohnheit -------------------------------------- */

  function area(id) {
    const existing = id ? S.find('area', id) : null;
    const a = existing || { name: '', color: S.AREA_COLORS[S.state.areas.length % S.AREA_COLORS.length] };

    OS.ui.form({
      title: existing ? 'Lebensbereich' : 'Neuer Lebensbereich',
      submitLabel: existing ? 'Speichern' : 'Anlegen',
      size: 'sm',
      fields: [
        { name: 'name', label: 'Name', value: a.name, placeholder: 'Wie nennst du diesen Bereich?', autofocus: true },
        {
          name: 'color', type: 'select', label: 'Farbe', value: a.color,
          options: S.AREA_COLORS.map((c, i) => ({ value: c, label: 'Ton ' + (i + 1) }))
        }
      ],
      onSubmit: function (v) {
        const name = String(v.name || '').trim();
        if (!name) return false;
        S.update(() => {
          const target = existing || S.addArea({});
          target.name = name;
          target.color = v.color || target.color;
        });
      }
    });
  }

  function habit(id) {
    const existing = id ? S.find('habit', id) : null;
    OS.ui.form({
      title: existing ? 'Gewohnheit' : 'Neue Gewohnheit',
      submitLabel: existing ? 'Speichern' : 'Anlegen',
      size: 'sm',
      fields: [
        { name: 'name', label: 'Gewohnheit', value: existing ? existing.name : '', placeholder: 'Klein, täglich machbar', autofocus: true }
      ],
      onSubmit: function (v) {
        const name = String(v.name || '').trim();
        if (!name) return false;
        S.update(() => {
          const target = existing || S.addHabit({});
          target.name = name;
        });
      }
    });
  }

  /* --- Aufgabe planen --------------------------------------------------- */

  function planTask(id) {
    const t = S.find('task', id);
    if (!t) return;
    const today = U.today();

    OS.ui.modal({
      title: 'Verschieben',
      subtitle: U.trunc(t.title, 60),
      size: 'sm',
      body: '<div class="stack" style="gap:8px">' +
        [
          { label: 'Heute', date: today },
          { label: 'Morgen', date: U.addDays(today, 1) },
          { label: 'Nächster Montag', date: U.addDays(U.startOfWeek(today), 7) },
          { label: 'Ohne Datum', date: '' }
        ].map(opt =>
          '<button class="btn btn-block" data-plan="' + opt.date + '">' + opt.label +
          (opt.date ? '<span class="muted tiny" style="margin-left:auto">' + U.fmtShort(opt.date) + '</span>' : '') + '</button>').join('') +
        '<label class="field" style="margin-top:6px"><span class="field-label">Anderes Datum</span>' +
        '<input class="input" type="date" data-plan-date value="' + U.esc(t.date || '') + '"></label>' +
        '<button class="btn btn-quiet btn-block" data-archive style="margin-top:4px">Archivieren</button>' +
        '</div>',
      onMount: function (root, api) {
        root.querySelectorAll('[data-plan]').forEach(btn => {
          btn.addEventListener('click', () => {
            S.update(() => { t.date = btn.getAttribute('data-plan') || null; });
            api.close();
          });
        });
        root.querySelector('[data-plan-date]').addEventListener('change', e => {
          S.update(() => { t.date = e.target.value || null; });
          api.close();
        });
        root.querySelector('[data-archive]').addEventListener('click', () => {
          S.update(() => { t.status = 'archived'; });
          api.close();
          OS.ui.toast('Archiviert.');
        });
      }
    });
  }

  return {
    task, block, project, projectDetail, canActivate,
    goal, goalDetail, summarize,
    idea, season, area, habit, planTask,
    detailModal, refresh,
    get openDetail() { return openDetail; }
  };
})();


/* ===========================================================
   OS — Kopplung über Supabase
   Hält den Stand zwischen mehreren Geräten gleich. Ohne
   eingerichtete Verbindung bleibt die App unverändert lokal.

   Regel bei gleichzeitiger Änderung: Der zuletzt gespeicherte
   Stand gewinnt. Vor jedem Übernehmen legt OS den bisherigen
   Stand als Sicherung ab, die sich zurückholen lässt.
   =========================================================== */

OS.sync = (function () {
  'use strict';

  const U = OS.util;
  const S = OS.store;

  const SDK_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js';
  const CONFIG_KEY = 'os.sync.config';
  const BACKUP_KEY = 'os.sync.backup';
  const DEVICE_KEY = 'os.sync.device';
  const TABLE = 'os_state';
  const PUSH_DELAY = 1500;

  let client = null;
  let session = null;
  let channel = null;
  let device = '';
  let status = 'aus';        // aus | verbindet | anmeldung | gekoppelt | abgleich | fehler
  let detail = '';
  let lastSync = null;
  let applying = false;
  let lastPushed = null;
  let pushTimer = null;
  let sdkPromise = null;

  /* --- Einstellungen ---------------------------------------------- */

  function config() {
    try {
      const stored = JSON.parse(localStorage.getItem(CONFIG_KEY) || 'null');
      if (stored && stored.url && stored.key) return stored;
    } catch (err) { /* nichts hinterlegt */ }
    if (OS.config && OS.config.supabaseUrl && OS.config.supabaseKey) {
      return { url: OS.config.supabaseUrl, key: OS.config.supabaseKey };
    }
    return null;
  }

  function setConfig(url, key) {
    const clean = { url: String(url || '').trim().replace(/\/+$/, ''), key: String(key || '').trim() };
    if (!clean.url || !clean.key) return false;
    localStorage.setItem(CONFIG_KEY, JSON.stringify(clean));
    return true;
  }

  function clearConfig() {
    localStorage.removeItem(CONFIG_KEY);
    if (channel) { try { channel.unsubscribe(); } catch (err) { /* egal */ } channel = null; }
    client = null;
    session = null;
    setStatus('aus');
  }

  function deviceId() {
    try {
      let id = localStorage.getItem(DEVICE_KEY);
      if (!id) { id = U.uid('dev'); localStorage.setItem(DEVICE_KEY, id); }
      return id;
    } catch (err) { return U.uid('dev'); }
  }

  function setStatus(next, text) {
    status = next;
    detail = text || '';
    if (OS.app && OS.app.render && OS.app.current && OS.app.current.route === 'system') OS.app.render();
  }

  /* --- Sicherung ---------------------------------------------------- */

  function backup() {
    try {
      localStorage.setItem(BACKUP_KEY, JSON.stringify({
        savedAt: new Date().toISOString(), state: S.state
      }));
    } catch (err) { /* Zugabe, kein Muss */ }
  }

  function backupTime() {
    try {
      const raw = JSON.parse(localStorage.getItem(BACKUP_KEY) || 'null');
      return raw && raw.savedAt ? raw.savedAt : null;
    } catch (err) { return null; }
  }

  function restore() {
    try {
      const raw = JSON.parse(localStorage.getItem(BACKUP_KEY) || 'null');
      if (!raw || !raw.state) { OS.ui.toast('Keine Sicherung vorhanden.'); return; }
      S.importData(JSON.stringify({ state: raw.state }), 'ersetzen');
      OS.app.applySettings();
      OS.ui.toast('Vorheriger Stand wiederhergestellt.');
      schedulePush(true);
    } catch (err) {
      OS.ui.toast('Die Sicherung ließ sich nicht lesen.');
    }
  }

  /* --- SDK ----------------------------------------------------------- */

  function loadSdk() {
    if (window.supabase && window.supabase.createClient) return Promise.resolve(window.supabase);
    if (sdkPromise) return sdkPromise;
    sdkPromise = new Promise(function (resolve, reject) {
      const tag = document.createElement('script');
      tag.src = SDK_URL;
      tag.onload = function () {
        if (window.supabase && window.supabase.createClient) resolve(window.supabase);
        else reject(new Error('Die Bibliothek ließ sich nicht laden.'));
      };
      tag.onerror = function () { reject(new Error('Keine Verbindung zur Bibliothek.')); };
      document.head.appendChild(tag);
    });
    return sdkPromise;
  }

  /* --- Daten ---------------------------------------------------------- */

  function payload() {
    return {
      version: S.state.version,
      meta: S.state.meta,
      settings: S.state.settings,
      areas: S.state.areas,
      seasons: S.state.seasons,
      goals: S.state.goals,
      projects: S.state.projects,
      tasks: S.state.tasks,
      inbox: S.state.inbox,
      ideas: S.state.ideas,
      habits: S.state.habits,
      days: S.state.days,
      weeks: S.state.weeks,
      reviews: S.state.reviews,
      method255: S.state.method255,
      templates: S.state.templates
    };
  }

  function applyRemote(remote) {
    if (!remote || typeof remote !== 'object') return false;
    applying = true;
    S.importData(JSON.stringify({ state: remote }), 'ersetzen');
    applying = false;
    lastPushed = JSON.stringify(remote);
    lastSync = new Date().toISOString();
    OS.app.applySettings();
    return true;
  }

  function push() {
    if (!client || !session || applying) return Promise.resolve();
    const body = payload();
    const serialized = JSON.stringify(body);
    if (serialized === lastPushed) return Promise.resolve();

    setStatus('abgleich');
    return client.from(TABLE).upsert({
      user_id: session.user.id,
      payload: body,
      device: device,
      updated_at: new Date().toISOString()
    }).then(function (res) {
      if (res.error) throw res.error;
      lastPushed = serialized;
      lastSync = new Date().toISOString();
      setStatus('gekoppelt');
    }).catch(function (err) {
      setStatus('fehler', meldung(err));
    });
  }

  function pull() {
    if (!client || !session) return Promise.resolve(null);
    return client.from(TABLE)
      .select('payload, updated_at, device')
      .eq('user_id', session.user.id)
      .maybeSingle()
      .then(function (res) {
        if (res.error) throw res.error;
        return res.data || null;
      });
  }

  function schedulePush(immediate) {
    if (!client || !session || applying) return;
    clearTimeout(pushTimer);
    if (immediate) { push(); return; }
    pushTimer = setTimeout(push, PUSH_DELAY);
  }

  function meldung(err) {
    const msg = (err && (err.message || err.error_description)) || '';
    if (/relation .* does not exist|schema cache/i.test(msg)) return 'Die Tabelle os_state fehlt in deinem Projekt.';
    if (/row-level security|permission/i.test(msg)) return 'Die Zugriffsregeln lassen den Schreibzugriff nicht zu.';
    if (/Failed to fetch|NetworkError/i.test(msg)) return 'Keine Verbindung.';
    return msg || 'Der Abgleich ruht gerade.';
  }

  /* --- Anmeldung ------------------------------------------------------ */

  function signIn(email) {
    if (!client) return Promise.reject(new Error('Nicht eingerichtet.'));
    return client.auth.signInWithOtp({
      email: String(email || '').trim(),
      options: { emailRedirectTo: location.href.split('#')[0] }
    }).then(function (res) {
      if (res.error) throw res.error;
      return true;
    });
  }

  function signOut() {
    if (!client) return Promise.resolve();
    return client.auth.signOut().then(function () {
      session = null;
      if (channel) { try { channel.unsubscribe(); } catch (err) { /* egal */ } channel = null; }
      setStatus('anmeldung');
    });
  }

  /* --- Live-Verbindung -------------------------------------------------- */

  function listen() {
    if (!client || !session || channel) return;
    // Die Live-Verbindung braucht dasselbe Zugangstoken wie die Abfragen.
    try {
      if (client.realtime && typeof client.realtime.setAuth === 'function') {
        client.realtime.setAuth(session.access_token);
      }
    } catch (err) { /* neuere Fassungen erledigen das selbst */ }

    channel = client.channel('os-state-' + session.user.id)
      .on('postgres_changes', {
        event: '*', schema: 'public', table: TABLE,
        filter: 'user_id=eq.' + session.user.id
      }, function (message) {
        const row = message && message.new;
        if (!row || !row.payload) return;
        if (row.device === device) return;                       // eigener Widerhall
        if (JSON.stringify(row.payload) === lastPushed) return;
        backup();
        if (applyRemote(row.payload)) {
          setStatus('gekoppelt');
          OS.ui.toast('Stand vom anderen Gerät übernommen.');
        }
      })
      .subscribe();
  }

  /* --- Start ------------------------------------------------------------- */

  function start() {
    const cfg = config();
    if (!cfg) { setStatus('aus'); return; }

    device = deviceId();
    setStatus('verbindet');

    loadSdk().then(function (sdk) {
      client = sdk.createClient(cfg.url, cfg.key, {
        auth: { persistSession: true, detectSessionInUrl: true, autoRefreshToken: true }
      });

      client.auth.onAuthStateChange(function (event, next) {
        session = next;
        if (session) { afterLogin(); }
        else { setStatus('anmeldung'); }
      });

      return client.auth.getSession().then(function (res) {
        session = res.data ? res.data.session : null;
        if (!session) { setStatus('anmeldung'); return; }
        return afterLogin();
      });
    }).catch(function (err) {
      setStatus('fehler', meldung(err));
    });
  }

  function afterLogin() {
    setStatus('abgleich');
    return pull().then(function (row) {
      const localTime = S.state.meta.updatedAt || '';
      if (row && row.payload) {
        const remoteNewer = String(row.updated_at || '') > localTime;
        if (S.isEmpty() || remoteNewer) {
          backup();
          applyRemote(row.payload);
        }
      }
      listen();
      S.subscribe(function () { schedulePush(); });
      return push();
    }).then(function () {
      if (status !== 'fehler') setStatus('gekoppelt');
    }).catch(function (err) {
      setStatus('fehler', meldung(err));
    });
  }

  function syncNow() {
    if (!client || !session) { OS.ui.toast('Die Kopplung ist noch nicht eingerichtet.'); return; }
    lastPushed = null;
    pull().then(function (row) {
      if (row && row.payload && String(row.updated_at || '') > (S.state.meta.updatedAt || '')) {
        backup();
        applyRemote(row.payload);
      }
      return push();
    }).then(function () {
      OS.ui.toast('Abgeglichen.');
    }).catch(function (err) {
      setStatus('fehler', meldung(err));
    });
  }

  return {
    start: start,
    setConfig: setConfig,
    clearConfig: clearConfig,
    config: config,
    signIn: signIn,
    signOut: signOut,
    syncNow: syncNow,
    restore: restore,
    backupTime: backupTime,
    get status() { return status; },
    get detail() { return detail; },
    get lastSync() { return lastSync; },
    get email() { return session && session.user ? session.user.email : ''; }
  };
})();


/* ===========================================================
   OS — Ansicht: Heute
   Nur das, was jetzt zählt.
   =========================================================== */

OS.views = OS.views || {};

OS.views.heute = (function () {
  'use strict';

  const U = OS.util;
  const S = OS.store;

  function dateOf(params) {
    return (params && params.d) || U.today();
  }

  /* --- Teilstücke ------------------------------------------------ */

  function head(key) {
    const season = S.currentSeason();
    const isToday = key === U.today();
    const day = S.getDay(key);
    const sp = season ? S.seasonProgress(season) : null;

    return '<div class="today-head">' +
      '<span class="overline">' + (isToday ? 'Heute' : 'Tag') + ' · KW ' + U.weekNumber(U.weekKey(key)) + '</span>' +
      '<div class="today-date" style="margin-top:10px">' + U.esc(U.fmtLong(key)) + '</div>' +
      '<div class="today-meta">' +
        (season ? '<span>' + U.esc(season.title) + (sp ? ' · Woche ' + sp.week + ' von ' + sp.weeks : '') + '</span>' : '<span>Keine Saison aktiv</span>') +
        (!isToday ? '<span><button class="link-btn" data-act="heute.goToday">Zurück zu heute</button></span>' : '') +
      '</div>' +
      '<div class="intention-line">' +
        '<input class="line-input" placeholder="Tagesintention – wie willst du heute sein?" value="' +
          U.esc(day.intention) + '" data-store="day:' + key + ':intention">' +
      '</div>' +
      '</div>';
  }

  function oneThing(key) {
    const day = S.getDay(key);
    return '<div class="one-thing">' +
      '<span class="overline">Die eine Sache, die heute zählt</span>' +
      '<textarea class="ghost-area" rows="1" placeholder="Wenn heute nur eines gelingt – was ist es?" ' +
        'data-store="day:' + key + ':oneThing" data-autosize>' + U.esc(day.oneThing) + '</textarea>' +
      '</div>';
  }

  function taskSection(key) {
    const max = S.state.settings.maxTasksPerDay || 3;
    const list = S.dayTasks(key);
    const open = list.filter(t => t.status === 'open');
    const rows = list.map(t => taskRow(t)).join('');
    const slots = Math.max(0, max - open.length);
    const emptySlots = list.length >= max ? '' : Array.from({ length: Math.min(slots, max - list.filter(x => x.status === 'open').length) })
      .map(() => '<button class="slot-empty" data-act="heute.pick" data-date="' + key + '">' +
        '<span class="slot-mark"></span><span>Aufgabe wählen</span></button>').join('');

    return '<section class="section">' +
      '<div class="section-head">' +
        '<h3>Heute</h3>' +
        '<div class="section-tools">' +
          '<span class="tiny muted">' + open.length + ' von ' + max + '</span>' +
          '<button class="link-btn" data-act="heute.pick" data-date="' + key + '">Wählen</button>' +
        '</div>' +
      '</div>' +
      (rows || '') +
      emptySlots +
      (open.length > max ? '<div class="note" style="margin-top:14px">Mehr als ' + max + ' Aufgaben für heute. Was darf warten?</div>' : '') +
      '</section>';
  }

  function taskRow(t) {
    const project = t.projectId ? S.find('project', t.projectId) : null;
    return '<div class="task-row' + (t.status === 'done' ? ' is-done' : '') + '">' +
      OS.ui.checkbox(t.status === 'done', 'data-act="os.taskToggle" data-id="' + t.id + '"') +
      '<div class="task-title">' + U.esc(t.title) +
        ((project || t.areaId) ? '<div class="task-meta">' +
          (project ? '<button class="chip chip-btn" data-act="os.projectOpen" data-id="' + project.id + '">' + U.esc(U.trunc(project.name, 28)) + '</button>' : '') +
          OS.ui.areaChip(t.areaId) + '</div>' : '') +
      '</div>' +
      '<div class="li-actions">' +
        OS.ui.iconBtn('calendar', 'os.taskPlan', 'Verschieben', 'data-id="' + t.id + '"') +
        OS.ui.iconBtn('edit', 'os.taskEdit', 'Bearbeiten', 'data-id="' + t.id + '"') +
        OS.ui.iconBtn('archive', 'os.taskArchive', 'Archivieren', 'data-id="' + t.id + '"') +
      '</div>' +
      '</div>';
  }

  function blockSection(key) {
    const blocks = S.dayBlocks(key);
    const planned = S.dayPlannedHours(key);

    return '<section class="section">' +
      '<div class="section-head">' +
        '<h3>Zeitblöcke</h3>' +
        '<div class="section-tools">' +
          (planned ? '<span class="tiny muted">' + U.fmtHours(planned) + ' geplant</span>' : '') +
          '<button class="link-btn" data-act="heute.addBlock" data-date="' + key + '">Block</button>' +
        '</div>' +
      '</div>' +
      (blocks.length ? '<div class="blocks">' + blocks.map(b => {
        const task = b.taskId ? S.find('task', b.taskId) : null;
        return '<div class="block-row type-' + U.esc(b.type) + '">' +
          '<span class="block-time">' + U.esc(b.start) + ' – ' + U.esc(b.end) + '</span>' +
          '<span class="block-label">' + U.esc(b.label) +
            (task ? '<span class="muted small"> · ' + U.esc(U.trunc(task.title, 34)) + '</span>' : '') + '</span>' +
          '<span class="li-actions">' +
            OS.ui.iconBtn('edit', 'heute.editBlock', 'Bearbeiten', 'data-date="' + key + '" data-block="' + b.id + '"') +
          '</span>' +
          '</div>';
      }).join('') + '</div>'
        : '<div class="empty">Noch keine Zeitblöcke. Ein Block genügt, um dem Tag Form zu geben.</div>') +
      '</section>';
  }

  function habitSection(key) {
    const habits = S.habits();
    if (!habits.length) {
      return '<section class="section">' +
        '<div class="section-head"><h3>Gewohnheiten</h3></div>' +
        '<div class="empty">Keine Gewohnheiten angelegt.' +
        '<div style="margin-top:12px"><button class="btn btn-sm" data-act="os.habitNew">Gewohnheit anlegen</button></div></div>' +
        '</section>';
    }
    return '<section class="section">' +
      '<div class="section-head"><h3>Gewohnheiten</h3>' +
        '<button class="link-btn" data-act="os.habitNew">Neu</button></div>' +
      '<div class="habit-list">' + habits.map(h => {
        const done = S.habitDone(h, key);
        return '<div class="habit-row' + (done ? ' is-done' : '') + '">' +
          OS.ui.checkbox(done, 'data-act="heute.toggleHabit" data-id="' + h.id + '" data-date="' + key + '"') +
          '<span class="habit-name">' + U.esc(h.name) + '</span>' +
          '</div>';
      }).join('') + '</div>' +
      '</section>';
  }

  function inboxSection() {
    const items = S.inbox().slice(0, 4);
    const total = S.state.inbox.length;
    return '<section class="section">' +
      '<div class="section-head"><h3>Inbox</h3>' +
        '<button class="link-btn" data-act="ui.inbox">' + (total ? total + ' offen' : 'Öffnen') + '</button></div>' +
      (items.length ? '<div class="list inbox-preview">' + items.map(item =>
        '<div class="list-item">' +
          '<div class="li-main">' +
            '<div class="li-title small">' + U.esc(U.trunc(item.text, 90)) + '</div>' +
            '<div class="li-meta"><span class="kind-mark">' + U.esc(S.INBOX_KIND_LABEL[item.kind] || '') + '</span></div>' +
          '</div>' +
          '<div class="li-actions">' +
            OS.ui.iconBtn('arrowRight', 'heute.inboxToToday', 'Für heute übernehmen', 'data-id="' + item.id + '"') +
          '</div>' +
        '</div>').join('') + '</div>'
        : '<div class="empty">Die Inbox ist leer.</div>') +
      '</section>';
  }

  function checkinSection(key) {
    const day = S.getDay(key);
    const moods = ['ruhig', 'wach', 'gedrückt', 'unruhig', 'zufrieden'];
    return '<section class="section">' +
      '<div class="section-head"><h3>Check-in</h3></div>' +
      '<div class="stack" style="gap:18px">' +
        '<div class="field"><span class="field-label">Energie</span>' +
          '<div class="scale">' + [1, 2, 3, 4, 5].map(n =>
            '<button class="scale-dot' + (day.checkin.energy === n ? ' is-on' : '') + '" data-act="heute.energy" data-date="' + key + '" data-value="' + n + '">' + n + '</button>').join('') +
          '</div></div>' +
        '<div class="field"><span class="field-label">Stimmung</span>' +
          '<div class="mood-row">' + moods.map(m =>
            '<button class="chip chip-btn' + (day.checkin.mood === m ? ' is-on' : '') + '" data-act="heute.mood" data-date="' + key + '" data-value="' + m + '">' + m + '</button>').join('') +
          '</div></div>' +
        '<label class="field"><span class="field-label">Notiz</span>' +
          '<textarea class="textarea" rows="2" placeholder="Ein Satz genügt." data-store="day:' + key + ':checkin.note">' + U.esc(day.checkin.note) + '</textarea></label>' +
      '</div>' +
      '</section>';
  }

  function closeSection(key) {
    const day = S.getDay(key);
    const done = S.tasks({ date: key, status: 'done' });
    const habitsDone = S.habits().filter(h => S.habitDone(h, key));

    return '<section class="close-day">' +
      '<span class="overline">Tagesabschluss</span>' +
      (done.length || habitsDone.length
        ? '<ul class="done-list">' +
          done.map(t => '<li>' + U.esc(t.title) + '</li>').join('') +
          habitsDone.map(h => '<li>' + U.esc(h.name) + '</li>').join('') +
          '</ul>'
        : '<p class="small muted" style="margin-top:10px">Noch nichts abgehakt. Das ist auch eine Antwort.</p>') +
      '<div class="grid grid-2" style="margin-top:22px">' +
        '<label class="field"><span class="field-label">Was wurde fertig?</span>' +
          '<textarea class="textarea" rows="3" placeholder="Auch Kleines zählt." data-store="day:' + key + ':close.done">' + U.esc(day.close.done) + '</textarea></label>' +
        '<label class="field"><span class="field-label">Was nehme ich mit?</span>' +
          '<textarea class="textarea" rows="3" placeholder="Eine Beobachtung, ein Satz." data-store="day:' + key + ':close.takeaway">' + U.esc(day.close.takeaway) + '</textarea></label>' +
      '</div>' +
      (S.tasks({ date: key, status: 'open' }).length
        ? '<div class="row" style="margin-top:20px;gap:8px">' +
          '<span class="small muted" style="margin-right:auto">Offen geblieben? Nichts davon ist verloren.</span>' +
          '<button class="btn btn-sm" data-act="heute.carryOver" data-date="' + key + '">Auf morgen verschieben</button>' +
          '<button class="btn btn-sm" data-act="heute.unplanRest" data-date="' + key + '">Datum entfernen</button>' +
          '</div>' : '') +
      '</section>';
  }

  /* --- Rendern ---------------------------------------------------- */

  function render(params) {
    const key = dateOf(params);
    return head(key) +
      oneThing(key) +
      '<div class="today-grid">' +
        '<div>' + taskSection(key) + blockSection(key) + '</div>' +
        '<div>' + habitSection(key) + checkinSection(key) + inboxSection() + '</div>' +
      '</div>' +
      closeSection(key);
  }

  /* --- Aktionen ---------------------------------------------------- */

  function pickModal(dateKey) {
    const max = S.state.settings.maxTasksPerDay || 3;
    const open = S.tasks({ date: dateKey, status: 'open' }).length;

    function body() {
      const candidates = S.tasks({ status: 'open' }).filter(t => t.date !== dateKey);
      const unplanned = candidates.filter(t => !t.date);
      const later = candidates.filter(t => t.date);
      const inbox = S.inbox().filter(i => i.kind === 'aufgabe');
      const projects = S.activeProjects().filter(p => (p.nextAction || '').trim());

      function taskList(list, label) {
        if (!list.length) return '';
        return '<div class="field"><span class="field-label">' + label + '</span><div class="list">' +
          list.slice(0, 12).map(t =>
            '<div class="list-item"><div class="li-main"><div class="li-title small">' + U.esc(t.title) + '</div>' +
              (t.date ? '<div class="li-meta"><span class="chip">' + U.esc(U.fmtRelative(t.date)) + '</span></div>' : '') +
            '</div><button class="btn btn-sm" data-take="' + t.id + '">Übernehmen</button></div>').join('') +
          '</div></div>';
      }

      return '<div class="stack" style="gap:20px">' +
        '<label class="field"><span class="field-label">Neue Aufgabe</span>' +
          '<input class="input" data-new-task placeholder="Was zählt heute?" data-autofocus></label>' +
        (open >= max ? '<div class="note">Für heute sind schon ' + open + ' Aufgaben gewählt. Mehr wird selten besser.</div>' : '') +
        taskList(unplanned, 'Ohne Datum') +
        taskList(later, 'Aus anderen Tagen') +
        (inbox.length ? '<div class="field"><span class="field-label">Aus der Inbox</span><div class="list">' +
          inbox.slice(0, 8).map(i =>
            '<div class="list-item"><div class="li-main"><div class="li-title small">' + U.esc(U.trunc(i.text, 80)) + '</div></div>' +
            '<button class="btn btn-sm" data-inbox="' + i.id + '">Übernehmen</button></div>').join('') +
          '</div></div>' : '') +
        (projects.length ? '<div class="field"><span class="field-label">Nächste Handlung aus Projekten</span><div class="list">' +
          projects.map(p =>
            '<div class="list-item"><div class="li-main"><div class="li-title small">' + U.esc(p.nextAction) + '</div>' +
            '<div class="li-meta"><span class="chip">' + U.esc(U.trunc(p.name, 28)) + '</span></div></div>' +
            '<button class="btn btn-sm" data-project="' + p.id + '">Übernehmen</button></div>').join('') +
          '</div></div>' : '') +
        (!unplanned.length && !later.length && !inbox.length && !projects.length
          ? '<div class="empty">Es gibt nichts zu wählen. Schreib oben eine Aufgabe.</div>' : '') +
        '</div>';
    }

    OS.ui.modal({
      title: 'Aufgabe für ' + (dateKey === U.today() ? 'heute' : U.fmtShort(dateKey)),
      subtitle: 'Höchstens ' + max + ' Aufgaben. Der Rest bleibt in Woche und Projekten.',
      body: body(),
      onMount: function (root, api) {
        const input = root.querySelector('[data-new-task]');
        input.addEventListener('keydown', e => {
          if (e.key !== 'Enter') return;
          const title = input.value.trim();
          if (!title) return;
          S.update(() => S.addTask({ title: title, date: dateKey }));
          api.close();
        });
        root.querySelectorAll('[data-take]').forEach(btn => btn.addEventListener('click', () => {
          S.update(() => {
            const t = S.find('task', btn.getAttribute('data-take'));
            if (t) t.date = dateKey;
          });
          api.close();
        }));
        root.querySelectorAll('[data-inbox]').forEach(btn => btn.addEventListener('click', () => {
          S.update(() => {
            const id = btn.getAttribute('data-inbox');
            const item = S.find('inbox', id);
            if (item) { S.addTask({ title: item.text, date: dateKey }); S.remove('inbox', id); }
          });
          api.close();
        }));
        root.querySelectorAll('[data-project]').forEach(btn => btn.addEventListener('click', () => {
          S.update(() => {
            const p = S.find('project', btn.getAttribute('data-project'));
            if (p) S.addTask({ title: p.nextAction, date: dateKey, projectId: p.id, areaId: p.areaId });
          });
          api.close();
        }));
      }
    });
  }

  const actions = {
    'heute.goToday': function () { OS.app.go('#/heute'); },
    'heute.pick': function (el, ds) { pickModal(ds.date || U.today()); },
    'heute.addBlock': function (el, ds) { OS.forms.block(ds.date || U.today()); },
    'heute.editBlock': function (el, ds) { OS.forms.block(ds.date, ds.block); },
    'heute.toggleHabit': function (el, ds) {
      S.update(() => S.toggleHabit(ds.id, ds.date));
    },
    'heute.energy': function (el, ds) {
      S.update(() => {
        const d = S.ensureDay(ds.date);
        const v = Number(ds.value);
        d.checkin.energy = d.checkin.energy === v ? null : v;
      });
    },
    'heute.mood': function (el, ds) {
      S.update(() => {
        const d = S.ensureDay(ds.date);
        d.checkin.mood = d.checkin.mood === ds.value ? '' : ds.value;
      });
    },
    'heute.inboxToToday': function (el, ds) {
      S.update(() => {
        const item = S.find('inbox', ds.id);
        if (!item) return;
        S.addTask({ title: item.text, date: U.today() });
        S.remove('inbox', ds.id);
      });
      OS.ui.toast('Für heute übernommen.');
    },
    'heute.carryOver': function (el, ds) {
      const next = U.addDays(ds.date, 1);
      let count = 0;
      S.update(() => {
        S.tasks({ date: ds.date, status: 'open' }).forEach(t => { t.date = next; count++; });
      });
      OS.ui.toast(count + ' ' + U.plural(count, 'Aufgabe', 'Aufgaben') + ' auf morgen verschoben.');
    },
    'heute.unplanRest': function (el, ds) {
      let count = 0;
      S.update(() => {
        S.tasks({ date: ds.date, status: 'open' }).forEach(t => { t.date = null; count++; });
      });
      OS.ui.toast(count + ' ' + U.plural(count, 'Aufgabe', 'Aufgaben') + ' ohne Datum abgelegt.');
    }
  };

  return { render: render, actions: actions, title: 'Heute' };
})();


/* ===========================================================
   OS — Ansicht: Woche
   Planung trifft ehrliche Kapazität.
   =========================================================== */

OS.views.woche = (function () {
  'use strict';

  const U = OS.util;
  const S = OS.store;

  function weekOf(params) {
    return (params && params.w) || U.weekKey(U.today());
  }

  /* --- Kopf ------------------------------------------------------- */

  function head(wKey) {
    const days = U.weekDays(wKey);
    const week = S.getWeek(wKey);
    const isCurrent = wKey === U.weekKey(U.today());

    return '<div class="page-head">' +
      '<div class="page-head-row">' +
        '<div>' +
          '<span class="overline">Woche</span>' +
          '<h1 style="margin-top:12px">KW ' + U.weekNumber(wKey) + '</h1>' +
          '<div class="page-sub">' + U.esc(U.fmtMedium(days[0])) + ' – ' + U.esc(U.fmtMedium(days[6])) + '</div>' +
        '</div>' +
        '<div class="week-nav">' +
          '<button class="icon-btn" data-act="woche.prev" data-w="' + wKey + '" title="Vorige Woche">' + U.icons.chevronL + '</button>' +
          (isCurrent ? '' : '<button class="btn btn-sm" data-act="woche.now">Diese Woche</button>') +
          '<button class="icon-btn" data-act="woche.next" data-w="' + wKey + '" title="Nächste Woche">' + U.icons.chevronR + '</button>' +
          '<button class="btn btn-sm" data-act="woche.review" data-w="' + wKey + '" style="margin-left:8px">Wochenreview</button>' +
        '</div>' +
      '</div>' +
      '<div style="margin-top:26px">' +
        '<span class="overline">Wochenfokus</span>' +
        '<textarea class="ghost-area serif-input" rows="1" style="margin-top:8px" placeholder="Ein Satz für diese Woche." ' +
          'data-store="week:' + wKey + ':focus" data-autosize>' + U.esc(week.focus) + '</textarea>' +
      '</div>' +
      '</div>';
  }

  function top3(wKey) {
    const week = S.getWeek(wKey);
    return '<section class="section">' +
      '<div class="section-head"><h3>Drei Prioritäten</h3></div>' +
      '<div class="stack" style="gap:2px">' +
        week.top3.map((value, i) =>
          '<div class="task-row" style="align-items:center">' +
            '<span class="nav-num" style="width:16px">' + (i + 1) + '</span>' +
            '<input class="line-input" style="flex:1" placeholder="Priorität ' + (i + 1) + '" value="' + U.esc(value) + '" ' +
              'data-store="week:' + wKey + ':top3.' + i + '">' +
          '</div>').join('') +
      '</div>' +
      '</section>';
  }

  function capacity(wKey) {
    const cap = S.weekCapacity(wKey);
    const items = [
      { num: cap.focusBlocks, label: 'Fokusblöcke' },
      { num: U.fmtHours(cap.focusHours), label: 'Fokuszeit' },
      { num: cap.termine, label: 'Termine' },
      { num: cap.taskCount, label: 'Offene Aufgaben' },
      { num: U.fmtHours(cap.free), label: 'Freie Zeit' }
    ];
    return '<div class="capacity-bar">' +
      items.map(i => '<div class="cap-item"><span class="cap-num">' + U.esc(i.num) + '</span>' +
        '<span class="cap-label">' + U.esc(i.label) + '</span></div>').join('') +
      '<div class="cap-spacer"></div>' +
      '<div class="cap-item" style="min-width:150px">' +
        '<span class="cap-label" style="margin-bottom:6px">Auslastung</span>' +
        OS.ui.progressBar(cap.load * 100, cap.load > 0.85 ? 'progress-accent' : '') +
      '</div>' +
      '</div>';
  }

  function dayColumn(key, wKey) {
    const today = U.today();
    const blocks = S.dayBlocks(key);
    const tasks = S.dayTasks(key);
    const open = tasks.filter(t => t.status === 'open');
    const maxTasks = S.state.settings.maxTasksPerDay || 3;
    const planned = S.dayPlannedHours(key);
    const capH = S.state.settings.dailyCapacityHours || 6;
    const load = capH ? U.clamp(planned / capH, 0, 1) : 0;
    const isWeekend = U.dow(key) >= 5;

    const termine = blocks.filter(b => b.type === 'termin');
    const fokus = blocks.filter(b => b.type !== 'termin');

    function blockHtml(b) {
      return '<div class="mini-block type-' + U.esc(b.type) + '" data-act="heute.editBlock" data-date="' + key + '" data-block="' + b.id + '">' +
        '<span class="mb-time">' + U.esc(b.start) + '–' + U.esc(b.end) + '</span>' + U.esc(U.trunc(b.label, 40)) +
        '</div>';
    }

    return '<div class="day-col' + (key === today ? ' is-today' : '') + (isWeekend ? ' is-weekend' : '') +
      '" data-day="' + key + '" data-drop="' + key + '">' +
      '<div class="day-head">' +
        '<span class="day-name">' + U.esc(U.fmtWeekday(key)) + '</span>' +
        '<span class="day-num">' + (U.parseKey(key) ? U.parseKey(key).getDate() : '') + '</span>' +
      '</div>' +
      '<div class="day-cap' + (load >= 1 ? ' is-full' : '') + '"><i style="width:' + Math.round(load * 100) + '%"></i></div>' +
      (open.length > maxTasks ? '<div class="day-warn">Viel geplant – ' + open.length + ' Aufgaben.</div>' : '') +
      (termine.length ? '<div class="day-section"><div class="ds-label">Termine</div>' + termine.map(blockHtml).join('') + '</div>' : '') +
      (fokus.length ? '<div class="day-section"><div class="ds-label">Fokus</div>' + fokus.map(blockHtml).join('') + '</div>' : '') +
      '<div class="day-section">' +
        (tasks.length ? '<div class="ds-label">Aufgaben</div>' : '') +
        tasks.map(taskChip).join('') +
      '</div>' +
      '<div class="day-add">' +
        '<button data-act="woche.addTask" data-date="' + key + '">+ Aufgabe</button>' +
        '<button data-act="heute.addBlock" data-date="' + key + '">+ Block</button>' +
      '</div>' +
      '</div>';
  }

  function taskChip(t) {
    const project = t.projectId ? S.find('project', t.projectId) : null;
    return '<div class="task-chip' + (t.status === 'done' ? ' is-done' : '') + '" draggable="true" data-task="' + t.id + '">' +
      OS.ui.checkbox(t.status === 'done', 'data-act="os.taskToggle" data-id="' + t.id + '"') +
      '<span class="tc-title" data-act="os.taskEdit" data-id="' + t.id + '">' + U.esc(t.title) +
        (project ? '<span class="muted tiny" style="display:block">' + U.esc(U.trunc(project.name, 22)) + '</span>' : '') +
      '</span>' +
      '</div>';
  }

  function grid(wKey) {
    return '<div class="week-grid">' + U.weekDays(wKey).map(k => dayColumn(k, wKey)).join('') + '</div>';
  }

  function pool() {
    const list = S.unplannedTasks();
    return '<section class="section">' +
      '<div class="section-head"><h3>Ohne Tag</h3>' +
        '<div class="section-tools"><span class="tiny muted">Ziehen, um zu planen</span>' +
        '<button class="link-btn" data-act="woche.addTask">Neu</button></div></div>' +
      (list.length
        ? '<div class="pool" data-drop="">' + list.map(taskChip).join('') + '</div>'
        : '<div class="empty" data-drop="">Alles hat einen Platz. Aufgaben ohne Tag landen hier.</div>') +
      '</section>';
  }

  function nextActions() {
    const list = S.activeProjects();
    if (!list.length) return '';
    return '<section class="section">' +
      '<div class="section-head"><h3>Nächste Handlungen</h3>' +
        '<button class="link-btn" data-act="ui.goProjects">Projekte</button></div>' +
      list.map(p =>
        '<div class="next-action-row">' +
          '<div>' +
            '<button class="na-project link-btn" data-act="os.projectOpen" data-id="' + p.id + '">' + U.esc(p.name) + '</button>' +
            '<div class="na-text' + (p.nextAction ? '' : ' na-empty') + '">' +
              U.esc(p.nextAction || 'Noch keine nächste Handlung festgelegt.') + '</div>' +
          '</div>' +
          (p.nextAction
            ? '<button class="btn btn-sm" data-act="woche.planNext" data-id="' + p.id + '">Einplanen</button>'
            : '<button class="btn btn-sm" data-act="os.projectOpen" data-id="' + p.id + '">Festlegen</button>') +
        '</div>').join('') +
      '</section>';
  }

  function habitMatrix(wKey) {
    const habits = S.habits();
    const days = U.weekDays(wKey);
    const today = U.today();
    if (!habits.length) return '';

    return '<section class="section">' +
      '<div class="section-head"><h3>Gewohnheiten</h3>' +
        '<button class="link-btn" data-act="ui.goHabits">Verwalten</button></div>' +
      '<table class="habit-matrix"><thead><tr><th class="hm-name"></th>' +
        days.map(k => '<th>' + U.esc(U.fmtWeekday(k)) + '</th>').join('') + '<th></th></tr></thead><tbody>' +
      habits.map(h => {
        const count = days.filter(k => S.habitDone(h, k)).length;
        return '<tr><td class="hm-name">' + U.esc(h.name) + '</td>' +
          days.map(k => '<td><button class="hm-cell' + (S.habitDone(h, k) ? ' is-on' : '') + (k > today ? ' is-future' : '') +
            '" data-act="heute.toggleHabit" data-id="' + h.id + '" data-date="' + k + '" aria-label="' + U.esc(h.name + ' ' + U.fmtShort(k)) + '"></button></td>').join('') +
          '<td class="hm-count">' + count + '/7</td></tr>';
      }).join('') +
      '</tbody></table>' +
      '</section>';
  }

  function notThisWeek(wKey) {
    const week = S.getWeek(wKey);
    return '<section class="section">' +
      '<div class="section-head"><h3>Diese Woche nicht</h3>' +
        '<button class="link-btn" data-act="woche.addNot" data-w="' + wKey + '">Hinzufügen</button></div>' +
      '<p class="small muted" style="margin-bottom:12px">Bewusst nicht priorisiert. Das ist eine Entscheidung, kein Versäumnis.</p>' +
      (week.notThisWeek.length
        ? '<div class="list not-list">' + week.notThisWeek.map(item =>
          '<div class="list-item"><div class="li-main"><div class="li-title">' + U.esc(item.text) + '</div></div>' +
          '<div class="li-actions">' + OS.ui.iconBtn('trash', 'woche.removeNot', 'Entfernen', 'data-w="' + wKey + '" data-id="' + item.id + '"') + '</div></div>').join('') + '</div>'
        : '<div class="empty">Noch nichts eingetragen.</div>') +
      '</section>';
  }

  /* --- Rendern ------------------------------------------------------ */

  function render(params) {
    const wKey = weekOf(params);
    return head(wKey) +
      capacity(wKey) +
      grid(wKey) +
      '<div class="grid grid-2" style="margin-top:46px;align-items:start">' +
        '<div>' + top3(wKey) + pool() + '</div>' +
        '<div>' + habitMatrix(wKey) + notThisWeek(wKey) + '</div>' +
      '</div>' +
      nextActions();
  }

  /* --- Drag & Drop ---------------------------------------------------- */

  function mount(root, params) {
    let draggedId = null;

    root.querySelectorAll('[data-task]').forEach(chip => {
      chip.addEventListener('dragstart', e => {
        draggedId = chip.getAttribute('data-task');
        chip.classList.add('is-dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', draggedId); } catch (err) { /* egal */ }
      });
      chip.addEventListener('dragend', () => {
        draggedId = null;
        chip.classList.remove('is-dragging');
        root.querySelectorAll('.is-over').forEach(el => el.classList.remove('is-over'));
      });
    });

    root.querySelectorAll('[data-drop]').forEach(zone => {
      const col = zone.closest('.day-col') || zone;

      zone.addEventListener('dragover', e => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        col.classList.add('is-over');
      });
      zone.addEventListener('dragleave', () => col.classList.remove('is-over'));
      zone.addEventListener('drop', e => {
        e.preventDefault();
        col.classList.remove('is-over');
        const id = draggedId || (e.dataTransfer && e.dataTransfer.getData('text/plain'));
        if (!id) return;
        const date = zone.getAttribute('data-drop') || null;
        S.update(() => {
          const t = S.find('task', id);
          if (t) t.date = date || null;
        });
      });
    });
  }

  /* --- Aktionen -------------------------------------------------------- */

  const actions = {
    'woche.prev': function (el, ds) { OS.app.go('#/woche?w=' + U.shiftWeek(ds.w, -1)); },
    'woche.next': function (el, ds) { OS.app.go('#/woche?w=' + U.shiftWeek(ds.w, 1)); },
    'woche.now': function () { OS.app.go('#/woche'); },
    'woche.review': function (el, ds) { OS.views.system.weekReview(ds.w); },
    'woche.addTask': function (el, ds) { OS.forms.task(null, { date: ds.date || null }); },
    'woche.planNext': function (el, ds) {
      const p = S.find('project', ds.id);
      if (!p) return;
      OS.forms.task(null, {
        title: p.nextAction, projectId: p.id, areaId: p.areaId, date: U.today()
      });
    },
    'woche.addNot': async function (el, ds) {
      const text = await OS.ui.prompt({
        title: 'Diese Woche nicht',
        label: 'Was schiebst du bewusst weg?',
        placeholder: 'z. B. ein Thema, das warten darf'
      });
      if (!text) return;
      S.update(() => {
        const w = S.ensureWeek(ds.w);
        w.notThisWeek.push({ id: U.uid('nw'), text: text });
      });
    },
    'woche.removeNot': function (el, ds) {
      S.update(() => {
        const w = S.ensureWeek(ds.w);
        const i = w.notThisWeek.findIndex(x => x.id === ds.id);
        if (i >= 0) w.notThisWeek.splice(i, 1);
      });
    }
  };

  return { render: render, mount: mount, actions: actions, title: 'Woche' };
})();


/* ===========================================================
   OS — Ansicht: Saison
   6 bis 12 Wochen. Nicht alles gleichzeitig.
   =========================================================== */

OS.views.saison = (function () {
  'use strict';

  const U = OS.util;
  const S = OS.store;

  function seasonOf(params) {
    if (params && params.s) {
      const found = S.find('season', params.s);
      if (found) return found;
    }
    return S.currentSeason();
  }

  /* --- Kopf --------------------------------------------------------- */

  function hero(season) {
    const p = S.seasonProgress(season);
    const goals = S.seasonGoals(season.id);
    const areas = [];
    goals.forEach(g => {
      const a = S.area(g.areaId);
      if (a && !areas.some(x => x.id === a.id)) areas.push(a);
    });

    return '<div class="season-hero">' +
      '<div class="spread" style="align-items:flex-start">' +
        '<div style="flex:1;min-width:0">' +
          '<span class="overline">Saison</span>' +
          '<input class="line-input season-title" style="margin-top:8px;display:block" value="' + U.esc(season.title) + '" ' +
            'placeholder="Titel der Saison" data-store="season:' + season.id + ':title">' +
          '<input class="line-input season-motto" style="display:block" value="' + U.esc(season.motto) + '" ' +
            'placeholder="Motto (optional)" data-store="season:' + season.id + ':motto">' +
          '<div class="season-dates">' +
            U.esc(U.fmtMedium(season.start)) + ' bis ' + U.esc(U.fmtMedium(season.end)) +
            ' · <button class="link-btn" data-act="saison.edit" data-id="' + season.id + '">Zeitraum ändern</button>' +
          '</div>' +
        '</div>' +
        '<div class="row row-tight">' + seasonSwitcher(season) + '</div>' +
      '</div>' +
      '<div class="season-timeline">' +
        OS.ui.progressBar(p.pct) +
        '<div class="season-time-meta">' +
          '<span>Woche ' + p.week + ' von ' + p.weeks + '</span>' +
          '<span>' + (p.daysLeft > 0 ? 'noch ' + p.daysLeft + ' ' + U.plural(p.daysLeft, 'Tag', 'Tage') : 'abgelaufen') + '</span>' +
        '</div>' +
      '</div>' +
      (areas.length ? '<div class="chips" style="margin-top:18px">' +
        areas.map(a => OS.ui.areaChip(a.id)).join('') + '</div>' : '') +
      '</div>';
  }

  function seasonSwitcher(current) {
    const list = S.state.seasons.filter(s => !s.archived);
    if (list.length < 2) return '<button class="btn btn-sm" data-act="saison.new">Neue Saison</button>';
    return '<select class="select" style="width:auto" data-act="saison.switch">' +
      list.map(s => '<option value="' + s.id + '"' + (s.id === current.id ? ' selected' : '') + '>' +
        U.esc(s.title || 'Saison') + '</option>').join('') +
      '</select>' +
      '<button class="btn btn-sm" data-act="saison.new">Neue Saison</button>';
  }

  /* --- Ziele --------------------------------------------------------- */

  function goalCard(goal) {
    const progress = S.goalProgress(goal);
    const linked = S.projects({ goalId: goal.id });

    return '<article class="card card-hover goal-card">' +
      '<div class="card-head">' +
        '<div>' +
          '<span class="overline">' + U.esc(S.GOAL_STATUS_LABEL[goal.status] || '') + '</span>' +
          '<h3 style="margin-top:6px">' + U.esc(goal.title || 'Ohne Titel') + '</h3>' +
        '</div>' +
        OS.ui.iconBtn('edit', 'os.goalOpen', 'Öffnen', 'data-id="' + goal.id + '"') +
      '</div>' +
      (goal.why ? '<div class="goal-why">' + U.nl2br(U.trunc(goal.why, 220)) + '</div>' : '') +
      (goal.metric ? '<div class="goal-metric">' + U.nl2br(U.trunc(goal.metric, 200)) + '</div>' : '') +
      (goal.summary ? '<div class="tiny muted" style="white-space:pre-wrap">' + U.esc(U.trunc(goal.summary, 260)) + '</div>' : '') +
      '<div class="goal-foot">' +
        '<div class="spread" style="margin-bottom:6px">' +
          '<span class="tiny muted">' + (goal.progressMode === 'abgeleitet' ? 'aus Meilensteinen' : 'Fortschritt') + '</span>' +
          '<span class="tiny muted">' + progress + ' %</span>' +
        '</div>' +
        OS.ui.progressBar(progress) +
        (linked.length
          ? '<div class="goal-projects">' + linked.map(p =>
            '<button class="goal-project-link" data-act="os.projectOpen" data-id="' + p.id + '">' +
              '<i class="dot dot-' + U.esc(p.status) + '"></i>' + U.esc(U.trunc(p.name, 34)) +
              '<span class="tiny muted" style="margin-left:auto">' + S.projectProgress(p) + ' %</span>' +
            '</button>').join('') + '</div>'
          : '<div class="tiny muted" style="margin-top:10px">Noch kein Projekt zugeordnet.</div>') +
        '<div class="chips" style="margin-top:12px">' +
          OS.ui.areaChip(goal.areaId) +
          '<button class="chip chip-btn" data-act="os.projectNew" data-goal="' + goal.id + '">' + U.icons.plus + ' Projekt</button>' +
        '</div>' +
      '</div>' +
      '</article>';
  }

  function goalSection(season) {
    const goals = S.seasonGoals(season.id);
    return '<section class="section">' +
      '<div class="section-head">' +
        '<h2>Saisonziele</h2>' +
        '<div class="section-tools">' +
          '<span class="tiny muted">' + goals.length + ' von 3–5</span>' +
          '<button class="btn btn-sm" data-act="saison.newGoal" data-id="' + season.id + '">Ziel</button>' +
        '</div>' +
      '</div>' +
      (goals.length
        ? '<div class="grid grid-auto">' + goals.map(goalCard).join('') + '</div>'
        : OS.ui.emptyState('Noch keine Saisonziele',
          'Drei bis fünf Ziele geben einer Saison Form. Weniger ist meistens klarer.',
          '<button class="btn btn-sm" data-act="saison.newGoal" data-id="' + season.id + '">Erstes Ziel</button>' +
          (S.topWishes().length ? ' <button class="btn btn-sm" data-act="saison.fromWishes">Aus den Top 5 wählen</button>' : ''))) +
      (goals.length > 5 ? '<div class="note" style="margin-top:16px">' + goals.length +
        ' Ziele in einer Saison. Was davon trägt wirklich – und was darf in die nächste Saison?</div>' : '') +
      '</section>';
  }

  /* --- Projekte ohne Ziel ---------------------------------------------- */

  function orphanSection() {
    const orphans = S.orphanProjects();
    if (!orphans.length) return '';
    return '<section class="section">' +
      '<div class="section-head"><h3>Ohne Ziel</h3></div>' +
      '<div class="note">Diese Projekte zahlen auf kein Ziel ein. Vielleicht ist dies eine Idee für später.</div>' +
      '<div class="list" style="margin-top:12px">' + orphans.map(p =>
        '<div class="list-item"><div class="li-main">' +
          '<button class="li-title link-btn" data-act="os.projectOpen" data-id="' + p.id + '">' + U.esc(p.name) + '</button>' +
          '<div class="li-meta">' + OS.ui.statusChip(p.status) + OS.ui.areaChip(p.areaId) + '</div>' +
        '</div>' +
        '<button class="btn btn-sm" data-act="saison.toIdea" data-id="' + p.id + '">In Ideen verschieben</button>' +
        '</div>').join('') + '</div>' +
      '</section>';
  }

  /* --- Nicht in dieser Saison ------------------------------------------- */

  function notSection(season) {
    const list = season.notList || [];
    return '<section class="section">' +
      '<div class="section-head"><h3>Nicht in dieser Saison</h3>' +
        '<button class="link-btn" data-act="saison.addNot" data-id="' + season.id + '">Hinzufügen</button></div>' +
      '<p class="small muted" style="margin-bottom:12px">Was du bewusst weglässt, macht den Rest möglich.</p>' +
      (list.length
        ? '<div class="list not-list">' + list.map(item =>
          '<div class="list-item"><div class="li-main"><div class="li-title">' + U.esc(item.text) + '</div></div>' +
          '<div class="li-actions">' + OS.ui.iconBtn('trash', 'saison.removeNot', 'Entfernen', 'data-id="' + season.id + '" data-item="' + item.id + '"') + '</div></div>').join('') + '</div>'
        : '<div class="empty">Noch nichts eingetragen.</div>') +
      '</section>';
  }

  /* --- Reviews ---------------------------------------------------------- */

  function reviewSection(season) {
    const list = S.reviews().filter(r => r.seasonId === season.id);
    if (!list.length) return '';
    return '<section class="section">' +
      '<div class="section-head"><h3>Reviews dieser Saison</h3></div>' +
      '<div class="list">' + list.map(r =>
        '<div class="list-item"><div class="li-main">' +
          '<div class="li-title">' + (r.type === 'saison' ? 'Saisonreview' : 'Mid-Season-Review') + '</div>' +
          '<div class="li-meta"><span class="tiny muted">' + U.esc(U.fmtMedium(r.createdAt.slice(0, 10))) + '</span></div>' +
        '</div>' +
        '<button class="btn btn-sm" data-act="system.openReview" data-id="' + r.id + '">Ansehen</button>' +
        '</div>').join('') + '</div>' +
      '</section>';
  }

  /* --- Rendern ----------------------------------------------------------- */

  function render(params) {
    const season = seasonOf(params);

    if (!season) {
      return '<div class="page-head"><span class="overline">Saison</span>' +
        '<h1 style="margin-top:12px">Noch keine Saison</h1>' +
        '<div class="page-sub">Eine Saison dauert 6 bis 12 Wochen und trägt drei bis fünf Ziele. ' +
        'Sie verhindert, dass alles gleichzeitig wichtig ist.</div></div>' +
        OS.ui.emptyState('Saison anlegen',
          'Gib ihr einen Titel, einen Zeitraum und – wenn du magst – ein Motto.',
          '<button class="btn btn-primary btn-sm" data-act="saison.new">Saison anlegen</button>');
    }

    return hero(season) +
      goalSection(season) +
      orphanSection() +
      '<div class="grid grid-2" style="align-items:start">' +
        '<div>' + notSection(season) + '</div>' +
        '<div>' + reviewSection(season) + '</div>' +
      '</div>' +
      '<div class="row" style="margin-top:40px;justify-content:flex-end">' +
        '<button class="btn btn-sm" data-act="saison.review" data-id="' + season.id + '">Mid-Season-Review</button>' +
        '<button class="btn btn-sm" data-act="saison.archive" data-id="' + season.id + '">Saison archivieren</button>' +
      '</div>';
  }

  /* --- Top-5-Auswahl ------------------------------------------------------ */

  function fromWishes(seasonId) {
    const top = S.topWishes();
    const season = S.find('season', seasonId) || S.currentSeason();
    if (!season) return;
    const alreadyFromWishes = S.seasonGoals(season.id).filter(g => g.fromWishId).length;

    OS.ui.modal({
      title: 'Aus den Top 5',
      subtitle: 'Aktiviere ein bis zwei dieser Ziele für diese Saison. Der Rest bleibt sichtbar, aber ruhig.',
      body: '<div class="stack" style="gap:10px">' +
        (alreadyFromWishes >= 2 ? '<div class="note">Zwei Top-Ziele sind bereits in dieser Saison. Mehr verwässert die Saison.</div>' : '') +
        top.map(w => {
          const used = S.state.goals.some(g => g.fromWishId === w.id && g.seasonId === season.id);
          return '<div class="list-item"><div class="li-main"><div class="li-title">' + U.esc(w.text) + '</div></div>' +
            (used ? '<span class="chip chip-green">in dieser Saison</span>'
              : '<button class="btn btn-sm" data-wish="' + w.id + '"' + (alreadyFromWishes >= 2 ? ' disabled' : '') + '>Aktivieren</button>') +
            '</div>';
        }).join('') +
        (!top.length ? '<div class="empty">Noch keine Top 5. Die 25/5-Methode findest du unter Projekte &amp; Ziele.</div>' : '') +
        '</div>',
      onMount: function (root, api) {
        root.querySelectorAll('[data-wish]').forEach(btn => btn.addEventListener('click', () => {
          const wish = S.find('wish', btn.getAttribute('data-wish'));
          if (!wish) return;
          api.close();
          OS.forms.goal({
            title: wish.text, horizon: 'saison', seasonId: season.id, fromWishId: wish.id
          });
        }));
      }
    });
  }

  /* --- Aktionen ------------------------------------------------------------ */

  const actions = {
    'saison.new': function () { OS.forms.season(); },
    'saison.edit': function (el, ds) { OS.forms.season(ds.id); },
    'saison.switch': function (el) { OS.app.go('#/saison?s=' + el.value); },
    'saison.newGoal': function (el, ds) {
      const season = S.find('season', ds.id) || S.currentSeason();
      OS.forms.goal({ horizon: 'saison', seasonId: season ? season.id : null });
    },
    'saison.fromWishes': function () {
      const season = S.currentSeason();
      if (season) fromWishes(season.id);
    },
    'saison.review': function (el, ds) { OS.views.system.seasonReview(ds.id, 'mid'); },
    'saison.addNot': async function (el, ds) {
      const text = await OS.ui.prompt({
        title: 'Nicht in dieser Saison',
        label: 'Was verschiebst du bewusst?',
        placeholder: 'Ein Thema, das später dran ist'
      });
      if (!text) return;
      S.update(() => {
        const season = S.find('season', ds.id);
        if (!season) return;
        if (!Array.isArray(season.notList)) season.notList = [];
        season.notList.push({ id: U.uid('nl'), text: text });
      });
    },
    'saison.removeNot': function (el, ds) {
      S.update(() => {
        const season = S.find('season', ds.id);
        if (!season) return;
        const i = season.notList.findIndex(x => x.id === ds.item);
        if (i >= 0) season.notList.splice(i, 1);
      });
    },
    'saison.toIdea': function (el, ds) {
      S.update(() => {
        const p = S.find('project', ds.id);
        if (!p) return;
        S.addIdea({ title: p.name, notes: p.why, areaId: p.areaId, status: 'idee' });
        S.remove('project', p.id);
      });
      OS.ui.toast('In Ideen & Backlog verschoben.');
    },
    'saison.archive': async function (el, ds) {
      const ok = await OS.ui.confirm({
        title: 'Saison archivieren?',
        text: 'Die Saison wandert ins Archiv. Ziele und Projekte bleiben erhalten.',
        confirmLabel: 'Archivieren'
      });
      if (!ok) return;
      S.update(() => {
        const season = S.find('season', ds.id);
        if (season) season.archived = true;
      });
      OS.app.go('#/saison');
    }
  };

  return { render: render, actions: actions, fromWishes: fromWishes, title: 'Saison' };
})();


/* ===========================================================
   OS — Ansicht: Projekte & Ziele
   Die strategische Ebene.
   =========================================================== */

OS.views.projekte = (function () {
  'use strict';

  const U = OS.util;
  const S = OS.store;

  const TABS = [
    { id: 'aktiv', num: 'A', label: 'Aktive Projekte' },
    { id: 'backlog', num: 'B', label: 'Ideen & Backlog' },
    { id: 'ziele', num: 'C', label: 'Ziele' },
    { id: 'methode', num: 'D', label: '25/5-Methode' },
    { id: 'frameworks', num: 'E', label: 'Frameworks' }
  ];

  function tabOf(params) {
    const t = params && params.tab;
    return TABS.some(x => x.id === t) ? t : 'aktiv';
  }

  function tabs(active) {
    return '<div class="tabs">' + TABS.map(t =>
      '<a class="tab' + (t.id === active ? ' is-active' : '') + '" href="#/projekte?tab=' + t.id + '">' +
      '<span class="tab-num">' + t.num + '</span>' + U.esc(t.label) + '</a>').join('') + '</div>';
  }

  /* --- A: Aktive Projekte -------------------------------------------- */

  function projectCard(p) {
    const progress = S.projectProgress(p);
    const goals = (p.goalIds || []).map(id => S.find('goal', id)).filter(Boolean);
    const openTasks = S.tasks({ projectId: p.id, status: 'open' }).length;

    return '<article class="card card-hover">' +
      '<button class="project-card" data-act="os.projectOpen" data-id="' + p.id + '">' +
        '<div class="card-head" style="margin-bottom:0">' +
          '<div>' +
            '<span class="overline">' + U.esc(S.PROJECT_STATUS_LABEL[p.status]) + '</span>' +
            '<div class="card-title" style="margin-top:6px">' + U.esc(p.name || 'Ohne Titel') + '</div>' +
          '</div>' +
        '</div>' +
        (p.outcome ? '<div class="small muted" style="line-height:1.55">' + U.esc(U.trunc(p.outcome, 130)) + '</div>' : '') +
        '<div class="pc-next">' +
          '<span class="pc-next-label">Nächste Handlung</span>' +
          (p.nextAction ? U.esc(p.nextAction) : '<span class="muted">Noch nicht festgelegt</span>') +
        '</div>' +
        ((p.milestones || []).length
          ? '<div><div class="spread tiny muted" style="margin-bottom:5px"><span>Meilensteine</span><span>' + progress + ' %</span></div>' +
            OS.ui.progressBar(progress) + '</div>' : '') +
        '<div class="pc-meta">' +
          OS.ui.areaChip(p.areaId) +
          goals.map(g => '<span class="chip chip-green">' + U.esc(U.trunc(g.title, 24)) + '</span>').join('') +
          (openTasks ? '<span class="chip">' + openTasks + ' ' + U.plural(openTasks, 'Aufgabe', 'Aufgaben') + '</span>' : '') +
          (p.due ? '<span class="chip">' + U.esc(U.fmtRelative(p.due)) + '</span>' : '') +
        '</div>' +
        (!goals.length && ['aktiv', 'geplant'].includes(p.status)
          ? '<div class="pc-orphan">Zahlt auf kein Ziel ein. Vielleicht ist dies eine Idee für später.</div>' : '') +
      '</button>' +
      '</article>';
  }

  function activeTab() {
    const max = S.state.settings.maxActiveProjects || 5;
    const active = S.activeProjects();
    const planned = S.projects({ status: ['geplant', 'idee'] });
    const paused = S.projects({ status: 'pausiert' });
    const finished = S.projects({ status: ['abgeschlossen', 'archiviert'] });

    return '<div class="spread" style="margin-bottom:26px">' +
        '<div class="count-line">' +
          '<span>Aktiv: ' + active.length + ' von ' + max + ' Projekten</span>' +
          '<span class="count-track">' + Array.from({ length: max }).map((_, i) =>
            '<i class="count-slot' + (i < active.length ? ' is-filled' : '') + '"></i>').join('') + '</span>' +
        '</div>' +
        '<button class="btn btn-sm" data-act="os.projectNew">Neues Projekt</button>' +
      '</div>' +

      (active.length >= max ? '<div class="note" style="margin-bottom:24px">Alle Plätze belegt. ' +
        'Wenn etwas Neues aktiv werden soll, pausiere zuerst ein Projekt.</div>' : '') +

      (active.length
        ? '<div class="grid grid-auto">' + active.map(projectCard).join('') + '</div>'
        : OS.ui.emptyState('Kein aktives Projekt',
          'Ein Projekt hat ein Ende und eine nächste Handlung. Mehr braucht es nicht.',
          '<button class="btn btn-sm" data-act="os.projectNew">Projekt anlegen</button>')) +

      (planned.length ? '<section class="section" style="margin-top:46px">' +
        '<div class="section-head"><h3>Geplant</h3></div>' +
        '<div class="grid grid-auto">' + planned.map(projectCard).join('') + '</div></section>' : '') +

      (paused.length ? '<section class="section">' +
        '<div class="section-head"><h3>Pausiert</h3></div>' +
        '<div class="grid grid-auto">' + paused.map(projectCard).join('') + '</div></section>' : '') +

      (finished.length ? '<section class="section">' +
        '<div class="section-head"><h3>Abgeschlossen</h3>' +
        '<button class="link-btn" data-act="ui.goArchive">Archiv</button></div>' +
        '<div class="list">' + finished.slice(0, 6).map(p =>
          '<div class="list-item"><div class="li-main">' +
            '<button class="li-title link-btn" data-act="os.projectOpen" data-id="' + p.id + '">' + U.esc(p.name) + '</button>' +
            '<div class="li-meta">' + OS.ui.statusChip(p.status) + OS.ui.areaChip(p.areaId) + '</div>' +
          '</div></div>').join('') + '</div></section>' : '');
  }

  /* --- B: Ideen & Backlog --------------------------------------------- */

  function ideaRow(idea) {
    return '<div class="idea-row">' +
      '<div class="idea-main">' +
        '<div class="li-title">' + U.esc(idea.title) + '</div>' +
        (idea.notes ? '<div class="small muted" style="margin-top:3px">' + U.esc(U.trunc(idea.notes, 120)) + '</div>' : '') +
        '<div class="li-meta" style="margin-top:6px">' +
          OS.ui.areaChip(idea.areaId) +
          '<span class="chip">' + U.esc(idea.priority) + '</span>' +
          (idea.tags || []).map(t => '<span class="chip">#' + U.esc(t) + '</span>').join('') +
        '</div>' +
      '</div>' +
      '<div class="li-actions">' +
        '<button class="btn btn-sm" data-act="projekte.ideaActivate" data-id="' + idea.id + '">Aktivieren</button>' +
        (idea.status === 'geparkt'
          ? '<button class="btn btn-sm btn-quiet" data-act="projekte.ideaStatus" data-id="' + idea.id + '" data-status="idee">Zurückholen</button>'
          : '<button class="btn btn-sm btn-quiet" data-act="projekte.ideaStatus" data-id="' + idea.id + '" data-status="geparkt">Parken</button>') +
        OS.ui.iconBtn('edit', 'projekte.ideaEdit', 'Bearbeiten', 'data-id="' + idea.id + '"') +
        OS.ui.iconBtn('archive', 'projekte.ideaStatus', 'Archivieren', 'data-id="' + idea.id + '" data-status="archiviert"') +
        OS.ui.iconBtn('trash', 'projekte.ideaDelete', 'Löschen', 'data-id="' + idea.id + '"') +
      '</div>' +
      '</div>';
  }

  function backlogTab() {
    const open = S.ideas({ status: 'idee' });
    const parked = S.ideas({ status: 'geparkt' });

    return '<div class="card" style="margin-bottom:34px">' +
        '<span class="overline">Schnell aufnehmen</span>' +
        '<div class="row" style="margin-top:12px;gap:8px;flex-wrap:nowrap">' +
          '<input class="input" data-idea-input placeholder="Eine Idee, ohne Verpflichtung" style="flex:1">' +
          '<button class="btn" data-act="projekte.ideaQuick">Aufnehmen</button>' +
        '</div>' +
        '<div class="field-help" style="margin-top:8px">Ideen sind keine Zusagen. Sie dürfen liegen bleiben.</div>' +
      '</div>' +

      '<section class="section">' +
        '<div class="section-head"><h3>Ideen</h3>' +
          '<span class="tiny muted">' + open.length + '</span></div>' +
        (open.length ? open.map(ideaRow).join('') : '<div class="empty">Noch keine Ideen aufgenommen.</div>') +
      '</section>' +

      '<section class="section">' +
        '<div class="section-head"><h3>Später</h3></div>' +
        '<p class="small muted" style="margin-bottom:14px">Bewusst geparkt. Das ist ein guter Ort – kein Abstellgleis.</p>' +
        (parked.length
          ? '<div class="later-list">' + parked.map(ideaRow).join('') + '</div>'
          : '<div class="empty">Hier ist Platz für alles, was warten darf.</div>') +
      '</section>';
  }

  /* --- C: Ziele --------------------------------------------------------- */

  function goalRow(g) {
    const progress = S.goalProgress(g);
    const linked = S.projects({ goalId: g.id });
    return '<div class="card card-hover" style="margin-bottom:12px">' +
      '<div class="spread" style="align-items:flex-start;gap:20px">' +
        '<div style="flex:1;min-width:0">' +
          '<div class="row row-tight" style="margin-bottom:6px">' +
