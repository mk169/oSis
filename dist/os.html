            OS.ui.areaChip(g.areaId) +
            '<span class="chip">' + U.esc(S.GOAL_STATUS_LABEL[g.status] || '') + '</span>' +
            (g.framework && g.framework.type !== 'frei'
              ? '<span class="chip chip-accent">' + U.esc((OS.frameworks[g.framework.type] || {}).label || '') + '</span>' : '') +
          '</div>' +
          '<button class="card-title link-btn" style="border:0" data-act="os.goalOpen" data-id="' + g.id + '">' + U.esc(g.title || 'Ohne Titel') + '</button>' +
          (g.metric ? '<div class="small muted" style="margin-top:6px">' + U.esc(U.trunc(g.metric, 150)) + '</div>' : '') +
          (linked.length ? '<div class="chips" style="margin-top:10px">' + linked.map(p =>
            '<button class="chip chip-btn" data-act="os.projectOpen" data-id="' + p.id + '">' + U.esc(U.trunc(p.name, 26)) + '</button>').join('') + '</div>'
            : '<div class="tiny muted" style="margin-top:10px">Ohne Projekt – das ist in Ordnung.</div>') +
        '</div>' +
        '<div style="width:120px;flex:0 0 auto">' +
          '<div class="tiny muted" style="text-align:right;margin-bottom:5px">' + progress + ' %</div>' +
          OS.ui.progressBar(progress) +
        '</div>' +
      '</div>' +
      '</div>';
  }

  function goalsTab(params) {
    const areaFilter = (params && params.a) || '';
    const all = S.goals().filter(g => !areaFilter || g.areaId === areaFilter);
    const groups = [
      { id: 'saison', label: 'Saison' },
      { id: 'jahr', label: 'Jahr' },
      { id: 'lang', label: 'Langfristig' }
    ];

    return '<div class="spread" style="margin-bottom:26px">' +
        '<div class="chips">' +
          '<a class="chip chip-btn' + (!areaFilter ? ' is-on' : '') + '" href="#/projekte?tab=ziele">Alle</a>' +
          S.areas().map(a => '<a class="chip chip-btn' + (areaFilter === a.id ? ' is-on' : '') +
            '" href="#/projekte?tab=ziele&a=' + a.id + '">' + U.esc(a.name) + '</a>').join('') +
        '</div>' +
        '<button class="btn btn-sm" data-act="os.goalNew">Neues Ziel</button>' +
      '</div>' +
      '<p class="small muted" style="margin-bottom:26px">Ziele sind keine Projekte. Sie beschreiben, was wahr sein soll – nicht, wie es geschieht.</p>' +
      groups.map(group => {
        const list = all.filter(g => g.horizon === group.id);
        if (!list.length) return '';
        return '<section class="section">' +
          '<div class="section-head"><h3>' + group.label + '</h3><span class="tiny muted">' + list.length + '</span></div>' +
          list.map(goalRow).join('') +
          '</section>';
      }).join('') +
      (!all.length ? OS.ui.emptyState('Noch keine Ziele',
        'Ein Ziel braucht einen Namen, ein Warum und eine Erfolgsdefinition. Vorlagen sind freiwillig.',
        '<button class="btn btn-sm" data-act="os.goalNew">Erstes Ziel</button>') : '');
  }

  /* --- D: 25/5-Methode ---------------------------------------------------- */

  function methodTab() {
    const m = S.state.method255;
    const wishes = S.wishes();
    const top = S.topWishes();
    const step = m.step || 1;
    const canStep2 = wishes.length >= 5;

    const steps = '<div class="steps">' +
      [
        { n: 1, label: 'Bis zu 25 Wünsche sammeln' },
        { n: 2, label: 'Die fünf wichtigsten markieren' },
        { n: 3, label: 'Die übrigen bewusst weglassen' }
      ].map(s => '<button class="step' + (step === s.n ? ' is-active' : step > s.n ? ' is-done' : '') + '" ' +
        'data-act="projekte.methodStep" data-step="' + s.n + '">' +
        '<span class="step-num">Schritt ' + s.n + '</span>' + s.label + '</button>').join('') +
      '</div>';

    let body = '';

    if (step === 1) {
      body = '<div class="card" style="margin-bottom:26px">' +
          '<span class="overline">Schritt 1</span>' +
          '<h3 style="margin-top:8px">Was willst du – höchstens 25 Dinge</h3>' +
          '<p class="small muted" style="margin-top:8px">Schreib ohne zu werten. Ziele, Wünsche, Vorhaben. ' +
          'Noch entscheidest du nichts.</p>' +
          '<div class="row" style="margin-top:16px;gap:8px;flex-wrap:nowrap">' +
            '<input class="input" data-wish-input placeholder="Wunsch oder Ziel" style="flex:1"' +
              (wishes.length >= 25 ? ' disabled' : '') + '>' +
            '<button class="btn" data-act="projekte.wishAdd"' + (wishes.length >= 25 ? ' disabled' : '') + '>Hinzufügen</button>' +
          '</div>' +
          '<div class="field-help" style="margin-top:8px">' + wishes.length + ' von 25' +
            (wishes.length >= 25 ? ' – die Liste ist voll. Das ist Absicht.' : '') + '</div>' +
        '</div>' +
        wishList(false) +
        (canStep2 ? '<div class="row" style="margin-top:26px;justify-content:flex-end">' +
          '<button class="btn btn-primary btn-sm" data-act="projekte.methodStep" data-step="2">Weiter zu den fünf wichtigsten</button></div>' : '');
    }

    if (step === 2) {
      body = '<div class="card" style="margin-bottom:26px">' +
          '<span class="overline">Schritt 2</span>' +
          '<h3 style="margin-top:8px">Markiere die fünf wichtigsten</h3>' +
          '<p class="small muted" style="margin-top:8px">Nicht die dringendsten. Die, die dein Leben am meisten verändern.</p>' +
          '<div class="field-help" style="margin-top:10px">' + top.length + ' von 5 markiert</div>' +
        '</div>' +
        wishList(true) +
        '<div class="row" style="margin-top:26px;justify-content:flex-end">' +
          '<button class="btn btn-primary btn-sm" data-act="projekte.methodStep" data-step="3"' +
            (top.length ? '' : ' disabled') + '>Weiter</button>' +
        '</div>';
    }

    if (step === 3) {
      const avoid = S.avoidWishes();
      body = '<div class="grid grid-2" style="align-items:start">' +
          '<section class="section">' +
            '<div class="section-head"><h3>Deine fünf</h3><span class="tiny muted">' + top.length + '</span></div>' +
            (top.length ? top.map(w =>
              '<div class="wish-row is-top">' +
                '<span class="star is-on">' + U.icons.star + '</span>' +
                '<span class="wish-text">' + U.esc(w.text) + '</span>' +
                '<button class="btn btn-sm" data-act="projekte.wishToGoal" data-id="' + w.id + '">Zu Saisonziel</button>' +
              '</div>').join('') : '<div class="empty">Noch nichts markiert.</div>') +
            '<div class="note note-accent" style="margin-top:18px">Aktiviere höchstens ein bis zwei dieser Ziele in einer Saison. ' +
            'Die anderen warten – sie sind nicht verloren.</div>' +
          '</section>' +
          '<section class="section">' +
            '<div class="section-head"><h3>Vermeiden – nicht jetzt</h3><span class="tiny muted">' + avoid.length + '</span></div>' +
            '<p class="small muted" style="margin-bottom:14px">Diese Liste ist der eigentliche Gewinn der Methode. ' +
            'Sie erscheint bewusst nicht in Tag und Woche.</p>' +
            (avoid.length ? avoid.map(w =>
              '<div class="wish-row is-avoid"><span class="wish-text">' + U.esc(w.text) + '</span>' +
              OS.ui.iconBtn('archive', 'projekte.wishToIdea', 'In Ideen ablegen', 'data-id="' + w.id + '"') + '</div>').join('')
              : '<div class="empty">Keine weiteren Wünsche.</div>') +
          '</section>' +
        '</div>';
    }

    return steps + body +
      '<div class="row" style="margin-top:40px;justify-content:flex-end">' +
        (wishes.length ? '<button class="btn btn-quiet btn-sm" data-act="projekte.methodReset">Liste zurücksetzen</button>' : '') +
      '</div>';
  }

  function wishList(selectable) {
    const wishes = S.wishes();
    if (!wishes.length) return '<div class="empty">Noch nichts gesammelt.</div>';
    const top = S.topWishes().length;
    return '<div class="wish-grid">' + wishes.map((w, i) =>
      '<div class="wish-row' + (w.top ? ' is-top' : '') + '">' +
        '<span class="wish-num">' + U.pad2(i + 1) + '</span>' +
        (selectable
          ? '<button class="star' + (w.top ? ' is-on' : '') + '" data-act="projekte.wishToggle" data-id="' + w.id + '"' +
            (!w.top && top >= 5 ? ' disabled title="Fünf sind markiert"' : '') + '>' +
            (w.top ? U.icons.star : U.icons.starOutline) + '</button>'
          : '') +
        '<input class="line-input wish-text" value="' + U.esc(w.text) + '" data-store="wish:' + w.id + ':text">' +
        OS.ui.iconBtn('trash', 'projekte.wishRemove', 'Entfernen', 'data-id="' + w.id + '"') +
      '</div>').join('') + '</div>';
  }

  /* --- E: Frameworks -------------------------------------------------------- */

  function frameworksTab() {
    return '<p class="lede" style="max-width:60ch;margin-bottom:34px">Vorlagen helfen beim Denken. ' +
      'Keine ist verpflichtend. Jede lässt sich nach dem Ausfüllen zu einer einfachen, lesbaren Zielkarte zusammenfassen.</p>' +
      '<div class="grid grid-auto">' +
      Object.keys(OS.frameworks).filter(k => k !== 'frei').map(key => {
        const fw = OS.frameworks[key];
        return '<article class="card fw-card">' +
          '<div class="fw-name">' + U.esc(fw.label) + '</div>' +
          '<div class="fw-desc">' + U.esc(fw.desc) + '</div>' +
          '<ul>' + fw.fields.map(f => '<li>' + U.esc(f.label) + '</li>').join('') + '</ul>' +
          '<button class="btn btn-sm" style="margin-top:auto" data-act="projekte.goalWithFramework" data-fw="' + key + '">' +
            'Ziel mit dieser Vorlage</button>' +
          '</article>';
      }).join('') +
      '<article class="card card-quiet fw-card">' +
        '<div class="fw-name">Ohne Vorlage</div>' +
        '<div class="fw-desc">Name, Warum, Erfolgsdefinition. Oft genügt das vollkommen.</div>' +
        '<button class="btn btn-sm" style="margin-top:auto" data-act="os.goalNew">Freies Ziel</button>' +
      '</article>' +
      '</div>';
  }

  /* --- Rendern ---------------------------------------------------------------- */

  function render(params) {
    const tab = tabOf(params);
    const head = '<div class="page-head">' +
      '<span class="overline">Projekte &amp; Ziele</span>' +
      '<h1 style="margin-top:12px">Strategische Ebene</h1>' +
      '<div class="page-sub">Hier entscheidest du, woran gearbeitet wird – und woran bewusst nicht.</div>' +
      '</div>';

    let body = '';
    if (tab === 'aktiv') body = activeTab();
    else if (tab === 'backlog') body = backlogTab();
    else if (tab === 'ziele') body = goalsTab(params);
    else if (tab === 'methode') body = methodTab();
    else if (tab === 'frameworks') body = frameworksTab();

    return head + tabs(tab) + body;
  }

  function mount(root) {
    const ideaInput = root.querySelector('[data-idea-input]');
    if (ideaInput) ideaInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') actions['projekte.ideaQuick']();
    });
    const wishInput = root.querySelector('[data-wish-input]');
    if (wishInput) wishInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') actions['projekte.wishAdd']();
    });
  }

  /* --- Aktionen ---------------------------------------------------------------- */

  const actions = {
    'projekte.ideaQuick': function () {
      const input = document.querySelector('[data-idea-input]');
      if (!input) return;
      const title = input.value.trim();
      if (!title) return;
      S.update(() => S.addIdea({ title: title }));
    },
    'projekte.ideaEdit': function (el, ds) { OS.forms.idea(ds.id); },
    'projekte.ideaStatus': function (el, ds) {
      S.update(() => {
        const i = S.find('idea', ds.id);
        if (i) i.status = ds.status;
      });
    },
    'projekte.ideaDelete': async function (el, ds) {
      const ok = await OS.ui.confirm({ title: 'Idee löschen?', text: 'Sie wird endgültig entfernt.', confirmLabel: 'Löschen', tone: 'danger' });
      if (ok) S.update(() => S.remove('idea', ds.id));
    },
    'projekte.ideaActivate': function (el, ds) {
      const i = S.find('idea', ds.id);
      if (!i) return;
      OS.forms.project({ name: i.title, why: i.notes, areaId: i.areaId });
      S.update(() => { i.status = 'archiviert'; });
    },

    'projekte.methodStep': function (el, ds) {
      S.update(() => { S.state.method255.step = Number(ds.step) || 1; });
    },
    'projekte.wishAdd': function () {
      const input = document.querySelector('[data-wish-input]');
      if (!input) return;
      const text = input.value.trim();
      if (!text) return;
      if (S.wishes().length >= 25) { OS.ui.toast('25 sind genug.'); return; }
      S.update(() => {
        S.state.method255.wishes.push({ id: U.uid('w'), text: text, top: false, createdAt: new Date().toISOString() });
      });
    },
    'projekte.wishToggle': function (el, ds) {
      S.update(() => {
        const w = S.find('wish', ds.id);
        if (!w) return;
        if (!w.top && S.topWishes().length >= 5) return;
        w.top = !w.top;
      });
    },
    'projekte.wishRemove': function (el, ds) {
      S.update(() => {
        const list = S.state.method255.wishes;
        const i = list.findIndex(w => w.id === ds.id);
        if (i >= 0) list.splice(i, 1);
      });
    },
    'projekte.wishToGoal': function (el, ds) {
      const w = S.find('wish', ds.id);
      if (!w) return;
      const season = S.currentSeason();
      OS.forms.goal({
        title: w.text, horizon: 'saison', seasonId: season ? season.id : null, fromWishId: w.id
      });
    },
    'projekte.wishToIdea': function (el, ds) {
      const w = S.find('wish', ds.id);
      if (!w) return;
      S.update(() => S.addIdea({ title: w.text, notes: 'Aus der 25/5-Liste.' }));
      OS.ui.toast('In Ideen abgelegt. In der 25/5-Liste bleibt der Eintrag sichtbar.');
    },
    'projekte.methodReset': async function () {
      const ok = await OS.ui.confirm({
        title: 'Liste zurücksetzen?',
        text: 'Alle 25 Einträge werden gelöscht. Bereits erstellte Ziele bleiben bestehen.',
        confirmLabel: 'Zurücksetzen', tone: 'danger'
      });
      if (!ok) return;
      S.update(() => { S.state.method255 = { wishes: [], step: 1, completedAt: null }; });
    },

    'projekte.goalWithFramework': function (el, ds) {
      OS.forms.goal({ framework: ds.fw });
    }
  };

  return { render: render, mount: mount, actions: actions, title: 'Projekte & Ziele' };
})();


/* ===========================================================
   OS — Ansicht: Review & System
   Hält das System lebendig und verhindert Überladung.
   =========================================================== */

OS.views.system = (function () {
  'use strict';

  const U = OS.util;
  const S = OS.store;

  const TABS = [
    { id: 'review', label: 'Reviews' },
    { id: 'bereiche', label: 'Lebensbereiche' },
    { id: 'gewohnheiten', label: 'Gewohnheiten' },
    { id: 'vorlagen', label: 'Vorlagen' },
    { id: 'daten', label: 'Daten' },
    { id: 'archiv', label: 'Archiv' }
  ];

  const WEEK_QUESTIONS = [
    { key: 'gelungen', text: 'Was ist gelungen?' },
    { key: 'offen', text: 'Was blieb offen – und warum?' },
    { key: 'energie', text: 'Was hat Energie gegeben oder gezogen?' },
    { key: 'wichtig', text: 'Was ist nächste Woche wirklich wichtig?' },
    { key: 'warten', text: 'Was darf warten?' }
  ];

  const SEASON_QUESTIONS = [
    { key: 'rueckblick', text: 'Was hat diese Saison getragen?' },
    { key: 'ziele', text: 'Welche Ziele sind erreicht – und welche nicht?' },
    { key: 'gelernt', text: 'Was hast du über dich gelernt?' },
    { key: 'loslassen', text: 'Was lässt du bewusst los?' },
    { key: 'naechste', text: 'Worauf richtet sich die nächste Saison?' }
  ];

  function tabOf(params) {
    const t = params && params.tab;
    return TABS.some(x => x.id === t) ? t : 'review';
  }

  function tabs(active) {
    return '<div class="tabs">' + TABS.map(t =>
      '<a class="tab' + (t.id === active ? ' is-active' : '') + '" href="#/system?tab=' + t.id + '">' +
      U.esc(t.label) + '</a>').join('') + '</div>';
  }

  /* --- Review-Dialoge -------------------------------------------------- */

  function reviewModal(opts) {
    const o = opts || {};
    const existing = o.reviewId ? S.find('review', o.reviewId) : null;
    const questions = o.questions;
    const answers = existing ? existing.answers : {};

    const goalRows = (o.goals || []).map(g =>
      '<div class="list-item"><div class="li-main">' +
        '<div class="li-title">' + U.esc(g.title || 'Ohne Titel') + '</div>' +
        '<div class="li-meta"><span class="tiny muted">' + S.goalProgress(g) + ' %</span></div>' +
      '</div>' +
      '<select class="select" style="width:auto" data-goal-rating="' + g.id + '">' +
        Object.keys(S.GOAL_STATUS_LABEL).map(s =>
          '<option value="' + s + '"' + ((existing && existing.goalRatings[g.id] === s) || (!existing && g.status === s) ? ' selected' : '') + '>' +
          S.GOAL_STATUS_LABEL[s] + '</option>').join('') +
      '</select></div>').join('');

    const projectRows = (o.projects || []).map(p =>
      '<div class="list-item"><div class="li-main">' +
        '<div class="li-title">' + U.esc(p.name) + '</div>' +
        '<div class="li-meta">' + OS.ui.statusChip(p.status) + '</div>' +
      '</div>' +
      '<select class="select" style="width:auto" data-project-status="' + p.id + '">' +
        S.PROJECT_STATUS.map(s => '<option value="' + s + '"' + (p.status === s ? ' selected' : '') + '>' +
          S.PROJECT_STATUS_LABEL[s] + '</option>').join('') +
      '</select></div>').join('');

    OS.ui.modal({
      title: o.title,
      subtitle: o.subtitle,
      size: 'lg',
      body: '<div class="stack" style="gap:4px">' +
        questions.map((q, i) =>
          '<div class="q-block">' +
            '<div class="q-text"><span class="q-num">' + U.pad2(i + 1) + '</span>' + U.esc(q.text) + '</div>' +
            '<textarea class="textarea" rows="3" data-answer="' + q.key + '" placeholder="In Ruhe. Stichworte genügen.">' +
              U.esc(answers[q.key] || '') + '</textarea>' +
          '</div>').join('') +
        (goalRows ? '<div class="field" style="margin-top:10px"><span class="field-label">Ziele bewerten</span>' +
          '<div class="list">' + goalRows + '</div></div>' : '') +
        (projectRows ? '<div class="field" style="margin-top:20px"><span class="field-label">Projekte fortführen, pausieren, beenden</span>' +
          '<div class="list">' + projectRows + '</div></div>' : '') +
        '</div>',
      footer: '<button class="btn" data-modal-close type="button">Abbrechen</button>' +
        '<button class="btn btn-primary" data-save type="button">Review speichern</button>',
      onMount: function (root, api) {
        root.querySelector('[data-save]').addEventListener('click', () => {
          const values = {};
          root.querySelectorAll('[data-answer]').forEach(el => { values[el.getAttribute('data-answer')] = el.value; });
          const ratings = {};
          root.querySelectorAll('[data-goal-rating]').forEach(el => { ratings[el.getAttribute('data-goal-rating')] = el.value; });
          const projectStatus = {};
          root.querySelectorAll('[data-project-status]').forEach(el => { projectStatus[el.getAttribute('data-project-status')] = el.value; });

          S.update(() => {
            const target = existing || S.addReview({ type: o.type, periodKey: o.periodKey, seasonId: o.seasonId || null });
            if (o.type === 'eigen') {
              target.title = o.title;
              target.templateId = o.templateId || null;
              target.questions = questions;
            }
            target.answers = values;
            target.goalRatings = ratings;
            Object.keys(ratings).forEach(gid => {
              const g = S.find('goal', gid);
              if (g) g.status = ratings[gid];
            });
            Object.keys(projectStatus).forEach(pid => {
              const p = S.find('project', pid);
              if (p) p.status = projectStatus[pid];
            });
          });
          api.close();
          OS.ui.toast('Review gespeichert.');
        });
      }
    });
  }

  function weekReview(wKey) {
    const key = wKey || U.weekKey(U.today());
    const existing = S.reviews('woche').find(r => r.periodKey === key);
    const days = U.weekDays(key);
    const done = S.state.tasks.filter(t => t.status === 'done' && t.date && days.includes(t.date));

    reviewModal({
      title: 'Wochenreview · KW ' + U.weekNumber(key),
      subtitle: U.fmtShort(days[0]) + ' – ' + U.fmtShort(days[6]) +
        (done.length ? ' · ' + done.length + ' ' + U.plural(done.length, 'Aufgabe', 'Aufgaben') + ' erledigt' : ''),
      type: 'woche',
      periodKey: key,
      questions: WEEK_QUESTIONS,
      reviewId: existing ? existing.id : null
    });
  }

  function seasonReview(seasonId, type) {
    const season = S.find('season', seasonId) || S.currentSeason();
    if (!season) { OS.ui.toast('Es gibt noch keine Saison.'); return; }
    const isMid = type === 'mid';
    const existing = S.reviews().find(r => r.seasonId === season.id && r.type === (isMid ? 'mid' : 'saison'));
    const p = S.seasonProgress(season);

    reviewModal({
      title: (isMid ? 'Mid-Season-Review' : 'Saisonreview') + ' · ' + (season.title || 'Saison'),
      subtitle: 'Woche ' + p.week + ' von ' + p.weeks,
      type: isMid ? 'mid' : 'saison',
      periodKey: season.id,
      seasonId: season.id,
      questions: isMid
        ? [{ key: 'stand', text: 'Wo stehst du – ehrlich?' }].concat(SEASON_QUESTIONS.slice(1, 4))
        : SEASON_QUESTIONS,
      goals: S.seasonGoals(season.id),
      projects: isMid ? [] : S.projects({ live: true }),
      reviewId: existing ? existing.id : null
    });
  }

  function reviewLabel(r) {
    if (r.type === 'woche') return 'Wochenreview · KW ' + U.weekNumber(r.periodKey);
    if (r.type === 'mid') return 'Mid-Season-Review';
    if (r.type === 'eigen') return r.title || 'Eigenes Review';
    return 'Saisonreview';
  }

  function openReview(id) {
    const r = S.find('review', id);
    if (!r) return;
    const questions = Array.isArray(r.questions) && r.questions.length
      ? r.questions
      : (r.type === 'woche' ? WEEK_QUESTIONS : SEASON_QUESTIONS);
    OS.ui.modal({
      title: reviewLabel(r),
      subtitle: U.fmtMedium(r.createdAt.slice(0, 10)),
      size: 'lg',
      body: '<div class="stack" style="gap:18px">' +
        questions.filter(q => (r.answers[q.key] || '').trim()).map(q =>
          '<div class="re-qa"><div class="re-q">' + U.esc(q.text) + '</div>' +
          '<div class="re-a">' + U.esc(r.answers[q.key]) + '</div></div>').join('') +
        (Object.keys(r.answers).every(k => !(r.answers[k] || '').trim()) ? '<div class="empty">Dieses Review ist leer geblieben.</div>' : '') +
        '</div>',
      footer: '<button class="btn btn-quiet btn-sm" data-del type="button">Löschen</button>' +
        '<button class="btn" data-modal-close type="button">Schließen</button>',
      onMount: function (root, api) {
        root.querySelector('[data-del]').addEventListener('click', async () => {
          const ok = await OS.ui.confirm({ title: 'Review löschen?', text: 'Der Eintrag wird entfernt.', confirmLabel: 'Löschen', tone: 'danger' });
          if (ok) { S.update(() => S.remove('review', id)); api.close(); }
        });
      }
    });
  }

  /* --- Tab: Reviews ------------------------------------------------------ */

  function reviewTab() {
    const list = S.reviews();
    const wKey = U.weekKey(U.today());

            '<button class="btn btn-sm" data-act="system.seasonReview" data-type="mid"' + (season ? '' : ' disabled') + '>Mid-Season</button>' +
            '<button class="btn btn-sm btn-primary" data-act="system.seasonReview" data-type="ende"' + (season ? '' : ' disabled') + '>Saison abschließen</button>' +

      '<section class="section">' +
        '<div class="section-head"><h3>Frühere Reviews</h3><span class="tiny muted">' + list.length + '</span></div>' +
        (list.length ? list.map(r => {

  /* --- Vorlagen --------------------------------------------------------------- */

  function parseQuestions(text) {
    return String(text || '')
      .split('\n')
      .map(line => line.trim())
      .filter(Boolean)
      .map((line, i) => ({ key: 'q' + (i + 1), text: line }));
  }

  const TEMPLATE_KIND_LABEL = { ziel: 'Zielvorlage', projekt: 'Projektvorlage', review: 'Reviewvorlage' };

  function templateDialog(kind, id) {
    const existing = id ? S.find('template', id) : null;
    const p = (existing && existing.payload) || {};

    const byKind = {
      ziel: [
        { name: 'title', label: 'Ziel', value: p.title || '', placeholder: 'Vorformulierter Zieltext' },
        { name: 'why', type: 'textarea', rows: 2, label: 'Warum', value: p.why || '' },
        { name: 'metric', type: 'textarea', rows: 2, label: 'Erfolgsdefinition', value: p.metric || '' },
        {
          type: 'row', fields: [
            {
              name: 'horizon', type: 'select', label: 'Zeithorizont', value: p.horizon || 'saison',
              options: Object.keys(S.HORIZON_LABEL).map(h => ({ value: h, label: S.HORIZON_LABEL[h] }))
            },
            {
              name: 'framework', type: 'select', label: 'Vorlage', value: p.framework || 'frei',
              options: Object.keys(OS.frameworks).map(k => ({ value: k, label: OS.frameworks[k].label }))
            }
          ]
        }
      ],
      projekt: [
        { name: 'projectName', label: 'Projektname', value: p.name || '', placeholder: 'z. B. Kurs vorbereiten' },
        { name: 'why', type: 'textarea', rows: 2, label: 'Warum', value: p.why || '' },
        { name: 'outcome', type: 'textarea', rows: 2, label: 'Gewünschtes Ergebnis', value: p.outcome || '' },
        { name: 'nextAction', label: 'Nächste konkrete Handlung', value: p.nextAction || '' }
      ],
      review: [
        {
          name: 'questions', type: 'textarea', rows: 6, label: 'Fragen',
          value: p.questions || '', placeholder: 'Eine Frage pro Zeile',
          help: 'Jede Zeile wird zu einer Frage mit eigenem Antwortfeld.'
        }
      ]
    };

    OS.ui.form({
      title: existing ? existing.name : ('Neue ' + TEMPLATE_KIND_LABEL[kind]),
      subtitle: 'Vorlagen füllen ein Formular vor. Alles bleibt änderbar.',
      submitLabel: existing ? 'Speichern' : 'Anlegen',
      fields: [
        { name: 'name', label: 'Name der Vorlage', value: existing ? existing.name : '', autofocus: true, placeholder: 'Wofür ist sie da?' },
        { type: 'section', label: TEMPLATE_KIND_LABEL[kind] }
      ].concat(byKind[kind] || []),
      onSubmit: function (v) {
        const name = String(v.name || '').trim();
        if (!name) { OS.ui.toast('Die Vorlage braucht einen Namen.'); return false; }
        const payload = {};
        Object.keys(v).forEach(k => { if (k !== 'name') payload[k] = v[k]; });
        if (kind === 'projekt') {
          payload.name = payload.projectName || '';
          delete payload.projectName;
        }
        S.update(() => {
          const target = existing || S.addTemplate({ kind: kind });
          target.name = name;
          target.kind = kind;
          target.payload = Object.assign({}, payload);
        });
      }
    });
  }

  /* --- Kopplung ---------------------------------------------------------------- */

  const SYNC_LABEL = {
    aus: 'Nicht eingerichtet',
    verbindet: 'Verbindet …',
    anmeldung: 'Anmeldung nötig',
    abgleich: 'Gleicht ab …',
    gekoppelt: 'Gekoppelt',
    fehler: 'Unterbrochen'
  };

  function syncSection() {
    const sync = OS.sync;
    const status = sync.status;
    const backup = sync.backupTime();

    let body = '';

    // In eingebetteten Umgebungen sind Verbindungen nach außen gesperrt.
    if (window.claude && typeof window.claude.use === 'function') {
      return '<section class="section">' +
        '<div class="section-head"><h2>Geräte</h2></div>' +
        '<div class="note note-quiet">Hier ist keine Kopplung möglich, weil diese Umgebung keine Verbindungen ' +
        'zu fremden Servern zulässt. Nutze dafür die installierte Fassung. ' +
        'Export und Import funktionieren auch hier.</div>' +
        '</section>';
    }

    if (status === 'aus') {
      body = '<p class="small muted" style="margin-bottom:14px">Ohne Kopplung bleibt jedes Gerät für sich. ' +
        'Mit Kopplung sehen iPhone und Mac denselben Stand.</p>' +
        '<button class="btn btn-sm" data-act="system.syncSetup">Kopplung einrichten</button>';
    } else if (status === 'anmeldung') {
      body = '<p class="small muted" style="margin-bottom:14px">Melde dich mit deiner E-Mail-Adresse an. ' +
        'Du bekommst einen Link zugeschickt, ein Passwort brauchst du nicht. ' +
        'Auf dem zweiten Gerät nimmst du dieselbe Adresse.</p>' +
        '<div class="row" style="gap:8px;flex-wrap:nowrap;max-width:420px">' +
          '<input class="input" type="email" data-sync-mail placeholder="deine@adresse.de" style="flex:1">' +
          '<button class="btn btn-sm" data-act="system.syncLogin">Link senden</button>' +
        '</div>' +
        '<div style="margin-top:12px"><button class="link-btn" data-act="system.syncSetup">Zugangsdaten ändern</button></div>';
    } else if (status === 'gekoppelt' || status === 'abgleich') {
      body = '<div class="stack" style="gap:10px">' +
        '<div class="small">Angemeldet als ' + U.esc(sync.email || '—') + '</div>' +
        (sync.lastSync ? '<div class="tiny muted">Zuletzt abgeglichen um ' +
          U.esc(new Date(sync.lastSync).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' })) + ' Uhr</div>' : '') +
        '<div class="row" style="margin-top:6px">' +
          '<button class="btn btn-sm" data-act="system.syncNow">Jetzt abgleichen</button>' +
          '<button class="btn btn-sm btn-quiet" data-act="system.syncLogout">Abmelden</button>' +
        '</div>' +
        '</div>';
    } else if (status === 'fehler') {
      body = '<div class="note" style="margin-bottom:14px">' + U.esc(sync.detail || 'Der Abgleich ruht gerade.') + '</div>' +
        '<div class="row">' +
          '<button class="btn btn-sm" data-act="system.syncNow">Erneut versuchen</button>' +
          '<button class="link-btn" data-act="system.syncSetup">Zugangsdaten ändern</button>' +
        '</div>';
    } else {
      body = '<p class="small muted">Einen Moment.</p>';
    }

    return '<section class="section">' +
      '<div class="section-head"><h2>Geräte</h2>' +
        '<span class="chip' + (status === 'gekoppelt' ? ' chip-green' : status === 'fehler' ? ' chip-warn' : '') + '">' +
        U.esc(SYNC_LABEL[status] || status) + '</span></div>' +
      '<div class="card">' + body +
        (backup ? '<div style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">' +
          '<div class="tiny muted" style="margin-bottom:8px">Sicherung vom ' +
            U.esc(U.fmtMedium(String(backup).slice(0, 10))) + ', angelegt vor dem letzten Übernehmen.</div>' +
          '<button class="btn btn-sm btn-quiet" data-act="system.syncRestore">Vorherigen Stand zurückholen</button>' +
        '</div>' : '') +
      '</div>' +
      '</section>';
  }

  function syncSetupDialog() {
    const cfg = OS.sync.config() || { url: '', key: '' };
    OS.ui.form({
      title: 'Kopplung einrichten',
      subtitle: 'Einmal pro Gerät. Die beiden Werte findest du in deinem Supabase-Projekt unter Settings, API.',
      submitLabel: 'Verbinden',
      size: 'lg',
      extraFooter: cfg.url ? '<button class="btn btn-quiet btn-sm" data-clear type="button">Verbindung lösen</button>' : '',
      fields: [
        {
          type: 'note', tone: 'note-quiet',
          text: 'Der Projektschlüssel ist der öffentliche „anon public“. Er darf im Gerät liegen; ' +
            'geschützt werden die Daten durch die Zugriffsregeln der Datenbank.'
        },
        { name: 'url', label: 'Projekt-URL', value: cfg.url, placeholder: 'https://xxxxx.supabase.co', autofocus: true },
        { name: 'key', type: 'textarea', rows: 3, label: 'anon public key', value: cfg.key, placeholder: 'eyJhbGci…' }
      ],
      onMount: function (root, api) {
        const clear = root.querySelector('[data-clear]');
        if (clear) clear.addEventListener('click', function () {
          OS.sync.clearConfig();
          api.close();
          OS.app.render();
          OS.ui.toast('Verbindung gelöst. Deine Daten bleiben auf diesem Gerät.');
        });
      },
      onSubmit: function (v) {
        if (!OS.sync.setConfig(v.url, v.key)) {
          OS.ui.toast('Bitte beide Werte eintragen.');
          return false;
        }
        OS.sync.start();
        OS.ui.toast('Verbindung gespeichert.');
      }
    });
  }

          '</div>' +
        '</div>' +
      '</section>';
  }

  /* --- Tab: Archiv -------------------------------------------------------------- */

  function archiveTab() {
    const projects = S.state.projects.filter(p => ['abgeschlossen', 'archiviert'].includes(p.status));
    const seasons = S.state.seasons.filter(s => s.archived);
    const tasks = S.state.tasks.filter(t => t.status === 'archived');
    const ideas = S.ideas({ status: 'archiviert' });
    const reviews = S.reviews();

    function section(title, items, renderRow) {
      return '<section class="section">' +
        '<div class="section-head"><h3>' + title + '</h3><span class="tiny muted">' + items.length + '</span></div>' +
        (items.length ? '<div class="card">' + items.map(renderRow).join('') + '</div>'
          : '<div class="empty">Nichts im Archiv.</div>') +
        '</section>';
    }

    return '<p class="lede" style="max-width:60ch;margin-bottom:30px">Abgeschlossenes bleibt lesbar. ' +
      'Das Archiv ist kein Papierkorb, sondern ein Gedächtnis.</p>' +

      section('Projekte', projects, p =>
        '<div class="manage-row"><div class="mr-main">' +
          '<button class="link-btn" data-act="os.projectOpen" data-id="' + p.id + '">' + U.esc(p.name) + '</button>' +
          OS.ui.statusChip(p.status) +
        '</div><button class="btn btn-sm" data-act="system.projectRestore" data-id="' + p.id + '">Zurückholen</button></div>') +

      section('Saisons', seasons, s =>
        '<div class="manage-row"><div class="mr-main is-stacked"><span>' + U.esc(s.title || 'Saison') + '</span>' +
          '<span class="tiny muted">' + U.esc(U.fmtRange(s.start, s.end)) + '</span></div>' +
          '<button class="btn btn-sm" data-act="system.seasonRestore" data-id="' + s.id + '">Zurückholen</button></div>') +

      section('Reviews', reviews, r =>
        '<div class="manage-row"><div class="mr-main">' +
          '<button class="link-btn" data-act="system.openReview" data-id="' + r.id + '">' +
            reviewLabel(r) +
          '</button></div>' +
          '<span class="tiny muted">' + U.esc(U.fmtMedium(r.createdAt.slice(0, 10))) + '</span></div>') +

      section('Aufgaben', tasks, t =>
        '<div class="manage-row"><div class="mr-main"><span class="muted">' + U.esc(t.title) + '</span></div>' +
          '<button class="btn btn-sm" data-act="system.taskRestore" data-id="' + t.id + '">Zurückholen</button></div>') +

      section('Ideen', ideas, i =>
        '<div class="manage-row"><div class="mr-main"><span class="muted">' + U.esc(i.title) + '</span></div>' +
          '<button class="btn btn-sm" data-act="system.ideaRestore" data-id="' + i.id + '">Zurückholen</button></div>');
  }

  /* --- Rendern ------------------------------------------------------------------- */

  function render(params) {
    const tab = tabOf(params);
    const head = '<div class="page-head">' +
      '<span class="overline">Review &amp; System</span>' +
      '<h1 style="margin-top:12px">Das System pflegen</h1>' +
      '<div class="page-sub">Regelmäßiges Aufräumen hält das OS leicht. Nichts hier ist Pflicht.</div>' +
      '</div>';

    let body = '';
    if (tab === 'review') body = reviewTab();
    else if (tab === 'bereiche') body = areaTab();
    else if (tab === 'gewohnheiten') body = habitTab();
    else if (tab === 'vorlagen') body = templateTab();
    else if (tab === 'daten') body = dataTab();
    else if (tab === 'archiv') body = archiveTab();

    return head + tabs(tab) + body;
  }

  /* --- Export / Import ---------------------------------------------------------------- */

  /** Wenn kein Speichern möglich ist: Text zum Kopieren zeigen. */
  function exportTextDialog(json, filename) {
    OS.ui.modal({
      title: 'Export',
      subtitle: 'Hier kann keine Datei gespeichert werden. Kopiere den Text und sichere ihn als ' + filename + '.',
      size: 'lg',
      body: '<div class="stack" style="gap:12px">' +
        '<textarea class="textarea" style="height:320px;font-family:var(--mono);font-size:11.5px" data-json readonly>' +
          U.esc(json) + '</textarea>' +
        '<div class="note note-quiet">Dieser Text ist deine vollständige Sicherung. ' +
        'Unter „Import“ kannst du ihn jederzeit wieder einfügen.</div>' +
        '</div>',
      footer: '<button class="btn" data-modal-close type="button">Schließen</button>' +
        '<button class="btn btn-primary" data-copy type="button">Text kopieren</button>',
      onMount: function (root) {
        const area = root.querySelector('[data-json]');
        root.querySelector('[data-copy]').addEventListener('click', function () {
          area.focus();
          area.select();
          const done = function () { OS.ui.toast('In die Zwischenablage kopiert.'); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(json).then(done, function () {
              OS.ui.toast('Bitte mit Strg+C oder Cmd+C kopieren.');
            });
          } else {
            OS.ui.toast('Bitte mit Strg+C oder Cmd+C kopieren.');
          }
        });
      }
    });
  }

  function importDialog() {
    OS.ui.modal({
      title: 'Daten importieren',
      subtitle: 'Wähle eine exportierte JSON-Datei oder füge den Text ein.',
      body: '<div class="stack" style="gap:16px">' +
        '<label class="field"><span class="field-label">Datei</span>' +
          '<input type="file" accept="application/json,.json" data-file class="input"></label>' +
        '<label class="field"><span class="field-label">Oder Text einfügen</span>' +
          '<textarea class="textarea" rows="5" data-paste placeholder="Den Inhalt einer Exportdatei hier einfügen"></textarea></label>' +
        '<label class="field"><span class="field-label">Vorgehen</span>' +
          '<select class="select" data-mode>' +
            '<option value="ersetzen">Vorhandene Daten ersetzen</option>' +
            '<option value="zusammenfuehren">Zusammenführen (nur Neues übernehmen)</option>' +
          '</select></label>' +
        '<div class="note note-quiet">Beim Ersetzen wird der aktuelle Stand überschrieben. ' +
        'Exportiere vorher, wenn du unsicher bist.</div>' +
        '</div>',
      footer: '<button class="btn" data-modal-close type="button">Abbrechen</button>' +
        '<button class="btn btn-primary" data-go type="button">Importieren</button>',
      onMount: function (root, api) {
        function apply(text, mode) {
          try {
            S.importData(text, mode);
            api.close();
            OS.ui.toast('Import abgeschlossen.');
            OS.app.applySettings();
          } catch (err) {
            OS.ui.toast(err.message || 'Import fehlgeschlagen.');
          }
        }

        root.querySelector('[data-go]').addEventListener('click', () => {
          const mode = root.querySelector('[data-mode]').value;
          const pasted = root.querySelector('[data-paste]').value.trim();
          if (pasted) { apply(pasted, mode); return; }

          const input = root.querySelector('[data-file]');
          const file = input.files && input.files[0];
          if (!file) { OS.ui.toast('Bitte eine Datei wählen oder Text einfügen.'); return; }
          const reader = new FileReader();
          reader.onload = function () { apply(String(reader.result), mode); };
          reader.onerror = function () { OS.ui.toast('Die Datei ließ sich nicht lesen.'); };
          reader.readAsText(file);
        });
      }
    });
  }

  /* --- Aktionen ---------------------------------------------------------------------- */

  const actions = {
    'system.weekReview': function () { weekReview(U.weekKey(U.today())); },
    'system.seasonReview': function (el, ds) {
      const season = S.currentSeason();
      seasonReview(season ? season.id : null, ds.type === 'mid' ? 'mid' : 'ende');
    },
    'system.openReview': function (el, ds) { openReview(ds.id); },

    'system.areaEdit': function (el, ds) { OS.forms.area(ds.id); },
    'system.areaArchive': function (el, ds) {
      S.update(() => { const a = S.find('area', ds.id); if (a) a.archived = true; });
    },
    'system.areaRestore': function (el, ds) {
      S.update(() => { const a = S.find('area', ds.id); if (a) a.archived = false; });
    },
    'system.areaMove': function (el, ds) {
      S.update(() => {
        const list = S.areas();
        const i = list.findIndex(a => a.id === ds.id);
        const j = i + Number(ds.dir);
        if (i < 0 || j < 0 || j >= list.length) return;
        U.move(list, i, j);
        list.forEach((a, idx) => { a.order = idx; });
      });
    },
    'system.areaSuggest': function () {
      const names = ['Arbeit', 'Gesundheit', 'Beziehungen', 'Finanzen', 'Lernen', 'Kreatives', 'Zuhause'];
      S.update(() => names.forEach(n => S.addArea({ name: n })));
      OS.ui.toast('Neutrale Bereiche eingefügt. Benenne sie um, wie es dir entspricht.');
    },

    'system.habitArchive': function (el, ds) {
      S.update(() => { const h = S.find('habit', ds.id); if (h) h.archived = true; });
    },
    'system.habitRestore': function (el, ds) {
      S.update(() => { const h = S.find('habit', ds.id); if (h) h.archived = false; });
    },
    'system.habitMove': function (el, ds) {
      S.update(() => {
        const list = S.habits();
        const i = list.findIndex(h => h.id === ds.id);
        const j = i + Number(ds.dir);
        if (i < 0 || j < 0 || j >= list.length) return;
        U.move(list, i, j);
        list.forEach((h, idx) => { h.order = idx; });
      });
    },
    'system.habitDelete': async function (el, ds) {
      const ok = await OS.ui.confirm({
        title: 'Gewohnheit löschen?',
        text: 'Auch die bisherigen Einträge werden entfernt. Archivieren bewahrt sie.',
        confirmLabel: 'Löschen', tone: 'danger'
      });
      if (ok) S.update(() => S.remove('habit', ds.id));
    },

    'system.templateNew': function (el, ds) { templateDialog(ds.kind || 'ziel'); },
    'system.templateEdit': function (el, ds) {
      const t = S.find('template', ds.id);
      if (t) templateDialog(t.kind, t.id);
    },
    'system.templateUse': function (el, ds) {
      const t = S.find('template', ds.id);
      if (!t) return;
      const p = t.payload || {};
      if (t.kind === 'ziel') {
        OS.forms.goal({
          title: p.title || '', why: p.why || '', metric: p.metric || '',
          horizon: p.horizon || 'saison', framework: p.framework || 'frei'
        });
      } else if (t.kind === 'projekt') {
        OS.forms.project({
          name: p.name || '', why: p.why || '', outcome: p.outcome || '', nextAction: p.nextAction || ''
        });
      } else {
        const questions = parseQuestions(p.questions);
        if (!questions.length) { OS.ui.toast('Diese Vorlage enthält noch keine Fragen.'); return; }
        reviewModal({
          title: t.name,
          subtitle: U.fmtLong(U.today()),
          type: 'eigen',
          periodKey: U.today(),
          templateId: t.id,
          questions: questions
        });
      }
    },
    'system.templateDelete': function (el, ds) {
      S.update(() => S.remove('template', ds.id));
    },

    'system.syncSetup': function () { syncSetupDialog(); },
    'system.syncLogin': function () {
      const input = document.querySelector('[data-sync-mail]');
      const mail = input ? input.value.trim() : '';
      if (!mail || mail.indexOf('@') < 0) { OS.ui.toast('Bitte eine E-Mail-Adresse eintragen.'); return; }
      OS.sync.signIn(mail).then(function () {
        OS.ui.toast('Link verschickt. Öffne ihn auf diesem Gerät.');
      }).catch(function (err) {
        OS.ui.toast(err && err.message ? err.message : 'Der Link ließ sich nicht senden.');
      });
    },
    'system.syncLogout': async function () {
      const ok = await OS.ui.confirm({
        title: 'Abmelden?',
        text: 'Die Daten bleiben auf diesem Gerät. Der Abgleich pausiert, bis du dich wieder anmeldest.',
        confirmLabel: 'Abmelden'
      });
      if (ok) OS.sync.signOut();
    },
    'system.syncNow': function () { OS.sync.syncNow(); },
    'system.syncRestore': async function () {
      const ok = await OS.ui.confirm({
        title: 'Vorherigen Stand zurückholen?',
        text: 'Der aktuelle Stand wird durch die Sicherung ersetzt und anschließend auf die anderen Geräte übertragen.',
        confirmLabel: 'Zurückholen'
      });
      if (ok) OS.sync.restore();
    },

    'system.export': function () {
      const json = S.exportData();
      const name = S.exportFileName();
      S.exportFile().then(function (result) {
        if (result === 'saved' || result === 'local') OS.ui.toast('Export gespeichert.');
        else if (result === 'declined') OS.ui.toast('Export abgebrochen.');
        else exportTextDialog(json, name);
      });
    },
    'system.import': function () { importDialog(); },
    'system.reset': async function () {
      const ok = await OS.ui.confirm({
        title: 'Wirklich alles löschen?',
        text: 'Sämtliche Daten in diesem Browser werden entfernt. Exportiere vorher, wenn du sie behalten willst.',
        confirmLabel: 'Alles löschen', tone: 'danger'
      });
      if (!ok) return;
      S.reset();
      OS.app.applySettings();
      OS.ui.toast('Zurückgesetzt.');
    },
    'system.accent': function (el, ds) {
      S.update(() => { S.state.settings.accent = ds.id; });
      OS.app.applySettings();
    },
    'system.theme': function () {
      S.update(() => {
        S.state.settings.theme = S.state.settings.theme === 'dark' ? 'light' : 'dark';
      });
      OS.app.applySettings();
    },

    'system.projectRestore': function (el, ds) {
      S.update(() => { const p = S.find('project', ds.id); if (p) p.status = 'geplant'; });
    },
    'system.seasonRestore': function (el, ds) {
      S.update(() => { const s = S.find('season', ds.id); if (s) s.archived = false; });
    },
    'system.taskRestore': function (el, ds) {
      S.update(() => { const t = S.find('task', ds.id); if (t) { t.status = 'open'; t.date = null; } });
    },
    'system.ideaRestore': function (el, ds) {
      S.update(() => { const i = S.find('idea', ds.id); if (i) i.status = 'idee'; });
    }
  };

  return {
    render: render, actions: actions, title: 'Review & System',
    weekReview: weekReview, seasonReview: seasonReview, openReview: openReview
  };
})();


/* ===========================================================
   OS — App
   Router, Ereignisse, Inbox, Suche, Tastatur.
   =========================================================== */

OS.app = (function () {
  'use strict';

  const U = OS.util;
  const S = OS.store;

  const ROUTES = ['heute', 'woche', 'saison', 'projekte', 'system'];
  let current = { route: 'heute', params: {} };

  /* --- Aktionsregister --------------------------------------------- */

  OS.actions = {};
  function registerActions(map) { Object.assign(OS.actions, map); }

  /* --- Routing ------------------------------------------------------ */

  function parseHash() {
    const raw = (location.hash || '#/heute').replace(/^#\/?/, '');
    const [path, query] = raw.split('?');
    const route = ROUTES.includes(path) ? path : 'heute';
    const params = {};
    (query || '').split('&').filter(Boolean).forEach(pair => {
      const [k, v] = pair.split('=');
      params[decodeURIComponent(k)] = decodeURIComponent(v || '');
    });
    return { route, params };
  }

  function go(hash) {
    if (location.hash === hash) render();
    else location.hash = hash;
  }

  /* --- Rendern -------------------------------------------------------- */

  function welcomeCard() {
    return '<div class="card" style="margin-bottom:34px;border-left:2px solid var(--accent)">' +
      '<span class="overline">Willkommen</span>' +
      '<h3 style="margin-top:8px">Dieses System ist leer – und das ist Absicht.</h3>' +
      '<p class="small" style="margin-top:10px;color:var(--ink-2);max-width:62ch">Es enthält nichts über dich, bis du etwas einträgst. ' +
      'Ein guter Anfang: ein oder zwei Lebensbereiche, eine Saison mit drei Zielen, ein Projekt mit einer nächsten Handlung. ' +
      'Alles andere kann warten.</p>' +
      '<div class="row" style="margin-top:16px">' +
        '<button class="btn btn-sm" data-act="ui.goAreas">Lebensbereiche</button>' +
        '<button class="btn btn-sm" data-act="saison.new">Saison anlegen</button>' +
        '<button class="btn btn-sm" data-act="os.habitNew">Gewohnheit</button>' +
      '</div>' +
      '</div>';
  }

  function render() {
    current = parseHash();
    const view = OS.views[current.route];
    const root = document.getElementById('view');
    if (!view || !root) return;

    const showWelcome = S.isEmpty() && current.route === 'heute';
    root.innerHTML = (showWelcome ? welcomeCard() : '') + view.render(current.params);

    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.toggle('is-active', item.getAttribute('data-route') === current.route);
    });

    document.title = 'OS · ' + (view.title || '');
    U.autosizeAll(root);
    if (view.mount) view.mount(root, current.params);

    updateChrome();
    if (OS.ui.isDrawerOpen()) OS.ui.renderDrawer();
    OS.forms.refresh();
  }

  function updateChrome() {
    const count = S.state.inbox.length;
    const badge = document.getElementById('inbox-count');
    if (badge) {
      badge.textContent = count;
      badge.className = 'pill' + (count ? ' pill-accent' : '');
    }
    const date = document.getElementById('topbar-date');
    if (date) date.textContent = U.fmtLong(U.today());

    const hint = document.getElementById('season-hint');
    if (hint) {
      const season = S.currentSeason();
      if (season) {
        const p = S.seasonProgress(season);
        hint.innerHTML = U.esc(season.title) + '<br>Woche ' + p.week + ' von ' + p.weeks;
      } else {
        hint.textContent = 'Keine Saison aktiv';
      }
    }
  }

  function applySettings() {
    const s = S.state.settings;
    const root = document.documentElement;
    root.setAttribute('data-theme', s.theme === 'dark' ? 'dark' : 'light');
    const accent = S.ACCENTS.find(a => a.id === s.accent) || S.ACCENTS[0];
    const dark = s.theme === 'dark';
    root.style.setProperty('--accent', dark ? accent.dark : accent.value);
    root.style.setProperty('--accent-soft', dark ? accent.darkSoft : accent.soft);
  }

  /* --- Store-Bindungen (data-store) ------------------------------------ */

  function resolveStoreTarget(spec) {
    const parts = String(spec).split(':');
    const kind = parts[0];
    const id = parts[1] || '';
    const path = parts.slice(2).join(':');

    if (kind === 'milestone') {
      const [projectId, msId] = id.split('.');
      const p = S.find('project', projectId);
      const ms = p && (p.milestones || []).find(m => m.id === msId);
      return { obj: ms, path: path };
    }
    return { obj: S.find(kind, id), path: path };
  }

  function writeStore(el, rerender) {
    const spec = el.getAttribute('data-store');
    if (!spec) return;
    const { obj, path } = resolveStoreTarget(spec);
    if (!obj || !path) return;

    let value;
    if (el.type === 'checkbox') value = el.checked;
    else if (el.hasAttribute('data-number') || el.type === 'range' || el.type === 'number') value = Number(el.value);
    else value = el.value;

    U.setPath(obj, path, value);
    if (obj.updatedAt !== undefined) obj.updatedAt = new Date().toISOString();

    if (rerender) S.update();
    else S.silent();
  }

  /* --- Ereignisse --------------------------------------------------------- */

  function bindEvents() {
    document.addEventListener('click', e => {
      const target = e.target.closest('[data-act]');
      if (!target) return;
      if (target.tagName === 'SELECT') return;
      const act = target.getAttribute('data-act');
      const fn = OS.actions[act];
      if (!fn) return;
      e.preventDefault();
      fn(target, Object.assign({}, target.dataset), e);
    });

    document.addEventListener('change', e => {
      const el = e.target;
      if (el.matches('[data-store]')) {
        writeStore(el, el.hasAttribute('data-rerender') || el.tagName === 'SELECT' || el.type === 'checkbox');
        return;
      }
      const actEl = el.closest('[data-act]');
      if (actEl && (actEl.tagName === 'SELECT' || el.type === 'radio' || el.type === 'checkbox')) {
        const fn = OS.actions[actEl.getAttribute('data-act')];
        if (fn) fn(actEl, Object.assign({}, actEl.dataset), e);
      }
    });

    const debouncedWrite = U.debounce(el => writeStore(el, false), 260);
    document.addEventListener('input', e => {
      const el = e.target;
      if (el.matches('textarea[data-autosize], .ghost-area')) U.autosize(el);
      if (!el.matches('[data-store]')) return;
      if (el.type === 'range') { writeStore(el, false); updateRangeLabel(el); return; }
      debouncedWrite(el);
    });

    document.getElementById('overlay').addEventListener('click', () => OS.ui.closeDrawer());

    window.addEventListener('hashchange', render);

    window.addEventListener('scroll', () => {
      const bar = document.querySelector('.topbar');
      if (bar) bar.classList.toggle('is-stuck', window.scrollY > 8);
    }, { passive: true });

    document.addEventListener('keydown', onKey);
  }

  function updateRangeLabel(el) {
    const label = el.parentElement && el.parentElement.querySelector('.progress-value');
    if (label) label.textContent = el.value + ' %';
  }

  function isTyping(e) {
    const el = e.target;
    return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
  }

  function onKey(e) {
    if (e.key === 'Escape') {
      if (!OS.ui.closeTopModal()) OS.ui.closeDrawer();
      return;
    }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      openSearch();
      return;
    }
    if (isTyping(e) || e.metaKey || e.ctrlKey || e.altKey) return;

    if (e.key === '/') { e.preventDefault(); openSearch(); }
    else if (e.key === 'n') { e.preventDefault(); openNew(); }
    else if (e.key === 'i') { e.preventDefault(); openInbox(); }
    else if (['1', '2', '3', '4', '5'].includes(e.key)) {
      e.preventDefault();
      go('#/' + ROUTES[Number(e.key) - 1]);
    }
  }

  /* --- Inbox ------------------------------------------------------------- */

  function inboxHtml() {
    const items = S.inbox();
    const kinds = [
      { id: 'aufgabe', label: 'Aufgabe' },
      { id: 'idee', label: 'Idee' },
      { id: 'sorge', label: 'Sorge' }
    ];
    const kind = OS.app._inboxKind || 'aufgabe';

    return '<div class="drawer-head">' +
        '<div><span class="overline">Inbox</span>' +
          '<h3 style="margin-top:8px">Alles darf hier landen</h3>' +
          '<p class="small muted" style="margin-top:6px">Aufgaben, Ideen, Sorgen. Sortiert wird später.</p></div>' +
        '<button class="icon-btn" data-act="ui.closeDrawer" aria-label="Schließen">' + U.icons.close + '</button>' +
      '</div>' +
      '<div class="drawer-body">' +
        '<div class="quick-capture" style="margin-bottom:22px">' +
          '<div class="kind-picker">' + kinds.map(k =>
            '<button class="chip chip-btn' + (kind === k.id ? ' is-on' : '') + '" data-act="inbox.kind" data-kind="' + k.id + '">' +
            k.label + '</button>').join('') + '</div>' +
          '<textarea class="textarea" rows="2" data-inbox-input data-autofocus placeholder="Was liegt an? Enter speichert."></textarea>' +
          '<button class="btn btn-sm btn-primary" data-act="inbox.add">Aufnehmen</button>' +
        '</div>' +
        (items.length ? items.map(item =>
          '<div class="inbox-item kind-' + U.esc(item.kind) + '">' +
            '<div class="ii-main">' +
              '<span class="kind-mark">' + U.esc(S.INBOX_KIND_LABEL[item.kind] || '') + '</span>' +
              '<div class="ii-text">' + U.nl2br(item.text) + '</div>' +
              '<div class="ii-actions">' +
                '<button class="btn btn-sm" data-act="inbox.toToday" data-id="' + item.id + '">Heute</button>' +
                '<button class="btn btn-sm" data-act="inbox.toTask" data-id="' + item.id + '">Aufgabe</button>' +
                '<button class="btn btn-sm" data-act="inbox.toIdea" data-id="' + item.id + '">Idee</button>' +
                '<button class="btn btn-sm" data-act="inbox.toProject" data-id="' + item.id + '">Projekt</button>' +
                '<button class="btn btn-sm btn-quiet" data-act="inbox.remove" data-id="' + item.id + '">Erledigt</button>' +
              '</div>' +
            '</div>' +
          '</div>').join('')
          : '<div class="empty">Die Inbox ist leer. Ein guter Zustand.</div>') +
      '</div>';
  }

  function openInbox() {
    OS.ui.openDrawer(inboxHtml);
    setTimeout(() => {
      const input = document.querySelector('[data-inbox-input]');
      if (input) {
        input.focus();
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addFromInbox(); }
        });
      }
    }, 50);
  }

  function addFromInbox() {
    const input = document.querySelector('[data-inbox-input]');
    if (!input) return;
    const text = input.value.trim();
    if (!text) return;
    S.update(() => S.addInbox({ text: text, kind: OS.app._inboxKind || 'aufgabe' }));
    const fresh = document.querySelector('[data-inbox-input]');
    if (fresh) fresh.focus();
  }

  /* --- Neu ---------------------------------------------------------------- */

  function openNew() {
    const tiles = [
      { act: 'os.taskNew', title: 'Aufgabe', desc: 'Eine konkrete Handlung' },
      { act: 'ui.inbox', title: 'Inbox-Notiz', desc: 'Schnell wegschreiben' },
      { act: 'os.projectNew', title: 'Projekt', desc: 'Mit Ergebnis und Ende' },
      { act: 'os.goalNew', title: 'Ziel', desc: 'Was wahr sein soll' },
      { act: 'os.ideaNew', title: 'Idee', desc: 'Ohne Verpflichtung' },
      { act: 'os.blockNew', title: 'Zeitblock', desc: 'Zeit für eine Sache' }
    ];
    OS.ui.modal({
      title: 'Neu',
      size: 'sm',
      body: '<div class="new-grid">' + tiles.map(t =>
        '<button class="new-tile" data-act="' + t.act + '" data-from-new="1">' +
          '<div class="nt-title">' + t.title + '</div>' +
          '<div class="nt-desc">' + t.desc + '</div>' +
        '</button>').join('') + '</div>'
    });
  }

  /* --- Suche ---------------------------------------------------------------- */

  function searchAll(query) {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    const hits = [];

    function match(text) { return String(text || '').toLowerCase().includes(q); }

    S.state.tasks.forEach(t => {
      if (match(t.title) || match(t.notes)) hits.push({ kind: 'Aufgabe', title: t.title, act: 'os.taskEdit', id: t.id });
    });
    S.state.projects.forEach(p => {
      if (match(p.name) || match(p.why) || match(p.outcome) || match(p.nextAction) || match(p.notes))
        hits.push({ kind: 'Projekt', title: p.name, act: 'os.projectOpen', id: p.id });
    });
    S.state.goals.forEach(g => {
      if (match(g.title) || match(g.why) || match(g.metric) || match(g.summary))
        hits.push({ kind: 'Ziel', title: g.title, act: 'os.goalOpen', id: g.id });
    });
    S.state.ideas.forEach(i => {
      if (match(i.title) || match(i.notes)) hits.push({ kind: 'Idee', title: i.title, act: 'projekte.ideaEdit', id: i.id });
    });
    S.state.inbox.forEach(i => {
      if (match(i.text)) hits.push({ kind: 'Inbox', title: i.text, act: 'ui.inbox', id: i.id });
    });
    S.state.method255.wishes.forEach(w => {
      if (match(w.text)) hits.push({ kind: '25/5', title: w.text, act: 'ui.goMethod', id: w.id });
    });
    S.state.seasons.forEach(s => {
      if (match(s.title) || match(s.motto)) hits.push({ kind: 'Saison', title: s.title, act: 'ui.goSeason', id: s.id });
    });
    Object.keys(S.state.days).forEach(key => {
      const d = S.state.days[key];
      if (match(d.oneThing) || match(d.intention) || match(d.checkin && d.checkin.note) ||
        match(d.close && d.close.done) || match(d.close && d.close.takeaway)) {
        hits.push({ kind: 'Tag · ' + U.fmtShort(key), title: d.oneThing || d.intention || U.fmtLong(key), act: 'ui.goDay', id: key });
      }
    });
    S.state.reviews.forEach(r => {
      const text = Object.keys(r.answers).map(k => r.answers[k]).join(' ');
      if (match(text)) hits.push({
        kind: r.type === 'woche' ? 'Wochenreview' : 'Saisonreview',
        title: U.trunc(text.trim(), 70), act: 'system.openReview', id: r.id
      });
    });

    return hits.slice(0, 40);
  }

  function openSearch() {
    const api = OS.ui.modal({
      size: 'lg',
      body: '<div style="margin:-22px -28px">' +
        '<input class="search-input" data-search placeholder="Suchen …" data-autofocus>' +
        '<div class="search-results" data-results></div>' +
        '</div>'
    });

    const input = api.root.querySelector('[data-search]');
    const results = api.root.querySelector('[data-results]');
    let cursor = 0;
    let hits = [];

    function draw() {
      if (!input.value.trim()) {
        results.innerHTML = '<div style="padding:18px 22px" class="small muted">' +
          'Durchsucht Aufgaben, Projekte, Ziele, Ideen, Inbox, Tage und Reviews.</div>';
        return;
      }
      hits = searchAll(input.value);
      if (!hits.length) {
        results.innerHTML = '<div style="padding:18px 22px" class="small muted">Nichts gefunden.</div>';
        return;
      }
      results.innerHTML = hits.map((h, i) =>
        '<button class="search-hit' + (i === cursor ? ' is-cursor' : '') + '" data-hit="' + i + '">' +
          '<span class="hit-kind">' + U.esc(h.kind) + '</span>' +
          '<div class="hit-title">' + U.esc(U.trunc(h.title || 'Ohne Titel', 90)) + '</div>' +
        '</button>').join('');
      results.querySelectorAll('[data-hit]').forEach(btn => {
        btn.addEventListener('click', () => choose(Number(btn.getAttribute('data-hit'))));
      });
    }

    function choose(i) {
      const hit = hits[i];
      if (!hit) return;
      api.close();
      const fn = OS.actions[hit.act];
      if (fn) fn(null, { id: hit.id, d: hit.id });
    }

    input.addEventListener('input', () => { cursor = 0; draw(); });
    input.addEventListener('keydown', e => {
      if (e.key === 'ArrowDown') { e.preventDefault(); cursor = Math.min(cursor + 1, hits.length - 1); draw(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); cursor = Math.max(cursor - 1, 0); draw(); }
      else if (e.key === 'Enter') { e.preventDefault(); choose(cursor); }
    });

    draw();
  }

  /* --- Gemeinsame Aktionen ------------------------------------------------------ */

  const sharedActions = {
    'ui.search': openSearch,
    'ui.inbox': openInbox,
    'ui.new': openNew,
    'ui.closeDrawer': () => OS.ui.closeDrawer(),
    'ui.goProjects': () => go('#/projekte?tab=aktiv'),
    'ui.goAreas': () => go('#/system?tab=bereiche'),
    'ui.goHabits': () => go('#/system?tab=gewohnheiten'),
    'ui.goArchive': () => go('#/system?tab=archiv'),
    'ui.goTemplates': () => go('#/system?tab=vorlagen'),
    'ui.goMethod': () => go('#/projekte?tab=methode'),
    'ui.goSeason': (el, ds) => go('#/saison' + (ds && ds.id ? '?s=' + ds.id : '')),
    'ui.goDay': (el, ds) => go('#/heute?d=' + (ds && ds.id ? ds.id : U.today())),

    'os.taskNew': (el, ds) => OS.forms.task(null, {
      projectId: (ds && ds.project) || null,
      date: (ds && ds.date) || null
    }),
    'os.taskEdit': (el, ds) => OS.forms.task(ds.id),
    'os.taskToggle': (el, ds) => S.update(() => S.toggleTask(ds.id)),
    'os.taskPlan': (el, ds) => OS.forms.planTask(ds.id),
    'os.taskArchive': (el, ds) => {
      S.update(() => { const t = S.find('task', ds.id); if (t) t.status = 'archived'; });
      OS.ui.toast('Archiviert.', {
        label: 'Rückgängig',
        onClick: () => S.update(() => { const t = S.find('task', ds.id); if (t) t.status = 'open'; })
      });
    },

    'os.projectNew': (el, ds) => OS.forms.project({ goalIds: ds && ds.goal ? [ds.goal] : [] }),
    'os.projectOpen': (el, ds) => OS.forms.projectDetail(ds.id),
    'os.projectGoalToggle': (el, ds) => {
      S.update(() => {
        const p = S.find('project', ds.id);
        if (!p) return;
        const i = p.goalIds.indexOf(ds.goal);
        if (i >= 0) p.goalIds.splice(i, 1); else p.goalIds.push(ds.goal);
      });
    },
    'os.projectArchive': async (el, ds) => {
      const ok = await OS.ui.confirm({
        title: 'Projekt archivieren?',
        text: 'Es verschwindet aus der aktiven Ansicht und bleibt im Archiv lesbar.',
        confirmLabel: 'Archivieren'
      });
      if (!ok) return;
      S.update(() => { const p = S.find('project', ds.id); if (p) { p.status = 'archiviert'; p.archivedAt = new Date().toISOString(); } });
      OS.ui.closeAllModals();
    },
    'os.projectDelete': async (el, ds) => {
      const ok = await OS.ui.confirm({
        title: 'Projekt löschen?',
        text: 'Zugehörige Aufgaben bleiben bestehen, verlieren aber ihre Verknüpfung.',
        confirmLabel: 'Löschen', tone: 'danger'
      });
      if (!ok) return;
      S.update(() => {
        S.state.tasks.forEach(t => { if (t.projectId === ds.id) t.projectId = null; });
        S.remove('project', ds.id);
      });
      OS.ui.closeAllModals();
    },
    'os.milestoneAdd': async (el, ds) => {
      const title = await OS.ui.prompt({ title: 'Meilenstein', label: 'Was ist dann erreicht?' });
      if (!title) return;
      S.update(() => {
        const p = S.find('project', ds.id);
        if (!p) return;
        if (!Array.isArray(p.milestones)) p.milestones = [];
        p.milestones.push({ id: U.uid('m'), title: title, done: false, due: null });
      });
    },
    'os.milestoneToggle': (el, ds) => {
      S.update(() => {
        const p = S.find('project', ds.id);
        const m = p && (p.milestones || []).find(x => x.id === ds.ms);
        if (m) m.done = !m.done;
      });
    },
    'os.milestoneRemove': (el, ds) => {
      S.update(() => {
        const p = S.find('project', ds.id);
        if (!p) return;
        const i = (p.milestones || []).findIndex(x => x.id === ds.ms);
        if (i >= 0) p.milestones.splice(i, 1);
      });
    },

    'os.goalNew': (el, ds) => OS.forms.goal({ projectId: (ds && ds.project) || null }),
    'os.goalOpen': (el, ds) => OS.forms.goalDetail(ds.id),
    'os.goalFramework': (el, ds) => {
      S.update(() => {
        const g = S.find('goal', ds.id);
        if (!g) return;
        if (!g.framework) g.framework = { type: 'frei', fields: {} };
        g.framework.type = ds.fw;
      });
    },
    'os.goalSummarize': (el, ds) => {
      S.update(() => {
        const g = S.find('goal', ds.id);
        if (g) g.summary = OS.forms.summarize(g);
      });
      OS.ui.toast('Zielkarte aktualisiert.');
    },
    'os.goalProgressMode': (el, ds) => {
      S.update(() => {
        const g = S.find('goal', ds.id);
        if (g) g.progressMode = ds.mode;
      });
    },
    'os.goalDelete': async (el, ds) => {
      const ok = await OS.ui.confirm({
        title: 'Ziel löschen?',
        text: 'Verknüpfte Projekte bleiben bestehen.',
        confirmLabel: 'Löschen', tone: 'danger'
      });
      if (!ok) return;
      S.update(() => {
        S.state.projects.forEach(p => {
          const i = (p.goalIds || []).indexOf(ds.id);
          if (i >= 0) p.goalIds.splice(i, 1);
        });
        S.remove('goal', ds.id);
      });
      OS.ui.closeAllModals();
    },

    'os.ideaNew': () => OS.forms.idea(),
    'os.areaNew': () => OS.forms.area(),
    'os.habitNew': () => OS.forms.habit(),
    'os.blockNew': () => OS.forms.block(U.today()),

    'inbox.kind': (el, ds) => { OS.app._inboxKind = ds.kind; OS.ui.renderDrawer(); openInboxFocus(); },
    'inbox.add': addFromInbox,
    'inbox.remove': (el, ds) => S.update(() => S.remove('inbox', ds.id)),
    'inbox.toToday': (el, ds) => {
      S.update(() => {
        const item = S.find('inbox', ds.id);
        if (!item) return;
        S.addTask({ title: item.text, date: U.today() });
        S.remove('inbox', ds.id);
      });
      OS.ui.toast('Für heute geplant.');
    },
    'inbox.toTask': (el, ds) => {
      const item = S.find('inbox', ds.id);
      if (!item) return;
      const text = item.text;
      S.update(() => S.remove('inbox', ds.id));
      OS.forms.task(null, { title: text });
    },
    'inbox.toIdea': (el, ds) => {
      S.update(() => {
        const item = S.find('inbox', ds.id);
        if (!item) return;
        S.addIdea({ title: item.text });
        S.remove('inbox', ds.id);
      });
      OS.ui.toast('In Ideen abgelegt.');
    },
    'inbox.toProject': (el, ds) => {
      const item = S.find('inbox', ds.id);
      if (!item) return;
      OS.forms.project({ name: item.text });
      S.update(() => S.remove('inbox', ds.id));
    }
  };

  function openInboxFocus() {
    setTimeout(() => {
      const input = document.querySelector('[data-inbox-input]');
      if (input) {
        input.focus();
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); addFromInbox(); }
        });
      }
    }, 40);
  }

  /* --- Start ------------------------------------------------------------------- */

  function init() {
    S.init();

    // Beim allerersten Start der Systemeinstellung folgen. Danach entscheidet der Schalter.
    if (S.isFresh() && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
      S.silent(() => { S.state.settings.theme = 'dark'; });
    }
    applySettings();

    registerActions(sharedActions);
    Object.keys(OS.views).forEach(key => {
      if (OS.views[key].actions) registerActions(OS.views[key].actions);
    });

    bindEvents();
    S.subscribe(() => { render(); });
    render();

    // Kopplung, sofern eingerichtet. Ohne Zugangsdaten passiert nichts.
    if (OS.sync) OS.sync.start();
  }

  return {
    init: init, render: render, go: go, applySettings: applySettings,
    registerActions: registerActions, openSearch: openSearch, openInbox: openInbox,
    get current() { return current; },
    _inboxKind: 'aufgabe'
  };
})();



/* Start, auch wenn das Dokument bereits geladen ist. */
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', function () { OS.app.init(); });
} else {
  OS.app.init();
}
</script>
