  function migrate(data) {
    const base = blank();
    const next = Object.assign({}, base, data || {});
    next.settings = Object.assign({}, base.settings, data && data.settings);
    next.meta = Object.assign({}, base.meta, data && data.meta);
    next.method255 = Object.assign({}, base.method255, data && data.method255);
    ['areas', 'seasons', 'goals', 'projects', 'tasks', 'inbox', 'ideas', 'habits', 'reviews', 'templates']
      .forEach(k => { if (!Array.isArray(next[k])) next[k] = []; });
    if (!next.days || typeof next.days !== 'object') next.days = {};
    if (!next.weeks || typeof next.weeks !== 'object') next.weeks = {};
    if (!Array.isArray(next.method255.wishes)) next.method255.wishes = [];
    next.version = VERSION;
    return next;
  }

  let saveTimer = null;
  function save(immediate) {
    state.meta.updatedAt = new Date().toISOString();
    const write = () => {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
      } catch (err) {
        console.error('OS: Speichern fehlgeschlagen.', err);
        if (OS.ui && OS.ui.toast) OS.ui.toast('Speichern fehlgeschlagen. Speicher voll?');
      }
    };
    if (immediate) { clearTimeout(saveTimer); write(); return; }
    clearTimeout(saveTimer);
    saveTimer = setTimeout(write, 180);
  }

  function init() {
    if (ready) return state;
    const loaded = load();
    state = loaded || blank();
    ready = true;
    fresh = !loaded;
    if (!loaded) save(true);
    return state;
  }

  /** true, wenn dieser Browser noch keine Daten hatte */
  function isFresh() { return fresh; }

  function subscribe(fn) { listeners.push(fn); return () => {
    const i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1);
  }; }

  function emit() { listeners.slice().forEach(fn => fn(state)); }

  /** Mutation mit Neuzeichnen */
  function update(mutator) {
    const result = mutator ? mutator(state) : undefined;
    save();
    emit();
    return result;
  }

  /** Mutation ohne Neuzeichnen (z. B. laufende Texteingabe) */
  function silent(mutator) {
    const result = mutator ? mutator(state) : undefined;
    save();
    return result;
  }

  function isEmpty() {
    return !state.areas.length && !state.projects.length && !state.goals.length &&
      !state.tasks.length && !state.inbox.length && !state.ideas.length &&
      !state.seasons.length && !state.habits.length && !state.method255.wishes.length;
  }

  /* --- Tagesobjekte / Wochenobjekte ---------------------------- */

  function dayDefaults() {
    return {
      intention: '',
      oneThing: '',
      checkin: { energy: null, mood: '', note: '' },
      close: { done: '', takeaway: '', closedAt: null },
      blocks: []
    };
  }

  function weekDefaults() {
    return { focus: '', top3: ['', '', ''], notThisWeek: [] };
  }

  /** Lesend – legt nichts an */
  function getDay(key) {
    const d = state.days[key];
    if (!d) return Object.assign(dayDefaults(), { _key: key });
    return Object.assign(dayDefaults(), d, {
      checkin: Object.assign(dayDefaults().checkin, d.checkin),
      close: Object.assign(dayDefaults().close, d.close),
      blocks: Array.isArray(d.blocks) ? d.blocks : [],
      _key: key
    });
  }

  /** Schreibend – legt bei Bedarf an */
  function ensureDay(key) {
    if (!state.days[key]) state.days[key] = dayDefaults();
    const d = state.days[key];
    if (!d.checkin) d.checkin = dayDefaults().checkin;
    if (!d.close) d.close = dayDefaults().close;
    if (!Array.isArray(d.blocks)) d.blocks = [];
    return d;
  }

  function getWeek(key) {
    const w = state.weeks[key];
    if (!w) return Object.assign(weekDefaults(), { _key: key });
    return Object.assign(weekDefaults(), w, {
      top3: Array.isArray(w.top3) ? w.top3.concat(['', '', '']).slice(0, 3) : ['', '', ''],
      notThisWeek: Array.isArray(w.notThisWeek) ? w.notThisWeek : [],
      _key: key
    });
  }

  function ensureWeek(key) {
    if (!state.weeks[key]) state.weeks[key] = weekDefaults();
    const w = state.weeks[key];
    if (!Array.isArray(w.top3)) w.top3 = ['', '', ''];
    while (w.top3.length < 3) w.top3.push('');
    if (!Array.isArray(w.notThisWeek)) w.notThisWeek = [];
    return w;
  }

  /* --- Generischer Feldzugriff --------------------------------- */

  const COLLECTIONS = {
    task: 'tasks', project: 'projects', goal: 'goals', idea: 'ideas',
    area: 'areas', habit: 'habits', season: 'seasons', inbox: 'inbox',
    review: 'reviews', template: 'templates'
  };

  function find(kind, id) {
    if (kind === 'day') return ensureDay(id);
    if (kind === 'week') return ensureWeek(id);
    if (kind === 'settings') return state.settings;
    if (kind === 'method') return state.method255;
    if (kind === 'wish') return state.method255.wishes.find(w => w.id === id);
    const coll = COLLECTIONS[kind];
    if (!coll) return null;
    return state[coll].find(item => item.id === id);
  }

  function all(kind) {
    const coll = COLLECTIONS[kind];
    return coll ? state[coll] : [];
  }

  /** data-store="kind:id:pfad" */
  function setField(kind, id, path, value, opts) {
    const target = find(kind, id);
    if (!target) return null;
    U.setPath(target, path, value);
    if (target.updatedAt !== undefined || COLLECTIONS[kind]) target.updatedAt = new Date().toISOString();
    if (opts && opts.rerender) { save(); emit(); } else { save(); }
    return target;
  }

  function remove(kind, id) {
    const coll = COLLECTIONS[kind];
    if (!coll) return;
    const i = state[coll].findIndex(item => item.id === id);
    if (i >= 0) state[coll].splice(i, 1);
  }

  /* --- Fabriken ------------------------------------------------ */

  function nextOrder(list) {
    return list.reduce((max, item) => Math.max(max, (item.order ?? 0) + 1), 0);
  }

  function addTask(data) {
    const task = Object.assign({
      id: U.uid('t'),
      title: '',
      notes: '',
      status: 'open',
      date: null,
      projectId: null,
      goalId: null,
      areaId: null,
      createdAt: new Date().toISOString(),
      completedAt: null,
      order: nextOrder(state.tasks)
    }, data || {});
    state.tasks.push(task);
    return task;
  }

  function addProject(data) {
    const project = Object.assign({
      id: U.uid('p'),
      name: '',
      why: '',
      outcome: '',
      nextAction: '',
      milestones: [],
      start: null,
      due: null,
      status: 'geplant',
      goalIds: [],
      areaId: null,
      notes: '',
      resources: [],
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      archivedAt: null,
      order: nextOrder(state.projects)
    }, data || {});
    if (!Array.isArray(project.goalIds)) project.goalIds = project.goalIds ? [project.goalIds] : [];
    state.projects.push(project);
    return project;
  }

  function addGoal(data) {
    const goal = Object.assign({
      id: U.uid('g'),
      title: '',
      why: '',
      metric: '',
      horizon: 'saison',
      seasonId: null,
      areaId: null,
      status: 'offen',
      progress: 0,
      progressMode: 'manuell',
      framework: { type: 'frei', fields: {} },
      summary: '',
      start: null,
      end: null,
      fromWishId: null,
      createdAt: new Date().toISOString(),
      order: nextOrder(state.goals)
    }, data || {});
    if (!goal.framework) goal.framework = { type: 'frei', fields: {} };
    state.goals.push(goal);
    return goal;
  }

  function addIdea(data) {
    const idea = Object.assign({
      id: U.uid('i'),
      title: '',
      notes: '',
      tags: [],
      areaId: null,
      priority: 'mittel',
      status: 'idee',
      createdAt: new Date().toISOString(),
      order: nextOrder(state.ideas)
    }, data || {});
    state.ideas.push(idea);
    return idea;
  }

  function addInbox(data) {
    const item = Object.assign({
      id: U.uid('n'),
      text: '',
      kind: 'aufgabe',
      createdAt: new Date().toISOString()
    }, data || {});
    state.inbox.unshift(item);
    return item;
  }

  function addArea(data) {
    const area = Object.assign({
      id: U.uid('a'),
      name: '',
      color: AREA_COLORS[state.areas.length % AREA_COLORS.length],
      archived: false,
      order: nextOrder(state.areas)
    }, data || {});
    state.areas.push(area);
    return area;
  }

  function addHabit(data) {
    const habit = Object.assign({
      id: U.uid('h'),
      name: '',
      archived: false,
      log: {},
      order: nextOrder(state.habits)
    }, data || {});
    state.habits.push(habit);
    return habit;
  }

  function addSeason(data) {
    const season = Object.assign({
      id: U.uid('s'),
      title: '',
      motto: '',
      start: U.today(),
      end: U.addDays(U.today(), 12 * 7 - 1),
      notList: [],
      archived: false,
      createdAt: new Date().toISOString()
    }, data || {});
    if (!Array.isArray(season.notList)) season.notList = [];
    state.seasons.push(season);
    return season;
  }

  function addReview(data) {
    const review = Object.assign({
      id: U.uid('r'),
      type: 'woche',
      periodKey: U.weekKey(U.today()),
      seasonId: null,
      answers: {},
      goalRatings: {},
      createdAt: new Date().toISOString()
    }, data || {});
    state.reviews.unshift(review);
    return review;
  }

  function addTemplate(data) {
    const tpl = Object.assign({
      id: U.uid('tpl'),
      kind: 'ziel',
      name: '',
      payload: {},
      createdAt: new Date().toISOString()
    }, data || {});
    state.templates.push(tpl);
    return tpl;
  }

  /* --- Selektoren ---------------------------------------------- */

  function areas(includeArchived) {
    return state.areas
      .filter(a => includeArchived || !a.archived)
      .slice().sort(U.byOrder);
  }

  function area(id) { return state.areas.find(a => a.id === id) || null; }

  function habits(includeArchived) {
    return state.habits
      .filter(h => includeArchived || !h.archived)
      .slice().sort(U.byOrder);
  }

  function habitDone(habit, dateKey) {
    return !!(habit && habit.log && habit.log[dateKey]);
  }

  function toggleHabit(habitId, dateKey) {
    const h = find('habit', habitId);
    if (!h) return;
    if (!h.log) h.log = {};
    if (h.log[dateKey]) delete h.log[dateKey];
    else h.log[dateKey] = true;
  }

  function tasks(filter) {
    let list = state.tasks.slice();
    const f = filter || {};
    if (f.date !== undefined) list = list.filter(t => t.date === f.date);
    if (f.status) list = list.filter(t => (Array.isArray(f.status) ? f.status.includes(t.status) : t.status === f.status));
    if (f.projectId) list = list.filter(t => t.projectId === f.projectId);
    if (f.notArchived) list = list.filter(t => t.status !== 'archived');
    return list.sort((a, b) => {
      const s = (a.status === 'done' ? 1 : 0) - (b.status === 'done' ? 1 : 0);
      return s !== 0 ? s : U.byOrder(a, b);
    });
  }

  function dayTasks(dateKey) {
    return tasks({ date: dateKey, notArchived: true });
  }

  function openDayTasks(dateKey) {
    return tasks({ date: dateKey, status: 'open' });
  }

  function unplannedTasks() {
    return state.tasks
      .filter(t => !t.date && t.status === 'open')
      .sort(U.byOrder);
  }

  function toggleTask(taskId) {
    const t = find('task', taskId);
    if (!t) return;
    if (t.status === 'done') { t.status = 'open'; t.completedAt = null; }
    else { t.status = 'done'; t.completedAt = new Date().toISOString(); }
  }

  function projects(filter) {
    const f = filter || {};
    let list = state.projects.slice();
    if (f.status) list = list.filter(p => (Array.isArray(f.status) ? f.status.includes(p.status) : p.status === f.status));
    if (f.goalId) list = list.filter(p => (p.goalIds || []).includes(f.goalId));
    if (f.areaId) list = list.filter(p => p.areaId === f.areaId);
    if (f.live) list = list.filter(p => !['abgeschlossen', 'archiviert'].includes(p.status));
    return list.sort(U.byOrder);
  }

  function activeProjects() { return projects({ status: 'aktiv' }); }

  function projectProgress(project) {
    if (!project) return 0;
    const ms = project.milestones || [];
    if (!ms.length) return project.status === 'abgeschlossen' ? 100 : 0;
    return Math.round(ms.filter(m => m.done).length / ms.length * 100);
  }

  function goals(filter) {
    const f = filter || {};
    let list = state.goals.slice();
    if (f.horizon) list = list.filter(g => g.horizon === f.horizon);
    if (f.seasonId) list = list.filter(g => g.seasonId === f.seasonId);
    if (f.areaId) list = list.filter(g => g.areaId === f.areaId);
    if (f.open) list = list.filter(g => !['erreicht', 'verworfen'].includes(g.status));
    return list.sort(U.byOrder);
  }

  function seasonGoals(seasonId) {
    return state.goals.filter(g => g.seasonId === seasonId).sort(U.byOrder);
  }

  function goalProgress(goal) {
    if (!goal) return 0;
    if (goal.progressMode !== 'abgeleitet') return U.clamp(Number(goal.progress) || 0, 0, 100);
    const linked = projects({ goalId: goal.id });
    if (!linked.length) return 0;
    let done = 0, total = 0;
    linked.forEach(p => {
      const ms = p.milestones || [];
      if (ms.length) { total += ms.length; done += ms.filter(m => m.done).length; }
      else { total += 1; done += p.status === 'abgeschlossen' ? 1 : 0; }
    });
    return total ? Math.round(done / total * 100) : 0;
  }

  function currentSeason() {
    const today = U.today();
    const live = state.seasons.filter(s => !s.archived);
    const running = live.find(s => s.start && s.end && s.start <= today && today <= s.end);
    if (running) return running;
    const upcoming = live.filter(s => s.start && s.start > today).sort((a, b) => a.start.localeCompare(b.start))[0];
    if (upcoming) return upcoming;
    return live.slice().sort((a, b) => String(b.start).localeCompare(String(a.start)))[0] || null;
  }

  function seasonProgress(season) {
    if (!season || !season.start || !season.end) return { pct: 0, week: 0, weeks: 0, daysLeft: 0 };
    const total = Math.max(1, U.diffDays(season.start, season.end) + 1);
    const passed = U.clamp(U.diffDays(season.start, U.today()) + 1, 0, total);
    return {
      pct: Math.round(passed / total * 100),
      week: Math.max(1, Math.ceil(passed / 7)),
      weeks: Math.ceil(total / 7),
      daysLeft: Math.max(0, total - passed)
    };
  }

  function orphanProjects() {
    return projects({ status: ['aktiv', 'geplant'] }).filter(p => !(p.goalIds || []).length);
  }

  function ideas(filter) {
    const f = filter || {};
    let list = state.ideas.slice();
    if (f.status) list = list.filter(i => (Array.isArray(f.status) ? f.status.includes(i.status) : i.status === f.status));
    if (f.areaId) list = list.filter(i => i.areaId === f.areaId);
    return list.sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  }

  function inbox() { return state.inbox.slice(); }

  function reviews(type) {
    return state.reviews
      .filter(r => !type || r.type === type)
      .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
  }

  function wishes() { return state.method255.wishes.slice(); }
  function topWishes() { return state.method255.wishes.filter(w => w.top); }
  function avoidWishes() { return state.method255.wishes.filter(w => !w.top); }

  function dayBlocks(dateKey) {
    return getDay(dateKey).blocks.slice().sort((a, b) => String(a.start).localeCompare(String(b.start)));
  }

  function dayPlannedHours(dateKey) {
    return dayBlocks(dateKey).reduce((sum, b) => sum + U.blockHours(b), 0);
  }

  function weekCapacity(wKey) {
    const days = U.weekDays(wKey);
    let focusBlocks = 0, focusHours = 0, termine = 0, plannedHours = 0, taskCount = 0;
    days.forEach(key => {
      dayBlocks(key).forEach(b => {
        const h = U.blockHours(b);
        plannedHours += h;
        if (b.type === 'fokus') { focusBlocks++; focusHours += h; }
        if (b.type === 'termin') termine++;
      });
      taskCount += tasks({ date: key, status: 'open' }).length;
    });
    const capacity = (state.settings.dailyCapacityHours || 6) * 7;
    return {
      focusBlocks, focusHours, termine, plannedHours, taskCount,
      capacity,
      free: Math.max(0, capacity - plannedHours),
      load: capacity ? U.clamp(plannedHours / capacity, 0, 1) : 0
    };
  }

  /* --- Archiv ---------------------------------------------------- */

  function archiveCounts() {
    return {
      projects: state.projects.filter(p => ['abgeschlossen', 'archiviert'].includes(p.status)).length,
      seasons: state.seasons.filter(s => s.archived).length,
      reviews: state.reviews.length,
      tasks: state.tasks.filter(t => t.status === 'archived').length,
      ideas: state.ideas.filter(i => i.status === 'archiviert').length
    };
  }

  function stats() {
    return {
      areas: state.areas.length,
      projects: state.projects.length,
      goals: state.goals.length,
      tasks: state.tasks.length,
      ideas: state.ideas.length,
      habits: state.habits.length,
      reviews: state.reviews.length,
      days: Object.keys(state.days).length,
      inbox: state.inbox.length
    };
  }

  /* --- Export / Import -------------------------------------------- */

  function exportData() {
    return JSON.stringify({
      app: 'OS',
      version: VERSION,
      exportedAt: new Date().toISOString(),
      state: state
    }, null, 2);
  }

  function exportFileName() {
    return 'os-export-' + U.today() + '.json';
  }

  function exportFile() {
    return U.saveFile(exportFileName(), exportData());
  }

  /** mode: 'ersetzen' | 'zusammenfuehren' */
  function importData(json, mode) {
    let parsed;
    try { parsed = JSON.parse(json); }
    catch (err) { throw new Error('Die Datei ist kein gültiges JSON.'); }

    const incoming = parsed && parsed.state ? parsed.state : parsed;
    if (!incoming || typeof incoming !== 'object') throw new Error('Die Datei enthält keine OS-Daten.');
    const clean = migrate(incoming);

    if (mode === 'zusammenfuehren') {
      const merged = migrate(JSON.parse(JSON.stringify(state)));
      Object.keys(COLLECTIONS).forEach(kind => {
        const coll = COLLECTIONS[kind];
        const known = new Set(merged[coll].map(x => x.id));
        (clean[coll] || []).forEach(item => { if (!known.has(item.id)) merged[coll].push(item); });
      });
      Object.keys(clean.days || {}).forEach(k => { if (!merged.days[k]) merged.days[k] = clean.days[k]; });
      Object.keys(clean.weeks || {}).forEach(k => { if (!merged.weeks[k]) merged.weeks[k] = clean.weeks[k]; });
      const knownWishes = new Set(merged.method255.wishes.map(w => w.id));
      (clean.method255.wishes || []).forEach(w => { if (!knownWishes.has(w.id)) merged.method255.wishes.push(w); });
      state = merged;
    } else {
      state = clean;
    }
    save(true);
    emit();
    return true;
  }

  function reset() {
    state = blank();
    save(true);
    emit();
  }

  /* --- Öffentliche API --------------------------------------------- */

  return {
    VERSION, PROJECT_STATUS, PROJECT_STATUS_LABEL, GOAL_STATUS_LABEL,
    HORIZON_LABEL, IDEA_STATUS_LABEL, INBOX_KIND_LABEL, ACCENTS, AREA_COLORS,

    init, subscribe, emit, update, silent, save, isEmpty, isFresh,
    get state() { return state; },

    getDay, ensureDay, getWeek, ensureWeek,
    find, all, setField, remove, nextOrder,

    addTask, addProject, addGoal, addIdea, addInbox, addArea, addHabit,
    addSeason, addReview, addTemplate,

    areas, area, habits, habitDone, toggleHabit,
    tasks, dayTasks, openDayTasks, unplannedTasks, toggleTask,
    projects, activeProjects, projectProgress,
    goals, seasonGoals, goalProgress, currentSeason, seasonProgress, orphanProjects,
    ideas, inbox, reviews, wishes, topWishes, avoidWishes,
    dayBlocks, dayPlannedHours, weekCapacity,
    archiveCounts, stats,

    exportData, exportFile, exportFileName, importData, reset
  };
})();


/* ===========================================================
   OS — UI-Bausteine
   Modal, Formular, Bestätigung, Toast, Drawer, Bausteine.
   =========================================================== */

OS.ui = (function () {
  'use strict';

  const U = OS.util;

  /* --- Toast ---------------------------------------------------- */

  function toast(message, action) {
    const wrap = document.getElementById('toast-wrap');
    if (!wrap) return;
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = '<span>' + U.esc(message) + '</span>';
    if (action && action.label) {
      const btn = document.createElement('button');
      btn.textContent = action.label;
      btn.addEventListener('click', () => { close(); action.onClick && action.onClick(); });
      el.appendChild(btn);
    }
    wrap.appendChild(el);
    let timer = setTimeout(close, action ? 7000 : 3600);
    function close() {
      clearTimeout(timer);
      el.style.transition = 'opacity 160ms';
      el.style.opacity = '0';
      setTimeout(() => el.remove(), 180);
    }
    return close;
  }

  /* --- Modal ---------------------------------------------------- */

  let openModals = [];

  function closeTopModal() {
    const top = openModals.pop();
    if (!top) return false;
    top.el.remove();
    if (top.onClose) top.onClose();
    if (!openModals.length) document.body.style.overflow = '';
    return true;
  }

  function closeAllModals() {
    while (openModals.length) closeTopModal();
  }

  /**
   * modal({ title, subtitle, body(html), footer(html), size, onMount(root, api) })
   * Rückgabe: { root, close }
   */
  function modal(opts) {
    const o = opts || {};
    const wrap = document.createElement('div');
    wrap.className = 'modal-wrap';

    const box = document.createElement('div');
    box.className = 'modal' + (o.size === 'lg' ? ' modal-lg' : o.size === 'sm' ? ' modal-sm' : '');
    box.setAttribute('role', 'dialog');
    box.setAttribute('aria-modal', 'true');

    box.innerHTML =
      '<button class="icon-btn modal-close" data-modal-close aria-label="Schließen">' + U.icons.close + '</button>' +
      (o.title || o.subtitle ? '<div class="modal-head">' +
        (o.title ? '<h2>' + U.esc(o.title) + '</h2>' : '') +
        (o.subtitle ? '<div class="modal-sub">' + U.esc(o.subtitle) + '</div>' : '') +
        '</div>' : '') +
      '<div class="modal-body">' + (o.body || '') + '</div>' +
      (o.footer ? '<div class="modal-foot">' + o.footer + '</div>' : '');

    wrap.appendChild(box);
    document.getElementById('modal-root').appendChild(wrap);
    document.body.style.overflow = 'hidden';

    const entry = { el: wrap, onClose: o.onClose };
    openModals.push(entry);

    const api = {
      root: box,
      wrap: wrap,
      close: function () {
        const i = openModals.indexOf(entry);
        if (i >= 0) openModals.splice(i, 1);
        wrap.remove();
        if (o.onClose) o.onClose();
        if (!openModals.length) document.body.style.overflow = '';
      }
    };

    wrap.addEventListener('mousedown', e => { if (e.target === wrap && o.dismissable !== false) api.close(); });
    box.querySelectorAll('[data-modal-close]').forEach(btn => btn.addEventListener('click', api.close));

    if (o.onMount) o.onMount(box, api);

    setTimeout(() => {
      const focusable = box.querySelector('[data-autofocus], input:not([type=hidden]), textarea, select, button.btn-primary');
      if (focusable) focusable.focus();
      U.autosizeAll(box);
    }, 30);

    return api;
  }

  /* --- Formular-Modal -------------------------------------------- */

  /**
   * Feldtypen: text, textarea, select, multiselect, date, number, range,
   *            checkbox, chips, note, section, hidden, tags
   */
  function fieldHtml(f) {
    const name = U.esc(f.name);
    const label = f.label ? '<span class="field-label">' + U.esc(f.label) + '</span>' : '';
    const help = f.help ? '<span class="field-help">' + U.esc(f.help) + '</span>' : '';
    const val = f.value === null || f.value === undefined ? '' : f.value;

    switch (f.type) {
      case 'section':
        return '<div class="field"><div class="overline" style="margin-top:6px">' + U.esc(f.label) + '</div>' +
          (f.help ? '<div class="field-help">' + U.esc(f.help) + '</div>' : '') + '</div>';

      case 'note':
        return '<div class="note ' + U.esc(f.tone || 'note-quiet') + '">' + (f.html || U.esc(f.text || '')) + '</div>';

      case 'hidden':
        return '<input type="hidden" name="' + name + '" value="' + U.esc(val) + '">';

      case 'textarea':
        return '<label class="field">' + label +
          '<textarea class="textarea" name="' + name + '" rows="' + (f.rows || 3) + '" placeholder="' + U.esc(f.placeholder || '') + '"' +
          (f.autofocus ? ' data-autofocus' : '') + '>' + U.esc(val) + '</textarea>' + help + '</label>';

      case 'select': {
        const options = (f.options || []).map(opt =>
          '<option value="' + U.esc(opt.value) + '"' + (String(opt.value) === String(val) ? ' selected' : '') + '>' +
          U.esc(opt.label) + '</option>').join('');
        return '<label class="field">' + label +
          '<select class="select" name="' + name + '"' + (f.autofocus ? ' data-autofocus' : '') + '>' + options + '</select>' + help + '</label>';
      }

      case 'multiselect': {
        const chosen = Array.isArray(val) ? val.map(String) : [];
        const chips = (f.options || []).map(opt =>
          '<button type="button" class="chip chip-btn' + (chosen.includes(String(opt.value)) ? ' is-on' : '') +
          '" data-multi="' + name + '" data-value="' + U.esc(opt.value) + '">' + U.esc(opt.label) + '</button>').join('');
        return '<div class="field">' + label +
          '<div class="chips" data-multi-group="' + name + '">' + (chips || '<span class="field-help">Noch nichts vorhanden.</span>') + '</div>' +
          '<input type="hidden" name="' + name + '" value="' + U.esc(chosen.join(',')) + '">' + help + '</div>';
      }

      case 'checkbox':
        return '<label class="field"><span class="switch-row">' +
          '<input type="checkbox" name="' + name + '"' + (val ? ' checked' : '') + '>' +
          '<span>' + U.esc(f.label) + '</span></span>' + help + '</label>';

      case 'date':
        return '<label class="field">' + label +
          '<input class="input" type="date" name="' + name + '" value="' + U.esc(val) + '">' + help + '</label>';

      case 'time':
        return '<label class="field">' + label +
          '<input class="input" type="time" name="' + name + '" value="' + U.esc(val) + '">' + help + '</label>';

      case 'number':
        return '<label class="field">' + label +
          '<input class="input" type="number" name="' + name + '" value="' + U.esc(val) + '"' +
          (f.min !== undefined ? ' min="' + f.min + '"' : '') +
          (f.max !== undefined ? ' max="' + f.max + '"' : '') +
          (f.step !== undefined ? ' step="' + f.step + '"' : '') + '>' + help + '</label>';

      case 'row':
        return '<div class="form-row">' + (f.fields || []).map(fieldHtml).join('') + '</div>';

      default:
        return '<label class="field">' + label +
          '<input class="input" type="text" name="' + name + '" value="' + U.esc(val) + '" placeholder="' +
          U.esc(f.placeholder || '') + '"' + (f.autofocus ? ' data-autofocus' : '') + '>' + help + '</label>';
    }
  }

  function collectValues(root) {
    const values = {};
    root.querySelectorAll('input, textarea, select').forEach(el => {
      if (!el.name) return;
      if (el.type === 'checkbox') values[el.name] = el.checked;
      else values[el.name] = el.value;
    });
    root.querySelectorAll('[data-multi-group]').forEach(group => {
      const name = group.getAttribute('data-multi-group');
      values[name] = Array.from(group.querySelectorAll('.chip.is-on')).map(c => c.getAttribute('data-value'));
    });
    return values;
  }

  /**
   * form({ title, subtitle, fields, submitLabel, onSubmit(values, api), extraFooter, size })
   */
  function form(opts) {
    const o = opts || {};
    const fields = (o.fields || []).filter(Boolean);
    const body = '<form data-os-form>' +
      '<div class="stack" style="gap:18px">' + fields.map(fieldHtml).join('') + '</div>' +
      '</form>';

    const footer =
      (o.extraFooter ? '<div class="foot-left">' + o.extraFooter + '</div>' : '') +
      '<button class="btn" data-modal-close type="button">' + U.esc(o.cancelLabel || 'Abbrechen') + '</button>' +
      '<button class="btn btn-primary" data-submit type="button">' + U.esc(o.submitLabel || 'Speichern') + '</button>';

    return modal({
      title: o.title,
      subtitle: o.subtitle,
      body: body,
      footer: footer,
      size: o.size,
      onClose: o.onClose,
      onMount: function (root, api) {
        const formEl = root.querySelector('[data-os-form]');

        root.querySelectorAll('[data-multi]').forEach(chip => {
          chip.addEventListener('click', () => chip.classList.toggle('is-on'));
        });

        function submit() {
          const values = collectValues(formEl);
          const result = o.onSubmit ? o.onSubmit(values, api) : undefined;
          if (result !== false) api.close();
        }

        root.querySelector('[data-submit]').addEventListener('click', submit);
        formEl.addEventListener('submit', e => { e.preventDefault(); submit(); });
        formEl.addEventListener('keydown', e => {
          if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); submit(); }
          if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.type !== 'checkbox') { e.preventDefault(); submit(); }
        });

        if (o.onMount) o.onMount(root, api);
      }
    });
  }

  /* --- Bestätigung ------------------------------------------------ */

  function confirm(opts) {
    const o = opts || {};
    return new Promise(resolve => {
      let decided = false;
      const api = modal({
        title: o.title || 'Sicher?',
        size: 'sm',
        body: '<p class="small" style="color:var(--ink-2);line-height:1.6">' + U.esc(o.text || '') + '</p>',
        footer: '<button class="btn" data-modal-close type="button">' + U.esc(o.cancelLabel || 'Abbrechen') + '</button>' +
          '<button class="btn ' + (o.tone === 'danger' ? 'btn-danger' : 'btn-primary') + '" data-ok type="button">' +
          U.esc(o.confirmLabel || 'Ja') + '</button>',
        onClose: () => { if (!decided) resolve(false); },
        onMount: function (root) {
          root.querySelector('[data-ok]').addEventListener('click', () => {
            decided = true;
            api.close();
            resolve(true);
          });
        }
      });
    });
  }

  /** Einzeiliger Text-Dialog */
  function prompt(opts) {
    const o = opts || {};
    return new Promise(resolve => {
      let decided = false;
      form({
        title: o.title,
        subtitle: o.subtitle,
        size: 'sm',
        submitLabel: o.submitLabel || 'Übernehmen',
        fields: [{
          name: 'value',
          type: o.multiline ? 'textarea' : 'text',
          label: o.label,
          value: o.value || '',
          placeholder: o.placeholder || '',
          autofocus: true,
          rows: o.rows
        }],
        onSubmit: values => {
          decided = true;
          resolve(String(values.value || '').trim());
        },
        onClose: () => { if (!decided) resolve(null); }
      });
    });
  }

  /* --- Drawer ------------------------------------------------------ */

  let drawerState = { open: false, render: null };

  function openDrawer(renderFn) {
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    drawerState = { open: true, render: renderFn };
    drawer.hidden = false;
    drawer.removeAttribute('aria-hidden');
    overlay.hidden = false;
    renderDrawer();
    setTimeout(() => {
      const input = drawer.querySelector('[data-autofocus]');
      if (input) input.focus();
    }, 40);
  }

  function renderDrawer() {
    if (!drawerState.open || !drawerState.render) return;
    const drawer = document.getElementById('drawer');
    drawer.innerHTML = drawerState.render();
  }

  function closeDrawer() {
    const drawer = document.getElementById('drawer');
    const overlay = document.getElementById('overlay');
    drawerState.open = false;
    drawer.hidden = true;
    drawer.setAttribute('aria-hidden', 'true');
    drawer.innerHTML = '';
    overlay.hidden = true;
  }

  function isDrawerOpen() { return drawerState.open; }

  /* --- Bausteine ---------------------------------------------------- */

  function checkbox(done, attrs) {
    return '<button class="check' + (done ? ' is-done' : '') + '" ' + (attrs || '') +
      ' aria-pressed="' + (done ? 'true' : 'false') + '" aria-label="' + (done ? 'Erledigt' : 'Offen') + '">' +
      U.icons.check + '</button>';
  }

  function areaChip(areaId) {
    const a = OS.store.area(areaId);
    if (!a) return '';
    return '<span class="chip" style="color:' + U.esc(a.color) + '">' +
      '<i class="chip-dot"></i>' + U.esc(a.name) + '</span>';
  }

  function projectChip(projectId) {
    const p = OS.store.find('project', projectId);
    if (!p) return '';
    return '<span class="chip">' + U.esc(U.trunc(p.name || 'Projekt', 30)) + '</span>';
  }

  function statusChip(status) {
    const label = OS.store.PROJECT_STATUS_LABEL[status] || status;
    return '<span class="chip"><i class="dot dot-' + U.esc(status) + '"></i>' + U.esc(label) + '</span>';
  }

  function progressBar(pct, variant) {
    const v = U.clamp(Math.round(pct || 0), 0, 100);
    return '<div class="progress ' + (variant || '') + '"><i style="width:' + v + '%"></i></div>';
  }

  function emptyState(title, text, actionHtml) {
    return '<div class="empty">' +
      (title ? '<div class="empty-title">' + U.esc(title) + '</div>' : '') +
      (text ? '<div>' + U.esc(text) + '</div>' : '') +
      (actionHtml ? '<div style="margin-top:14px">' + actionHtml + '</div>' : '') +
      '</div>';
  }

  function iconBtn(icon, action, title, data) {
    return '<button class="icon-btn" style="width:26px;height:26px" data-act="' + U.esc(action) + '" ' +
      (data || '') + ' title="' + U.esc(title || '') + '" aria-label="' + U.esc(title || '') + '">' +
      U.icons[icon] + '</button>';
  }

  function areaOptions(selectedId, emptyLabel) {
    const list = OS.store.areas();
    return [{ value: '', label: emptyLabel || 'Kein Lebensbereich' }]
      .concat(list.map(a => ({ value: a.id, label: a.name })));
  }

  function goalOptions(emptyLabel) {
    const season = OS.store.currentSeason();
    const list = OS.store.goals({ open: true });
    return [{ value: '', label: emptyLabel || 'Kein Ziel' }].concat(list.map(g => ({
      value: g.id,
      label: (g.seasonId && season && g.seasonId === season.id ? '◆ ' : '') + (g.title || 'Ohne Titel')
    })));
  }

  function projectOptions(emptyLabel) {
    const list = OS.store.projects({ live: true });
    return [{ value: '', label: emptyLabel || 'Kein Projekt' }]
      .concat(list.map(p => ({ value: p.id, label: p.name || 'Ohne Titel' })));
  }

  return {
    toast, modal, form, confirm, prompt, closeTopModal, closeAllModals,
    openDrawer, closeDrawer, renderDrawer, isDrawerOpen,
    checkbox, areaChip, projectChip, statusChip, progressBar, emptyState, iconBtn,
    areaOptions, goalOptions, projectOptions, collectValues
  };
})();

OS.forms = (function () {
  'use strict';

  const U = OS.util;
  const S = OS.store;

  /* --- Zusammenfassung einer Framework-Vorlage ------------------- */

  function summarize(goal) {
    if (!goal) return '';
    const fw = OS.frameworks[goal.framework && goal.framework.type] || OS.frameworks.frei;
    const values = (goal.framework && goal.framework.fields) || {};
    const parts = fw.fields
      .map(f => (values[f.key] || '').trim())
      .filter(Boolean);
    if (!parts.length) return '';
    return fw.fields
      .filter(f => (values[f.key] || '').trim())
      .map(f => f.label + ': ' + values[f.key].trim())
      .join('\n');
  }

  /* --- Aufgabe ---------------------------------------------------- */

  function task(id, defaults) {
    const existing = id ? S.find('task', id) : null;
    const t = existing || Object.assign({
      title: '', notes: '', date: null, projectId: null, goalId: null, areaId: null
    }, defaults || {});

    OS.ui.form({
      title: existing ? 'Aufgabe' : 'Neue Aufgabe',
      submitLabel: existing ? 'Speichern' : 'Anlegen',
      extraFooter: existing ? '<button class="btn btn-quiet btn-sm" data-del type="button">Löschen</button>' : '',
      fields: [
        { name: 'title', label: 'Aufgabe', value: t.title, placeholder: 'Eine konkrete Handlung', autofocus: true },
        {
          type: 'row', fields: [
            { name: 'date', type: 'date', label: 'Geplant für', value: t.date || '' },
            { name: 'projectId', type: 'select', label: 'Projekt', value: t.projectId || '', options: OS.ui.projectOptions() }
          ]
        },
        {
          type: 'row', fields: [
            { name: 'goalId', type: 'select', label: 'Ziel', value: t.goalId || '', options: OS.ui.goalOptions() },
            { name: 'areaId', type: 'select', label: 'Lebensbereich', value: t.areaId || '', options: OS.ui.areaOptions() }
          ]
        },
        { name: 'notes', type: 'textarea', label: 'Notiz', value: t.notes, rows: 3, placeholder: 'Optional' }
      ],
      onMount: function (root, api) {
        const del = root.querySelector('[data-del]');
        if (del) del.addEventListener('click', async () => {
          const ok = await OS.ui.confirm({ title: 'Aufgabe löschen?', text: 'Die Aufgabe wird entfernt. Alternativ kannst du sie archivieren.', confirmLabel: 'Löschen', tone: 'danger' });
          if (ok) { S.update(() => S.remove('task', id)); api.close(); }
        });
      },
      onSubmit: function (v) {
        const title = String(v.title || '').trim();
        if (!title) { OS.ui.toast('Die Aufgabe braucht einen Satz.'); return false; }
        S.update(() => {
          const target = existing || S.addTask({});
          target.title = title;
          target.notes = v.notes || '';
          target.date = v.date || null;
          target.projectId = v.projectId || null;
          target.goalId = v.goalId || null;
          target.areaId = v.areaId || null;
        });
      }
    });
  }

  /* --- Zeitblock --------------------------------------------------- */

  function block(dateKey, blockId) {
    const day = S.getDay(dateKey);
    const existing = blockId ? day.blocks.find(b => b.id === blockId) : null;
    const b = existing || { start: '09:00', end: '10:30', label: '', type: 'fokus', taskId: null };

    OS.ui.form({
      title: existing ? 'Zeitblock' : 'Neuer Zeitblock',
      subtitle: U.fmtLong(dateKey),
      submitLabel: existing ? 'Speichern' : 'Anlegen',
      extraFooter: existing ? '<button class="btn btn-quiet btn-sm" data-del type="button">Entfernen</button>' : '',
      fields: [
        { name: 'label', label: 'Bezeichnung', value: b.label, placeholder: 'Woran arbeitest du?', autofocus: true },
        {
          type: 'row', fields: [
            { name: 'start', type: 'time', label: 'Von', value: b.start },
            { name: 'end', type: 'time', label: 'Bis', value: b.end }
          ]
        },
        {
          type: 'row', fields: [
            {
              name: 'type', type: 'select', label: 'Art', value: b.type, options: [
                { value: 'fokus', label: 'Fokusblock' },
                { value: 'termin', label: 'Termin' },
                { value: 'pause', label: 'Pause / Puffer' }
              ]
            },
            { name: 'taskId', type: 'select', label: 'Aufgabe', value: b.taskId || '', options: taskOptions(dateKey) }
          ]
        }
      ],
      onMount: function (root, api) {
        const del = root.querySelector('[data-del]');
        if (del) del.addEventListener('click', () => {
          S.update(() => {
            const d = S.ensureDay(dateKey);
            const i = d.blocks.findIndex(x => x.id === blockId);
            if (i >= 0) d.blocks.splice(i, 1);
          });
          api.close();
        });
      },
      onSubmit: function (v) {
        const start = v.start || '09:00';
        const end = v.end || '10:00';
        if (U.toMinutes(end) !== null && U.toMinutes(start) !== null && U.toMinutes(end) <= U.toMinutes(start)) {
          OS.ui.toast('Das Ende liegt vor dem Anfang.');
          return false;
        }
        S.update(() => {
          const d = S.ensureDay(dateKey);
          const target = existing || { id: U.uid('b') };
          target.start = start;
          target.end = end;
          target.label = String(v.label || '').trim() || (v.type === 'pause' ? 'Pause' : 'Fokus');
          target.type = v.type || 'fokus';
          target.taskId = v.taskId || null;
          if (!existing) d.blocks.push(target);
        });
      }
    });
  }

  function taskOptions(dateKey) {
    const list = S.tasks({ status: 'open' })
      .filter(t => !t.date || t.date === dateKey);
    return [{ value: '', label: 'Keine Aufgabe' }]
      .concat(list.map(t => ({ value: t.id, label: U.trunc(t.title, 46) })));

        { name: 'nextAction', label: 'Nächste konkrete Handlung', value: (defaults && defaults.nextAction) || '', placeholder: 'Der kleinste nächste Schritt' },
        {

        },
        {
          type: 'row', fields: [
            { name: 'areaId', type: 'select', label: 'Lebensbereich', value: (defaults && defaults.areaId) || '', options: OS.ui.areaOptions() },
            {
              name: 'status', type: 'select', label: 'Status', value: (defaults && defaults.status) || 'geplant',
              options: S.PROJECT_STATUS.filter(s => s !== 'archiviert').map(s => ({ value: s, label: S.PROJECT_STATUS_LABEL[s] }))
            }
          ]
        },
        {
          type: 'row', fields: [
            { name: 'start', type: 'date', label: 'Start', value: '' },
            { name: 'due', type: 'date', label: 'Frist', value: '' }
          ]
        }
      ],
      onSubmit: function (v) {
        const name = String(v.name || '').trim();
        if (!name) { OS.ui.toast('Das Projekt braucht einen Namen.'); return false; }
        if (v.status === 'aktiv' && !canActivate()) {
          OS.ui.toast('Fünf aktive Projekte sind genug. Es wird als geplant angelegt.');
          v.status = 'geplant';
        }
        let created;
        S.update(() => {
          created = S.addProject({
            name: name,
            why: v.why || '',
            outcome: v.outcome || '',
            nextAction: v.nextAction || '',
            areaId: v.areaId || null,
            goalIds: Array.isArray(v.goalIds) ? v.goalIds : [],
            status: v.status || 'geplant',
            start: v.start || null,
            due: v.due || null
          });
        });
        if (created && !created.goalIds.length) {
          OS.ui.toast('Dieses Projekt zahlt auf kein Ziel ein. Vielleicht ist dies eine Idee für später.');
        }
        if (created) setTimeout(() => projectDetail(created.id), 60);
      }
    });
  }

  function canActivate(excludeId) {
    const max = S.state.settings.maxActiveProjects || 5;
    return S.activeProjects().filter(p => p.id !== excludeId).length < max;
  }

  /* --- Projekt: Detail (lebendes Dokument) ------------------------- */

  let openDetail = null;

  function detailModal(renderFn, opts) {
    const api = OS.ui.modal(Object.assign({
      size: 'lg',
      body: renderFn(),
      onClose: function () { openDetail = null; }
    }, opts || {}));
    openDetail = {
      api: api,
      render: renderFn,
      refresh: function () {
        const body = api.root.querySelector('.modal-body');
        if (!body) return;
        const scroll = api.wrap.scrollTop;
        body.innerHTML = renderFn();
        U.autosizeAll(body);
        api.wrap.scrollTop = scroll;
      }
    };
    U.autosizeAll(api.root);
    return api;
  }

  function refresh() { if (openDetail) openDetail.refresh(); }

  function projectDetail(id) {
    const render = function () {
      const p = S.find('project', id);
      if (!p) return '<div class="empty">Dieses Projekt gibt es nicht mehr.</div>';
      const progress = S.projectProgress(p);
      const linkedGoals = (p.goalIds || []).map(gid => S.find('goal', gid)).filter(Boolean);
      const tasks = S.tasks({ projectId: p.id, notArchived: true });

      return '' +
        '<div class="stack" style="gap:6px">' +
          '<span class="overline">Projekt</span>' +
          '<input class="line-input serif-input" value="' + U.esc(p.name) + '" placeholder="Name des Projekts" data-store="project:' + p.id + ':name">' +
        '</div>' +

        '<div class="form-row">' +
          '<label class="field"><span class="field-label">Status</span>' +
            '<select class="select" data-store="project:' + p.id + ':status" data-rerender data-guard="project-status">' +
              S.PROJECT_STATUS.map(s => '<option value="' + s + '"' + (p.status === s ? ' selected' : '') + '>' + S.PROJECT_STATUS_LABEL[s] + '</option>').join('') +
            '</select></label>' +
          '<label class="field"><span class="field-label">Lebensbereich</span>' +
            '<select class="select" data-store="project:' + p.id + ':areaId" data-rerender>' +
              OS.ui.areaOptions().map(o => '<option value="' + U.esc(o.value) + '"' + ((p.areaId || '') === o.value ? ' selected' : '') + '>' + U.esc(o.label) + '</option>').join('') +
            '</select></label>' +
        '</div>' +

        '<label class="field"><span class="field-label">Warum</span>' +
          '<textarea class="textarea" rows="2" placeholder="Warum ist das wichtig?" data-store="project:' + p.id + ':why">' + U.esc(p.why) + '</textarea></label>' +

        '<label class="field"><span class="field-label">Gewünschtes Ergebnis</span>' +
          '<textarea class="textarea" rows="2" placeholder="Woran erkennst du, dass es fertig ist?" data-store="project:' + p.id + ':outcome">' + U.esc(p.outcome) + '</textarea></label>' +

        '<label class="field"><span class="field-label">Nächste konkrete Handlung</span>' +
          '<input class="input" value="' + U.esc(p.nextAction) + '" placeholder="Der kleinste nächste Schritt" data-store="project:' + p.id + ':nextAction">' +
          '<span class="field-help">Diese Handlung erscheint in der Wochenansicht.</span></label>' +

        '<div class="form-row">' +
          '<label class="field"><span class="field-label">Start</span>' +
            '<input class="input" type="date" value="' + U.esc(p.start || '') + '" data-store="project:' + p.id + ':start"></label>' +
          '<label class="field"><span class="field-label">Frist oder Zeitraum</span>' +
            '<input class="input" type="date" value="' + U.esc(p.due || '') + '" data-store="project:' + p.id + ':due"></label>' +
        '</div>' +

        '<div class="field">' +
          '<span class="field-label">Zahlt ein auf</span>' +
          '<div class="chips">' +
            S.goals({ open: true }).map(g =>
              '<button class="chip chip-btn' + ((p.goalIds || []).includes(g.id) ? ' is-on' : '') + '" data-act="os.projectGoalToggle" data-id="' + p.id + '" data-goal="' + g.id + '">' +
              U.esc(U.trunc(g.title || 'Ohne Titel', 34)) + '</button>').join('') +
            '<button class="chip chip-btn" data-act="os.goalNew" data-project="' + p.id + '">' + U.icons.plus + ' Ziel</button>' +
          '</div>' +
          (!linkedGoals.length ? '<span class="field-help" style="color:var(--warn)">Dieses Projekt zahlt auf kein Ziel ein. Vielleicht ist dies eine Idee für später.</span>' : '') +
        '</div>' +

        '<div class="field">' +
          '<div class="spread"><span class="field-label">Meilensteine</span>' +
            '<span class="tiny muted">' + progress + ' %</span></div>' +
          OS.ui.progressBar(progress) +
          '<div style="margin-top:8px">' +
            (p.milestones || []).map(m =>
              '<div class="milestone-row' + (m.done ? ' is-done' : '') + '">' +
                OS.ui.checkbox(m.done, 'data-act="os.milestoneToggle" data-id="' + p.id + '" data-ms="' + m.id + '"') +
                '<input class="line-input ms-title" value="' + U.esc(m.title) + '" data-store="milestone:' + p.id + '.' + m.id + ':title">' +
                (m.due ? '<span class="tiny muted">' + U.fmtShort(m.due) + '</span>' : '') +
                OS.ui.iconBtn('trash', 'os.milestoneRemove', 'Entfernen', 'data-id="' + p.id + '" data-ms="' + m.id + '"') +

          '</div>' +

        '<div class="field">' +
          '<div class="spread"><span class="field-label">Aufgaben</span>' +
            '<button class="btn btn-quiet btn-sm" data-act="os.taskNew" data-project="' + p.id + '">' + U.icons.plus + ' Aufgabe</button></div>' +
          (tasks.length ? '<div class="list">' + tasks.map(t =>
            '<div class="list-item' + (t.status === 'done' ? ' is-done' : '') + '">' +
              OS.ui.checkbox(t.status === 'done', 'data-act="os.taskToggle" data-id="' + t.id + '"') +
              '<div class="li-main"><div class="li-title">' + U.esc(t.title) + '</div>' +
                (t.date ? '<div class="li-meta"><span class="chip">' + U.esc(U.fmtRelative(t.date)) + '</span></div>' : '') +
              '</div>' +
              '<div class="li-actions">' + OS.ui.iconBtn('edit', 'os.taskEdit', 'Bearbeiten', 'data-id="' + t.id + '"') + '</div>' +
            '</div>').join('') + '</div>'
            : '<span class="field-help">Noch keine Aufgaben.</span>') +
        '</div>' +

        '<label class="field"><span class="field-label">Notizen und Ressourcen</span>' +
          '<textarea class="textarea" rows="4" placeholder="Gedanken, Links, Material" data-store="project:' + p.id + ':notes">' + U.esc(p.notes) + '</textarea></label>' +

        '<div class="row" style="justify-content:flex-end;gap:8px;padding-top:6px;border-top:1px solid var(--line)">' +

          '<button class="btn btn-sm" data-act="os.projectArchive" data-id="' + p.id + '">Archivieren</button>' +
          '<button class="btn btn-sm btn-primary" data-modal-close>Fertig</button>' +

    };

    detailModal(render, { title: null });
  }

  /* --- Ziel --------------------------------------------------------- */

  function goal(defaults) {
    const d = defaults || {};
    const season = S.currentSeason();

    OS.ui.form({
      title: 'Neues Ziel',
      subtitle: 'Ein Ziel ist noch kein Projekt. Es beschreibt, was wahr sein soll.',
      submitLabel: 'Anlegen',
      size: 'lg',
      fields: [
        { name: 'title', label: 'Ziel', value: d.title || '', placeholder: 'Was soll am Ende wahr sein?', autofocus: true },
        { name: 'why', type: 'textarea', rows: 2, label: 'Warum', value: d.why || '', placeholder: 'Was macht es dir wichtig?' },
        { name: 'metric', type: 'textarea', rows: 2, label: 'Messgröße oder Erfolgsdefinition', value: d.metric || '', placeholder: 'Woran erkennst du, dass es erreicht ist?' },
        {
          type: 'row', fields: [
            {
              name: 'horizon', type: 'select', label: 'Zeithorizont', value: d.horizon || 'saison',
              options: [
                { value: 'saison', label: 'Saison' },
                { value: 'jahr', label: 'Jahr' },
                { value: 'lang', label: 'Langfristig' }
              ]
            },
            { name: 'areaId', type: 'select', label: 'Lebensbereich', value: d.areaId || '', options: OS.ui.areaOptions() }
          ]
        },
        {
          type: 'row', fields: [
            {
              name: 'seasonId', type: 'select', label: 'Saison', value: d.seasonId || (season ? season.id : ''),
              options: [{ value: '', label: 'Keiner Saison zugeordnet' }].concat(
                S.state.seasons.filter(s => !s.archived).map(s => ({ value: s.id, label: s.title || 'Saison' })))
            },
            {
              name: 'framework', type: 'select', label: 'Vorlage (freiwillig)', value: d.framework || 'frei',
              options: Object.keys(OS.frameworks).map(k => ({ value: k, label: OS.frameworks[k].label }))
            }
          ]
        },
        {
          type: 'note', tone: 'note-quiet',
          text: 'Vorlagen helfen beim Denken. Du kannst sie später wechseln oder leer lassen.'
        }
      ],
      onSubmit: function (v) {
        const title = String(v.title || '').trim();
        if (!title) { OS.ui.toast('Das Ziel braucht einen Namen.'); return false; }
        let created;
        S.update(() => {
          created = S.addGoal({
            title: title,
            why: v.why || '',
            metric: v.metric || '',
            horizon: v.horizon || 'saison',
            areaId: v.areaId || null,
            seasonId: v.horizon === 'saison' ? (v.seasonId || null) : (v.seasonId || null),
            framework: { type: v.framework || 'frei', fields: {} },
            fromWishId: d.fromWishId || null
          });
          if (d.projectId) {
            const p = S.find('project', d.projectId);
            if (p && !p.goalIds.includes(created.id)) p.goalIds.push(created.id);
          }
        });
        if (created && (v.framework && v.framework !== 'frei')) setTimeout(() => goalDetail(created.id), 60);
      }
    });
  }

  function goalDetail(id) {
    const render = function () {
      const g = S.find('goal', id);
      if (!g) return '<div class="empty">Dieses Ziel gibt es nicht mehr.</div>';
      const fwType = (g.framework && g.framework.type) || 'frei';
      const fw = OS.frameworks[fwType] || OS.frameworks.frei;
      const values = (g.framework && g.framework.fields) || {};
      const linked = S.projects({ goalId: g.id });
      const progress = S.goalProgress(g);

      return '' +
        '<div class="stack" style="gap:6px">' +
          '<span class="overline">Ziel · ' + U.esc(S.HORIZON_LABEL[g.horizon] || '') + '</span>' +
          '<input class="line-input serif-input" value="' + U.esc(g.title) + '" placeholder="Name des Ziels" data-store="goal:' + g.id + ':title">' +
        '</div>' +

        '<div class="form-row">' +
          '<label class="field"><span class="field-label">Status</span>' +
            '<select class="select" data-store="goal:' + g.id + ':status" data-rerender>' +
              Object.keys(S.GOAL_STATUS_LABEL).map(s => '<option value="' + s + '"' + (g.status === s ? ' selected' : '') + '>' + S.GOAL_STATUS_LABEL[s] + '</option>').join('') +
            '</select></label>' +
          '<label class="field"><span class="field-label">Lebensbereich</span>' +
            '<select class="select" data-store="goal:' + g.id + ':areaId" data-rerender>' +
              OS.ui.areaOptions().map(o => '<option value="' + U.esc(o.value) + '"' + ((g.areaId || '') === o.value ? ' selected' : '') + '>' + U.esc(o.label) + '</option>').join('') +
            '</select></label>' +
        '</div>' +

        '<div class="form-row">' +
          '<label class="field"><span class="field-label">Zeithorizont</span>' +
            '<select class="select" data-store="goal:' + g.id + ':horizon" data-rerender>' +
              Object.keys(S.HORIZON_LABEL).map(h => '<option value="' + h + '"' + (g.horizon === h ? ' selected' : '') + '>' + S.HORIZON_LABEL[h] + '</option>').join('') +
            '</select></label>' +
          '<label class="field"><span class="field-label">Saison</span>' +
            '<select class="select" data-store="goal:' + g.id + ':seasonId" data-rerender>' +
              ['<option value="">Keiner Saison zugeordnet</option>'].concat(
                S.state.seasons.filter(s => !s.archived).map(s => '<option value="' + s.id + '"' + (g.seasonId === s.id ? ' selected' : '') + '>' + U.esc(s.title || 'Saison') + '</option>')).join('') +
            '</select></label>' +
        '</div>' +

        '<label class="field"><span class="field-label">Warum</span>' +
          '<textarea class="textarea" rows="2" data-store="goal:' + g.id + ':why" placeholder="Was macht es dir wichtig?">' + U.esc(g.why) + '</textarea></label>' +

        '<label class="field"><span class="field-label">Messgröße oder Erfolgsdefinition</span>' +
          '<textarea class="textarea" rows="2" data-store="goal:' + g.id + ':metric" placeholder="Woran erkennst du, dass es erreicht ist?">' + U.esc(g.metric) + '</textarea></label>' +

        '<div class="form-row">' +
          '<label class="field"><span class="field-label">Zeitraum von</span>' +
            '<input class="input" type="date" value="' + U.esc(g.start || '') + '" data-store="goal:' + g.id + ':start"></label>' +
          '<label class="field"><span class="field-label">bis</span>' +
            '<input class="input" type="date" value="' + U.esc(g.end || '') + '" data-store="goal:' + g.id + ':end"></label>' +
        '</div>' +

        '<div class="field">' +
          '<span class="field-label">Vorlage</span>' +
          '<div class="chips">' +
            Object.keys(OS.frameworks).map(k =>
              '<button class="chip chip-btn' + (fwType === k ? ' is-on' : '') + '" data-act="os.goalFramework" data-id="' + g.id + '" data-fw="' + k + '">' +
              U.esc(OS.frameworks[k].label) + '</button>').join('') +
          '</div>' +
          '<span class="field-help">' + U.esc(fw.desc) + '</span>' +
        '</div>' +

        (fw.fields.length ? '<div class="stack" style="gap:14px;padding:16px 18px;background:var(--surface-2);border-radius:var(--radius)">' +
          fw.fields.map(f =>
            '<label class="field"><span class="field-label">' + U.esc(f.label) + '</span>' +
            (f.multiline
              ? '<textarea class="textarea" rows="3" placeholder="' + U.esc(f.placeholder) + '" data-store="goal:' + g.id + ':framework.fields.' + f.key + '">' + U.esc(values[f.key] || '') + '</textarea>'
              : '<input class="input" value="' + U.esc(values[f.key] || '') + '" placeholder="' + U.esc(f.placeholder) + '" data-store="goal:' + g.id + ':framework.fields.' + f.key + '">') +
            '</label>').join('') +
          '<button class="btn btn-sm" style="align-self:flex-start" data-act="os.goalSummarize" data-id="' + g.id + '">Zu einer Zielkarte zusammenfassen</button>' +
        '</div>' : '') +

        (g.summary ? '<div class="note note-green"><div class="overline" style="margin-bottom:6px">Zielkarte</div>' + U.nl2br(g.summary) + '</div>' : '') +

        '<div class="field">' +
          '<span class="field-label">Fortschritt</span>' +
          '<div class="row" style="gap:16px">' +
            '<label class="row row-tight tiny"><input type="radio" name="pm-' + g.id + '" ' + (g.progressMode !== 'abgeleitet' ? 'checked' : '') + ' data-act="os.goalProgressMode" data-id="' + g.id + '" data-mode="manuell"> manuell</label>' +
            '<label class="row row-tight tiny"><input type="radio" name="pm-' + g.id + '" ' + (g.progressMode === 'abgeleitet' ? 'checked' : '') + ' data-act="os.goalProgressMode" data-id="' + g.id + '" data-mode="abgeleitet"> aus Meilensteinen</label>' +
          '</div>' +
          (g.progressMode === 'abgeleitet'
            ? '<div style="margin-top:10px">' + OS.ui.progressBar(progress) + '<span class="field-help">' + progress + ' % aus ' + linked.length + ' ' + U.plural(linked.length, 'Projekt', 'Projekten') + '</span></div>'
            : '<div class="progress-input" style="margin-top:10px">' +
              '<input type="range" min="0" max="100" step="5" value="' + progress + '" data-store="goal:' + g.id + ':progress" data-rerender>' +
              '<span class="progress-value">' + progress + ' %</span></div>') +
        '</div>' +

        '<div class="field">' +
          '<div class="spread"><span class="field-label">Zugeordnete Projekte</span>' +
            '<button class="btn btn-quiet btn-sm" data-act="os.projectNew" data-goal="' + g.id + '">' + U.icons.plus + ' Projekt</button></div>' +
          (linked.length ? '<div class="list">' + linked.map(p =>
            '<div class="list-item"><div class="li-main">' +
              '<button class="li-title link-btn" data-act="os.projectOpen" data-id="' + p.id + '">' + U.esc(p.name) + '</button>' +
              '<div class="li-meta">' + OS.ui.statusChip(p.status) + '<span class="chip">' + S.projectProgress(p) + ' %</span></div>' +
            '</div></div>').join('') + '</div>'
            : '<span class="field-help">Noch kein Projekt zugeordnet. Ziele dürfen auch ohne Projekt bestehen.</span>') +

        '<div class="row" style="justify-content:flex-end;gap:8px;padding-top:6px;border-top:1px solid var(--line)">' +
          '<button class="btn btn-quiet btn-sm" data-act="os.goalDelete" data-id="' + g.id + '">Löschen</button>' +
          '<button class="btn btn-sm btn-primary" data-modal-close>Fertig</button>' +
        '</div>';
    };

    detailModal(render);
